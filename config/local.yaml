# 컨테이너 프로필 — **`datagen.yaml` 위에 덮인다**
#
# `cli.load_cfg` 가 기본 파일을 읽고 이 파일을 그 위에 겹친다(2026-10-14).
# 그래서 **다른 값만 적는다** — 생성 모수·요율·보관 기간 같은 것을 여기
# 복사하면 설정이 두 벌이 되고, 한쪽만 고쳐질 때 조용히 어긋난다.
#
# 쓰는 쪽:
#   docker compose -f ../graphio-probe-rca/docker-compose.yml \
#     --profile pipe up -d --build
#
# compose 가 `run --config config/local.yaml` 로 부른다.
# 짝이 되는 읽는 쪽 설정은 graphio 의 `config/local.yaml` 이다.

# ── DB 접속 ──────────────────────────────────────────────────────────────
#
# **`127.0.0.1` 이 아니다.** 컨테이너 안에서 그 주소는 **자기 자신**이고,
# 실제로 이것 때문에 죽은 적이 있다:
#
#   pymysql.err.OperationalError: (2003, "Can't connect to MySQL server
#     on '127.0.0.1' ([Errno 111] Connection refused)")
#
# `graphio-mysql` 은 compose 서비스 이름이다 — 같은 네트워크(`graphio-net`)
# 안에서 DNS 로 풀린다. 호스트에서 직접 돌릴 때는 `datagen.yaml` 의
# `127.0.0.1` 이 그대로 쓰인다(이 파일을 주지 않으면 된다).
#
# `pemdb1` 섹션은 host·port·user 를 이 섹션에서 재사용하므로 여기만 고치면
# 상용 스키마 적재 경로도 따라온다.
mysql:
  host: graphio-mysql
  port: 3306

# ── 원시 Parquet 출력 — **컨테이너 안 경로다** ───────────────────────────
#
# 기본값은 `../graphio-probe-rca/data/uplane_raw` 로 **호스트 기준 상대경로**
# 이고 남의 저장소를 가리킨다. 컨테이너 안에서 `/app/../graphio-probe-rca/...`
# 는 존재하지 않는다 — 그대로 두면 생성기가 엉뚱한 곳에 쓰거나 실패한다.
#
# 호스트의 한 디렉터리를 **gen 은 `rw`, corr 은 `ro`** 로 같은 컨테이너 경로에
# 마운트한다. 좌변은 compose 의 `x-raw-mounts` anchor 한 곳에만 적혀 있고,
# 운영에서는 `GP_RAW_ROOT=/DATA1/summary` 로 그 좌변만 바뀐다.
#
# **읽는 쪽과 같은 값이어야 한다**(graphio `config/local.yaml` 의
# `paths.uplane_raw`·`cplane_raw`). 어긋나면 집계가 조용히 0행이 된다 —
# 에러가 나지 않는 종류다(`src/datagen/raw_parquet.py` 머리말).
#
# `retain_minutes` 는 적지 않는다. U-Plane 10분 · C-Plane 1440분이라는 판단은
# 환경과 무관하고, 여기 복사하면 기본값과 두 벌이 된다.
pemdb1:
  # 행정코드 crosswalk — **graphio 가 만드는 파일이다**(`python -m graphio geo-xw`).
  #
  # 기본값은 `../graphio-probe-rca/data/geo/...` 로 **호스트 상대경로**이고 남의
  # 저장소를 가리킨다. 컨테이너에서는 `/app` 기준으로 풀려 `/graphio-probe-rca/...`
  # 가 되는데 그런 경로가 없다 — 실제로 gen 이 이것 때문에 재시작 루프에 빠졌다
  # (`RuntimeError: 행정코드 crosswalk 가 없다`).
  #
  # gen 이미지에는 이 파일이 없으므로 compose 가 호스트 것을 마운트한다
  # (`docker-compose.yml` 의 gen·gen-ui `volumes`).
  #
  # 없으면 **멈추는 것이 설계다** — 폴리곤 없는 동의 셀을 고르면 지도가 어긋나고
  # 그때는 어디서 어긋났는지 알 방법이 없다(`pemdb1.load_drawable_dongs`).
  # **JP 벌이다.** KR crosswalk 를 일본 셀에 걸면 우연히 겹치는 것만 맞아
  # 1,192셀 중 434개만 남는다(실측 · 64% 탈락).
  #
  # **나라별이다**(2026-10-30) — `datagen.yaml` 의 `pemdb1.by_locale` 에 병합되고
  # `locale` 이 고른다. 여기는 컨테이너 경로만 덮는다.
  by_locale:
    jp:
      geo_crosswalk: /app/data/geo/jp/code_crosswalk.json
      geo_boundary: /app/data/geo/jp/N03-21_210101.json
      geo_rail: /app/data/geo/jp/rail.json          # 철도 N02 (배경)
      geo_rivers: /app/data/geo/jp/rivers.json      # 하천 W05 (배경)
    kr:
      geo_crosswalk: /app/data/geo/code_crosswalk.json
      geo_boundary: /app/data/geo/skorea-submunicipalities-2018-geo.json
  geo_roads: /app/data/geo/jp/roads.json        # 도로 OSM (배경)
  geo_green: /app/data/geo/jp/green.json        # 공원·수역 OSM (배경)
  geo_station_bldg: /app/data/geo/jp/station_bldg.json  # 역 건물 OSM (배경)
  geo_boundary_map: /app/data/geo/jp/N03_map.json   # 행정경계 상세 (지도 전용)
  geo_water: /app/data/geo/jp/water.json            # 수역 relation OSM
  geo_chome: /app/data/geo/jp/chome.json            # 丁目 경계 e-Stat
  geo_dong_shapes: /app/data/geo/jp/dong_shapes.json  # 읍면동 모양 (graphio geo-chome)
  # 장애 현황을 받아 오는 graphio API. **컨테이너 안 이름이다**
  graphio_api: http://web:8008
  # 27번 지진 eNB 지반 증폭률(J-SHIS ARV · `tools/build_quake_arv.py` 가 만든다 · 2026-11-15). git 밖이지만
  # 이미지에는 `COPY data/` 로 들어간다 — gen 재빌드 뒤에 보인다. 파일이 없으면 경고 뒤 1.0(거리만)이다
  fault:
    quake_arv_path: /app/data/quake/enb_arv.csv
  # 장애 주입 정답 파일. **베이스값은 호스트 기준 상대경로**
  # (`../graphio-probe-rca/...`)라 컨테이너에서는 `/app/..` = `/` 로 풀려
  # `/graphio-probe-rca` 를 만들려다 `PermissionError` 로 **gen 이 죽는다**.
  # 장애가 처음 주입돼 `_live_truth` 가 불릴 때까지 드러나지 않았다
  # (2026-10-27). compose 가 graphio 의 `data/truth` 를 여기에 `rw` 로 건다.
  truth_out: /app/data/truth/ground_truth.json
  uplane_parquet:
    root: /app/data/uplane_raw
  cplane_parquet:
    root: /app/data/cplane_raw
