# probe-datagen 설정 — 1단계(성공 케이스 백필)
#
# 장비 토폴로지·셀은 data/cells.json · core_nodes.json 에 박혀 있다(구 저장소에서
# 생성한 350셀 세트). 바꾸려면 그 JSON 을 교체한다.

paths:
  data: data                    # cells.json · core_nodes.json · profile.json

generate:
  start: "2026-08-27 09:00:00"  # 백필 시작 (실시간 틱 단계에서는 now-N 으로)
  minutes: 60                   # 생성할 분 수
  aggregate_batch: 30           # N분 모아 한 번에 집계 (매 분 재스캔 회피)
  seed: 20260903
  backfill_minutes: 0           # **`run` 은 백필하지 않는다**(사람 지시). 과거 구간은
                                # `pemfill` 로만 만든다 — 데몬이 기동마다 과거를 다시
                                # 쓰면 주입해 둔 장애가 평시 데이터로 밀린다.
                                # 버린다 (며칠치를 메우면 재기동이 몇 시간이 된다)
  # ── 보존 — **시간 단위다**(2026-10-15) ────────────────────────────────
  # 전에는 `retention_days: 1` 이었고 그 값이 **일 파티션에만** 걸렸다. 원시
  # xDR(시간 파티션)은 코드 상수 `RETAIN_HOURS=24` 를 썼으므로, 여기서 값을
  # 바꿔도 원시는 꿈쩍하지 않았다 — 24 와 1×24 가 우연히 같아 **아무도
  # 몰랐다.** 이제 한 값이 두 입도를 함께 자른다(`cli._purge_pemdb1`).
  #
  # 구 키(`retention_days`)도 계속 읽는다(`cli._retention_default`) — 환경별
  # 설정 파일이 그것만 들고 있을 수 있다. 여기에 두 키를 같이 적지는 않는다.
  #
  # UI(:8009)와 DB(`CM_DATAGEN_CONFIG.retention_hours` · `retention_on`)가
  # 이 값을 이긴다 — 데몬이 10분마다 다시 읽으므로 재기동이 필요 없다.
  #
  # **일 파티션은 하루 입도로만 떨어진다.** 24 미만을 줘도 집계
  # `PM_*_1M` 은 최대 하루치가 남는다. 원시 Parquet 는 또 별개다
  # (`pemdb1.uplane_parquet.retain_minutes`).
  retention_hours: 24           # 로컬 PoC DB 는 하루만 둔다 — 10분마다 지난 파티션 정리

# 분당 생성 호수(계열별). 최소 표본 규칙(분모 20)을 넘기려면 셀 수 대비 넉넉해야
# 한다. 350셀에 lte 2000/분이면 셀당 ~6건 — 상위 집계(SGG/노드)에서 표본이 찬다.
rates:
  lte_call: 2000
  transport: 1500
  dns: 800
  http: 1200

mysql:
  host: 127.0.0.1               # 서버에서는 192.168.100.216
  port: 3306                    # 서버에서는 3307
  user: pem
  password: "tnsfPans2013^_"
  database: graphio

# ── 상용 스키마(pemdb1) 적재 — `pemfill` · `run` · `ui` ──────────────────
# **`run` 도 이 경로다.** 이 자리에 "기존 backfill/run 은 위의 mysql: (자체
# 창고 스키마)를 그대로 쓴다"고 적혀 있었는데 `run` 에는 더는 맞지 않는다 —
# 데몬이 `pemfill` 과 같은 쓰기 경로(`datagen.pemdb1`)로 옮겨 갔다
# (`cli.cmd_run` 머리말 "왜 경로를 바꿨나"). 위의 `mysql:`/`rates:` 를 쓰는
# 것은 구 `backfill` 명령 하나뿐이다.
#
# 상용은 테이블·컬럼이 다른 별도 경로이므로 설정도 분리한다.
# 섹션 이름 `pemdb1` 은 **설정 키**다(코드가 `cfg.get("pemdb1")` 로 찾는다).
# 스키마 이름이 아니다 — 그건 아래 `database:` 다. 둘이 달라도 맞다.
pemdb1:
  # **`pemdb6` 다. `pemdb1` 이 아니다(2026-10-13 결정).** PoC 서버의 기존
  # `pemdb1` 은 손대지 않고 그대로 두고, 우리가 쓰는 스키마를 따로 만든다.
  # 생성기가 쓰는 쪽이라 **여기가 틀리면 남의 스키마에 XDR 을 쏟아붓는다.**
  # graphio 쪽 `config/*.yaml` 의 `store.mysql.database` 와 같아야 한다.
  database: pemdb6              # 같은 서버의 다른 DB — host/port/user 는 mysql: 재사용
  subscriber_pool: 20000        # 가입자 풀
  # 생성 대상 eNB 수. 마스터 전량(eNB 32,121 · 셀 571,801)에 분당 수천 호를
  # 흘리면 eNB 당 표본이 1건 미만이 되어 어떤 창에서도 판정이 서지 않는다
  # (최소 표본 20 · 불변규칙 5). 0 이면 전량.
  enb_limit: 60
  success_only: true            # 평시 전부 녹색 — 실패는 fault 주입으로만 만든다
  # 희소 Call Type 의 **최소 비율**. 실측 그대로 뽑으면 분당 20,000호에서도
  # Attach MT(0.0024%)가 0.5건/분, Detach MO 가 2.8건/분이라 **최소 표본 20**
  # (불변규칙 5)을 어떤 창에서도 못 채운다 — 그 절차가 화면·탐지·RCA 에
  # 한 번도 나타나지 않고, 에러도 나지 않는다.
  #
  # 0.003(0.3%) 이면 분당 60건이라 1분 창에서 분모가 찬다. 구성비는 그대로다 —
  # Service(3·4)가 여전히 95% 이상이고 Attach 는 적다.
  #
  # **0 으로 두면 실측 분포 그대로** 돈다. 실제 운영 구성비로 채점·검증해야
  # 할 때 그렇게 한다. 코드 기본값은 `pemdb1.Distributions.CALL_TYPE_FLOOR`.
  call_type_floor: 0.003
  # 행정코드 crosswalk — **셀 선택을 "폴리곤이 있는 동"으로 한정한다.**
  # 번들 경계 geojson 은 행정동(3,504), pemdb1 은 법정동(8,079)이라 `종로1·2·3·4가동`
  # 류는 대응 행이 원리상 없다. 이름이 우연히 같은 2,868개만 crosswalk 가 맞췄고,
  # 아무렇게나 셀을 고르면 읍면동 지도의 절반이 회색으로 남아 운영자가 "그 지역
  # 문제 없음"으로 읽는다(불변규칙 12). 마스터 44만 셀 중 22만이 폴리곤 있는 동에
  # 속하므로 좁혀도 셀은 넉넉히 남는다(실측 eNB 22,722).
  # 파일이 없으면 pemfill 이 멈춘다 — graphio 쪽 `python -m graphio geo-xw` 로 만든다.
  geo_crosswalk: ../graphio-probe-rca/data/geo/code_crosswalk.json
  rates:
    # 분당 호 수(주간 피크 기준 — 야간은 DIURNAL 곡선으로 0.14배까지 내려간다).
    # eNB 60개 · 셀 2,161개에 20,000/분이면 eNB 당 ~330건 · 셀당 ~9건이다.
    # eNB 축은 1분 창에서 최소 표본 20을 넘고, 셀 축은 5분 창에서 찬다
    # (불변규칙 5). 적재 실측 11,000건/1초 — 더 올려도 병목은 아니다.
    lte_call: 20000
    # ── 생성량 비율(%) — **100% 기준 위에 걸린다** (2026-10-14) ──────────
    # 위 절대값이 100% 이고 이 값이 실제 생성량을 정한다. 70% 면 분당
    # 14,000호다. **UI(:8009)에서 바꿀 수 있고 DB 값이 이것을 이긴다**
    # (`CM_DATAGEN_CONFIG.volume_pct`) — 데몬이 매 분 다시 읽으므로
    # 재기동이 필요 없다.
    #
    # 절대값을 직접 내리지 않는 이유: 100% 기준이 남아 있어야 "지금 얼마나
    # 줄여 둔 상태인가"를 알 수 있다. 20,000 이 원래 값인지 누가 내린 값인지
    # 구분되지 않으면 표본 부족(불변규칙 5)을 진단할 수 없다.
    #
    # **70% 는 사람이 정했다**(2026-10-14) — 노트북에서 돌리는 PoC 라
    # 디스크·메모리를 아끼려는 것이고 품질 판정과는 무관하다. 셀당 호 수가
    # 9건에서 6.3건으로 줄지만 5분 창에서 최소 표본 20을 여전히 넘는다.
    #
    # **30% 로 내렸다**(2026-10-15 사람 지시 "적당히"). 분당 6,000호 ·
    # 셀당 2.8건이고 5분 창에서 14건, 15분 창에서 42건이라 셀 축 판정이
    # 선다. DB 가 하루 4GB 로 buffer pool 2GB 를 12시간 만에 채운다 —
    # 70% 의 5.2시간보다 여유가 있다.
    volume_pct: 30
    # ── U-Plane(서비스품질) — 로컬 Parquet 로 간다 ─────────────────────
    # **세션 모델 전환(2026-10-14)으로 이 세 값의 뜻이 바뀌었다.** 전에는
    # "분당 레코드 수"였고, 지금은 성공 호에서 파생되는 **파생 계수의 원천**
    # 이다. 숫자를 그대로 둔 것은 집계가 세는 양이 전후로 같게 하려는 것이다
    # (`src/datagen/session.py` 머리말 §1.4).
    #
    #   transport → 분당 **새 세션 수**(피크 기준). 정상 상태에서 종료
    #               레코드(ONGOINGFLAG 2·20) 수가 이 값이고, 집계는 종료
    #               레코드만 세므로 분모가 전과 같다.
    #   dns       → p_dns = dns / transport = 0.41 — DNS 질의를 하는 세션 비율
    #               (나머지는 캐시 히트)
    #   http      → 세션당 HTTP 트랜잭션 기대값 = http / transport = 0.68
    #
    # **원시 transport 레코드 수는 늘어난다** — 분당 활성 세션 수(= 새 세션 ×
    # 평균 수명)에 수렴한다. 평균 수명 2분이면 약 2배이고, 늘어난 쪽은 전부
    # Interim 이라 집계에 들어가지 않는다.
    #
    # **0 이면 그 계열을 만들지 않는다.** 위의 전역 `rates:` 값(transport
    # 1500 등)은 구 창고 세대의 350셀 기준이라 여기서 그대로 쓰면 셀당 1건
    # 미만이 되어 어떤 창에서도 판정이 서지 않는다(불변규칙 5).
    #
    # 셀 2,161개 기준 셀당 분당 **종료 레코드** 수와, 최소 표본 20을 넘는 창:
    #   transport 22,000 → 셀당 ~10건   5분 창 51건
    #   dns        9,000 → 셀당  ~4건   5분 창 21건
    #   http      15,000 → 셀당  ~7건   5분 창 35건
    # eNB 축(60개)은 세 계열 모두 1분 창에서 넘는다.
    #
    # **야간에는 셀 축 판정이 서지 않는다.** 시간대 곡선이 호 수·호당 세션
    # 수에 함께 걸려 04시 새 세션이 피크의 0.5배까지 내려간다 — transport 가
    # 셀당 5건/분이고 5분 창에서 25건으로 겨우 찬다. 표본이 없으면 판정하지
    # 않는 것이 맞고, 0 으로 채워 "정상"으로 보이게 하지 않는다(불변규칙 17).
    #
    # 1분 창에서 셀 단위 TCP 성공률(U-01)까지 세우려면 transport 를 43,000
    # 이상으로 올려야 한다(셀당 20건). 적재가 그만큼 무거워진다.
    transport: 22000
    dns: 9000
    http: 15000
  # ── U-Plane 세션 분포 모수 (2026-10-14) ───────────────────────────────
  # 코드 기본값은 `src/datagen/session.py` 의 `Shape` 다. 여기 적은 키만
  # 덮어쓰고, **모르는 키를 주면 멈춘다** — 오타가 "기본값으로 돌았다"로
  # 끝나지 않게 하려는 것이다.
  #
  # 양은 전부 random 이다(설계 §1.3). 고정 비율로 만들면 분포가 부자연스럽고
  # 최소 표본 규칙(불변규칙 5)이 실제로 걸리는지 확인할 수 없다.
  uplane_session:
    # 세션 길이(분) 평균 — 1 에서 잘린 기하분포. **이 값이 곧 transport 원시
    # 레코드의 증가 배수다**(활성 = 새 세션 × 평균 수명). 올리면 Interim 이
    # 늘고 생성·Parquet 비용이 비례해 늘지만 집계가 세는 수는 그대로다.
    span_mean: 2.0
    span_max: 10              # §1.3 의 "1~10분"
    sessions_max: 3           # 호당 세션 수 상한. 평균은 rates 에서 파생된다
    http_tx_mean: 3.5         # 세션당 HTTP 트랜잭션 m 의 평균 (§1.3 "1~20")
    http_tx_max: 20
    # "U 에 의한 종료" — C-Plane 은 정상인데 앱이 끊는다. `U-26`(HTTP
    # 무응답률)에만 드러난다. `U-23` 의 분모는 무응답을 빼므로 HTTP 성공률은
    # 흔들리지 않는다(graphio `metrics/kpi.py` 의 U-23 주석).
    app_abort: 0.01
    # ── Call Type 별 세션 확률 가중 (2026-10-15) ──────────────────────
    # **알림만 받고 끝나는 호는 데이터 세션을 열지 않는다.** 전에는 모든 성공
    # 호가 같은 확률로 세션을 열어서 U-Plane 이 실제보다 많고 고르게 퍼졌다 —
    # `_k()` 주석은 "Paging·TAU·Detach 는 트래픽과 무관"이라 적어 두었는데
    # 구현이 Call Type 을 보지 않았다.
    #
    # **상대 가중이고 총량은 안 바뀐다** — 그 분 호들의 가중 평균으로
    # 정규화하므로 위 `rates.transport`(분당 새 세션 수)가 그대로다. 바뀌는
    # 것은 "어떤 호가 그 세션을 여는가"다.
    #
    # 적은 키만 덮어쓴다. 기본값은 `session.CT_SESSION_W`:
    #   01 SRMO 1.0 · 02 SRMT 0.3 · 06·07 ESR 0.2 · 00·08 ATTACH 0.1
    #   03 TAU · 04 PAGING · 05 DETACH · 40 AUTH = 0 · 60 APP 1.0
    #
    # 코드 테이블은 `CD_CALL_TYPE` 이다. **모르는 코드는 1.0** — 0 으로
    # 떨어뜨리면 "그 절차는 데이터를 안 쓴다"와 "코드를 모른다"가 섞인다.
    call_type_weight: {}

    # 수명 3분 이상인 세션이 핸드오버를 겪을 비율. **세션은 끊기지 않고 셀만
    # 바뀐다**(ONGOINGFLAG=4, 불변규칙 6). C-Plane 해제 Cause 가 핸드오버
    # 계열이면 이 확률과 무관하게 겪는다.
    handover: 0.25
  # ── U-Plane 원시는 MySQL 이 아니라 로컬 Parquet 로 간다 (2026-10-14) ──
  # 분당 6.3만 행 INSERT 의 68% 가 이 세 계열이었고, 집계가 끝나면 아무도 다시
  # 읽지 않는다(1분 집계의 입력 전용).
  #
  # **C-Plane 도 같은 길로 갔다**(2026-10-14, 2차 — 아래 `cplane_parquet`).
  # 이 자리에 "C-Plane 은 화면이 원시를 직접 조회하므로 그대로 MySQL 이다"라고
  # 적혀 있었는데 **더는 사실이 아니다.** 그 조회가 1차 통계 PM_COR_*_1M 로
  # 옮겨 갔고(graphio 2026-10-14), 남은 소비자가 1분 집계뿐이 되었다.
  #
  # 집계 산출물(GP_KPI_*·PM_*_1M)은 전부 MySQL 이다 —
  # 원칙은 "MySQL 에는 통계만 올라간다".
  uplane_parquet:
    # **읽는 쪽과 같은 디렉터리여야 한다.** graphio 의 `paths.uplane_raw` 와
    # 짝이고, 어긋나면 집계가 조용히 0행이 된다(에러가 나지 않는다).
    #
    # **데이터는 양쪽 코드 저장소 밖에 둔다** (2026-10-14). 전에는 읽는 쪽
    # 저장소 안(`../graphio-probe-rca/data/...`)을 가리켰는데, 그러면 쓰는
    # 쪽이 남의 git 작업 디렉터리에 분당 수 MB 를 쌓는다.
    # `graphio-data-generator/` 는 2026-10-08 분리 당시의 흔적만 남은
    # 디렉터리이고 **git 저장소가 아니라서** 그 자리에 적합하다. 이쪽
    # 저장소의 `data/` 도 쓸 수 없다 — git 안이고 `Dockerfile` 이
    # `COPY data/ ./data/` 로 이미지에 굽는다.
    #
    # **상대경로는 이 저장소 루트 기준이다** — `cli._uplane_store` 가
    # `(HERE / raw).resolve()` 로 푼다. cwd 와 무관하므로 어디서 띄워도 같은
    # 디렉터리이고, `gp.sh start gen` 이 `cd probe-datagen` 에서 띄우는 것과
    # 결과가 같다. 컨테이너에서는 `config/container.yaml` 이
    # `/app/data/uplane_raw`(절대경로)로 덮고 호스트의 이 디렉터리가 거기
    # 마운트된다 — 로컬 프로세스와 컨테이너가 **같은 호스트 디렉터리**를 본다.
    root: ../graphio-data-generator/data/uplane_raw
    # 몇 분치를 남길지. **집계 여부와 무관하게 자른다**(사람 지시).
    # 기준은 벽시계가 아니라 디스크에 있는 가장 늦은 분이다 — pemfill 이
    # 과거를 메울 때 쓰는 즉시 지워지지 않게 하려는 것이다.
    retain_minutes: 10
  # ── C-Plane 원시도 로컬 Parquet 로 간다 (2026-10-14, 2차) ───────────────
  # 구조는 U-Plane 과 **같다**(코드도 한 벌 — `src/datagen/raw_parquet.py`).
  # 계열은 `lte_call` 하나이고 **다른 것은 보관 기간뿐이다.**
  cplane_parquet:
    # **읽는 쪽과 같은 디렉터리여야 한다.** graphio 의 `paths.cplane_raw` 와
    # 짝이고, 어긋나면 집계가 조용히 0행이 된다(에러가 나지 않는다).
    # 저장소 밖에 두는 근거는 위 `uplane_parquet.root` 주석에 있다.
    root: ../graphio-data-generator/data/cplane_raw
    # 몇 분치를 남길지. **1440분 = 24시간이고, U-Plane(10분)보다 길다.**
    #
    #   ① 구 MySQL 세대의 파티션 보관이 24시간이었다(pemdb1.RETAIN_HOURS).
    #      저장소를 바꾼 것이 조회 가능 범위를 조용히 줄이면 안 된다.
    #   ② **끊어 둔 기능을 되살릴 여지다.** SCR-06(호 조회)·SCR-07(가입자
    #      추적)·EV-01·02·03·04c 는 "원시를 직접 조회"가 필요해서 끊었다.
    #      되살리기로 결정되면 이 보관 기간 안의 구간만 조회할 수 있다 —
    #      10분으로 두면 되살려도 쓸 수 없다.
    #
    # 디스크 비용은 1분치 zstd 약 1.4MB → 24시간 약 2GB 다.
    # 기준은 벽시계가 아니라 디스크에 있는 가장 늦은 분이다(U-Plane 과 동일).
    retain_minutes: 1440
  # 장애 주입 정답 파일. **graphio 의 채점이 읽는 경로다**
  # (`pipeline.score_against_truth` → `cfg.path("truth")/ground_truth.json`).
  # 생성과 같은 호출에서 쓰지 않으면 정답이 데이터와 다른 세대가 된다.
  truth_out: ../graphio-probe-rca/data/truth/ground_truth.json
