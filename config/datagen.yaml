# probe-datagen 설정 — 1단계(성공 케이스 백필)
#
# 장비 토폴로지·셀은 data/cells.json · core_nodes.json 에 박혀 있다(구 저장소에서
# 생성한 350셀 세트). 바꾸려면 그 JSON 을 교체한다.

paths:
  data: data                    # cells.json · core_nodes.json · profile.json

generate:
  start: "2026-08-27 09:00:00"  # 백필 시작 (실시간 틱 단계에서는 now-N 으로)
  minutes: 60                   # 생성할 분 수
  aggregate_batch: 30           # N분 모아 한 번에 집계 (매 분 재스캔 회피)
  seed: 20260903
  backfill_minutes: 180         # run 재기동 시 메울 최대 과거 분 — 이보다 긴 갭은
                                # 버린다 (며칠치를 메우면 재기동이 몇 시간이 된다)
  retention_days: 7             # MySQL 분 슬롯 보존 일수 — 1시간마다 지난 슬롯 삭제

# 분당 생성 호수(계열별). 최소 표본 규칙(분모 20)을 넘기려면 셀 수 대비 넉넉해야
# 한다. 350셀에 lte 2000/분이면 셀당 ~6건 — 상위 집계(SGG/노드)에서 표본이 찬다.
rates:
  lte_call: 2000
  transport: 1500
  dns: 800
  http: 1200

mysql:
  host: 127.0.0.1               # 서버에서는 192.168.100.216
  port: 3306                    # 서버에서는 3307
  user: graphio
  password: graphio
  database: graphio

# ── 상용 스키마(pemdb1) 적재 — `pemfill` 전용 ────────────────────────────
# 기존 backfill/run 은 위의 mysql: (자체 창고 스키마)를 그대로 쓴다. 상용은
# 테이블·컬럼이 다른 별도 경로이므로 설정도 분리한다.
pemdb1:
  database: pemdb1              # 같은 서버의 다른 DB — host/port/user 는 mysql: 재사용
  subscriber_pool: 20000        # 가입자 풀
  # 생성 대상 eNB 수. 마스터 전량(eNB 32,121 · 셀 571,801)에 분당 수천 호를
  # 흘리면 eNB 당 표본이 1건 미만이 되어 어떤 창에서도 판정이 서지 않는다
  # (최소 표본 20 · 불변규칙 5). 0 이면 전량.
  enb_limit: 60
  success_only: true            # 평시 전부 녹색 — 실패는 fault 주입으로만 만든다
  rates:
    # 분당 호 수(주간 피크 기준 — 야간은 DIURNAL 곡선으로 0.14배까지 내려간다).
    # eNB 60개 · 셀 2,161개에 20,000/분이면 eNB 당 ~330건 · 셀당 ~9건이다.
    # eNB 축은 1분 창에서 최소 표본 20을 넘고, 셀 축은 5분 창에서 찬다
    # (불변규칙 5). 적재 실측 11,000건/1초 — 더 올려도 병목은 아니다.
    lte_call: 20000
  # 장애 주입 정답 파일. **graphio 의 채점이 읽는 경로다**
  # (`pipeline.score_against_truth` → `cfg.path("truth")/ground_truth.json`).
  # 생성과 같은 호출에서 쓰지 않으면 정답이 데이터와 다른 세대가 된다.
  truth_out: ../graphio-probe-rca/data/truth/ground_truth.json
