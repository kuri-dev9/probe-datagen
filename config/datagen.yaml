# probe-datagen 설정 — 1단계(성공 케이스 백필)
#
# 장비 토폴로지·셀은 data/cells.json · core_nodes.json 에 박혀 있다(구 저장소에서
# 생성한 350셀 세트). 바꾸려면 그 JSON 을 교체한다.

paths:
  data: data                    # cells.json · core_nodes.json · profile.json

# ── 홈 PLMN · IMSI 접두 — **한 값에서 유도한다** (2026-10-26) ───────────
#
# 전에는 세 파일에 흩어진 리터럴이었다(`pemdb1.py` 의 `plmn="45005"` 와
# `"4500503"`/`"2340500"`, `generator.py` 의 `"4500503"`). **한쪽만 바꾸면
# 전 가입자가 외국 가입자가 된다** — 셀 PLMN `45005` 와 IMSI 접두
# `4500503` 의 앞 5자가 같아야 한다. 지금은 로밍 판정 로직이 없어 증상이
# 안 나오지만, `identity.py` 머리말이 하겠다고 적어 둔 분석을 넣는 순간
# 전부 로밍으로 나온다(에러는 없다).
#
# **`imsi_mcc_mnc_info`(규격 폭 7자) 칸을 따로 두지 않는다** —
# `home + imsi_msin_head` 로 유도한다. 칸이 둘이면 같은 함정이 설정
# 파일로 옮겨간다. 근거는 `src/datagen/plmn.py` 머리말.
#
# **`data/profile.json` 의 `imsi_mcc_mnc_info` 분포를 이 값이 이긴다** —
# 그 분포는 상용 실측이라 전부 한국 값(`4500502`~`4500513`)이다. 끝 2자
# (사업자 하위 버킷)는 유지하고 앞 5자만 바꾼다(`Plmn.normalize`).
# 로밍(MCC 3자가 `roaming` 과 같은 것)은 손대지 않는다.
#
# ── 지역축 — **이 한 칸이 나머지를 먹인다** (2026-10-28) ────────────────
#
# `kr` | `jp`. 정본은 `src/datagen/region.py` 의 `LOCALES` 이고 여기는
# 선택이다. 아래 `plmn:` 과 `pemdb1.locale:` 은 **안 적으면 이 값에서
# 유도된다** — 적으면 적은 쪽이 이긴다(SoftBank `44020` 등).
#
#   kr  →  plmn 45005/03/2340500  ·  pemdb1.locale kr  ·  CM_GU
#   jp  →  plmn 44010/01/4500503  ·  pemdb1.locale jp  ·  CM_GU_JP
#
# **운영 중에 바꾸지 않는다**(사용자 확정). 기동 시 한 번 읽고 고정이다 —
# 중간에 바뀌면 같은 분 Parquet 에 한국·일본 IMSI 가 섞여 그 분이 **어느
# 쪽으로도 집계되지 않는다.** gen-ui 콤보박스도 "재시작 후 반영"으로 적는다.
#
# 배경·전수 조사: `graphio-probe-rca/docs/jp/지역축-KR-JP.md`
locale: jp

# ── PLMN · IMSI — **적지 않는다. `locale` 에서 유도된다** (2026-10-30 사용자 결정)
#
# 전에는 여기에 `plmn:` 블록(`45005`/`03`/`2340500`)이 있어 `locale: jp` 인데
# IMSI 가 한국 `450…` 으로 나갔다(2026-10-28 실측 · 일부러 남겨 둔 상태였다).
# 지워서 위 표대로 따라가게 했다 — gen-ui 가 지역을 바꾸면 `region.reapply` 가
# 이 값도 함께 바꾼다. 다른 사업자(SoftBank `44020` 등)가 필요할 때만
# `plmn:` 을 다시 적는다 — 적은 값이 이기고 `region.conflict_text` 가 경고한다.
#
# **대가:** 지운 뒤 처음 생성하는 분부터 IMSI 앞자리가 바뀐다. 그 전에 쌓인
# Parquet 와 같은 가입자로 이어지지 않는다(지역축 문서 §5 L-4).

generate:
  start: "2026-08-27 09:00:00"  # 백필 시작 (실시간 틱 단계에서는 now-N 으로)
  minutes: 60                   # 생성할 분 수
  aggregate_batch: 30           # N분 모아 한 번에 집계 (매 분 재스캔 회피)
  seed: 20260903
  backfill_minutes: 0           # **`run` 은 백필하지 않는다**(사람 지시). 과거 구간은
                                # `pemfill` 로만 만든다 — 데몬이 기동마다 과거를 다시
                                # 쓰면 주입해 둔 장애가 평시 데이터로 밀린다.
                                # 버린다 (며칠치를 메우면 재기동이 몇 시간이 된다)
  # ── 보존 — **시간 단위다**(2026-10-15) ────────────────────────────────
  # 전에는 `retention_days: 1` 이었고 그 값이 **일 파티션에만** 걸렸다. 원시
  # xDR(시간 파티션)은 코드 상수 `RETAIN_HOURS=24` 를 썼으므로, 여기서 값을
  # 바꿔도 원시는 꿈쩍하지 않았다 — 24 와 1×24 가 우연히 같아 **아무도
  # 몰랐다.** 이제 한 값이 두 입도를 함께 자른다(`cli._purge_pemdb1`).
  #
  # 구 키(`retention_days`)도 계속 읽는다(`cli._retention_default`) — 환경별
  # 설정 파일이 그것만 들고 있을 수 있다. 여기에 두 키를 같이 적지는 않는다.
  #
  # UI(:8009)와 DB(`CM_DATAGEN_CONFIG.retention_hours` · `retention_on`)가
  # 이 값을 이긴다 — 데몬이 10분마다 다시 읽으므로 재기동이 필요 없다.
  #
  # **일 파티션은 하루 입도로만 떨어진다.** 24 미만을 줘도 집계
  # `PM_*_1M` 은 최대 하루치가 남는다. 원시 Parquet 는 또 별개다
  # (`pemdb1.uplane_parquet.retain_minutes`).
  retention_hours: 24           # 로컬 PoC DB 는 하루만 둔다 — 10분마다 지난 파티션 정리

# 분당 생성 호수(계열별). 최소 표본 규칙(분모 20)을 넘기려면 셀 수 대비 넉넉해야
# 한다. 350셀에 lte 2000/분이면 셀당 ~6건 — 상위 집계(SGG/노드)에서 표본이 찬다.
rates:
  lte_call: 2000
  transport: 1500
  dns: 800
  http: 1200

mysql:
  host: 127.0.0.1               # 서버에서는 192.168.100.216
  port: 3306                    # 서버에서는 3307
  user: pem
  # **비워 둔다.** 접속 정보는 `.env` → 환경변수 `GP_MYSQL_PASSWORD` 로
  # 온다(2026-10-20). 저장소에 평문을 두면 git 히스토리에 영구히 남고,
  # 환경마다 **두 저장소 네 자리**를 고쳐야 해서 한 곳을 빠뜨린다.
  password: ""
  database: graphio

# ── 상용 스키마(pemdb1) 적재 — `pemfill` · `run` · `ui` ──────────────────
# **`run` 도 이 경로다.** 이 자리에 "기존 backfill/run 은 위의 mysql: (자체
# 창고 스키마)를 그대로 쓴다"고 적혀 있었는데 `run` 에는 더는 맞지 않는다 —
# 데몬이 `pemfill` 과 같은 쓰기 경로(`datagen.pemdb1`)로 옮겨 갔다
# (`cli.cmd_run` 머리말 "왜 경로를 바꿨나"). 위의 `mysql:`/`rates:` 를 쓰는
# 것은 구 `backfill` 명령 하나뿐이다.
#
# 상용은 테이블·컬럼이 다른 별도 경로이므로 설정도 분리한다.
# 섹션 이름 `pemdb1` 은 **설정 키**다(코드가 `cfg.get("pemdb1")` 로 찾는다).
# 스키마 이름이 아니다 — 그건 아래 `database:` 다. 둘이 달라도 맞다.
pemdb1:
  # **`pemdb6` 다. `pemdb1` 이 아니다(2026-10-13 결정).** PoC 서버의 기존
  # `pemdb1` 은 손대지 않고 그대로 두고, 우리가 쓰는 스키마를 따로 만든다.
  # 생성기가 쓰는 쪽이라 **여기가 틀리면 남의 스키마에 XDR 을 쏟아붓는다.**
  # graphio 쪽 `config/*.yaml` 의 `store.mysql.database` 와 같아야 한다.
  database: pemdb6              # 같은 서버의 다른 DB — host/port/user 는 mysql: 재사용
  # ── locale 별 스키마 — ※ `clone` 커맨드만 본다 (폐기 대기) ──────────
  # **로케일 축은 테이블 이름이다**(2026-10-26 확정). 사용자가 범위를 줄였다:
  # *"지역구에 대응하는 테이블만 JP로 만들라는거야. 나머진 다 그대로 쓸꺼고
  # 원본 데이터도 그냥 쓸꺼야."* 그래서 같은 `pemdb6` 안에
  # `CM_GU` / `CM_GU_JP` 가 공존한다 — `topo.table_name()` 한 곳이 정본이다.
  #
  # 아래 값은 **DB 째 복제 경로(`topo clone`)의 잔존부**다. 다른 커맨드는
  # 이것을 보지 않는다 — 둘을 함께 쓰면 축이 두 번 적혀
  # (`pemdb6_jp.CM_GU_JP`) 어느 쪽이 유효한지 알 수 없다.
  locale_database:
    jp: pemdb6_jp
  subscriber_pool: 20000        # 가입자 풀
  # 생성 대상 eNB 수. 마스터 전량(eNB 32,121 · 셀 571,801)에 분당 수천 호를
  # 흘리면 eNB 당 표본이 1건 미만이 되어 어떤 창에서도 판정이 서지 않는다
  # (최소 표본 20 · 불변규칙 5). 0 이면 전량. **나라별 값은 아래 `by_locale`.**
  # ── 도쿄 대상 세트 (2026-10-27) ──────────────────────────────────────
  #
  # **기본은 KR 이다.** 바꾸는 것은 사람의 결정이고, 바꾸면 셀 세트가 통째로
  # 갈려 기존 기준선과 비교가 끊긴다.
  #
  # 도쿄로 돌리려면 셋을 함께 켠다 —
  #
  #   locale: jp            셀 좌표·지역 벌을 JP 로 (topo.table_name)
  #   sectors_per_enb: 6    eNB 당 섹터 상한
  #   enb_limit: 0          **반드시 0** — 위 설명 참조
  #
  # 마스터는 **OpenCellID 도쿄 LTE 실데이터**다(2026-10-27 교체).
  # `graphio-probe-rca/tools/load_opencellid_tokyo.py` 가 적재한다 —
  # 도코모(440-10) eNB 5,208 · 셀 23,039 · **실제 TAC 658개**.
  #
  # **`tac_only` 는 더는 세트를 좁히지 못한다** — 전 행에 TAC 가 있다.
  # 그래서 `enb_limit` 을 `0` 으로 둬야 한다: `60` 이면 `_pick_enbs` 가
  # 셀 수 내림차순으로 60개만 골라 **야마노테선 eNB 88개가 거의 다 빠지고**
  # `load_routes` 가 "셀 마스터에 없는 키"로 멈춘다.
  #
  # **섹터 상한**: OpenCellID 실데이터는 eNB 당 섹터가 중앙 3개라 상한이
  # 거의 걸리지 않는다(23,039 → 17,188셀). 그래도 두는 이유는 일부 eNB 가
  # 섹터를 수십 개 들고 있어서다. **번호가 작은 쪽을 남긴다** — 노선 빌더도
  # 같은 규칙을 쓰므로 다르게 고르면 `load_routes` 가 멈춘다.
  # → 위 셋은 아래 `by_locale.jp` 에 있다(2026-10-30).

  # ── 생성 범위 — **분당 호를 어느 지역에 흘리나** ──────────────────────
  #
  # 마스터는 넓고(도쿄 셀 17,188) 분당 호는 적다(`rates.lte_call: 2000`).
  # 그대로 흘리면 셀당 **0.12호/분**이고, 최소 표본 20(불변규칙 5)을 30분
  # 창에서도 못 채워 **셀 축 탐지가 한 번도 서지 않는다** — 에러가 아니라
  # 지도가 전부 "판정 불가" 회색이 된다.
  #
  # 호를 11배로 늘리면 전 셀이 판정되지만 원시 Parquet 도 11배다. 지금
  # 장비에서는 그렇게 하지 않는다 — 대신 **좁은 지역에만** 흘린다.
  #
  #   범위                     셀      호/분    판정
  #   제한 없음            17,188      0.12    **안 섬**
  #   신주쿠구              1,114      1.80    15분 창
  #   노선 + 신주쿠구        1,192      1.68    15분 창
  #   신주쿠 11丁目(동)        473      4.23     5분 창
  #   야마노테선만              88     22.73     1분 창
  #   노선 +300m            2,481      0.81    30분 창
  #   **야마노테선 통과 12구  7,694      0.26    안 섬** ← 지금 이것
  #
  # **지금 설정은 셀 축 탐지가 서지 않는다.** 7,694셀에 2,000호/분이면
  # 셀당 0.26호라 30분 창에서도 7.8건이고 최소 표본 20(불변규칙 5)을 못
  # 채운다. 지도가 전부 "판정 불가" 회색이 되고 **에러는 나지 않는다.**
  # 세우려면 `rates.lte_call` 을 올린다 — 30분 창이면 5,100 · 15분 창이면
  # 10,300. 원시 Parquet 도 같은 배수로 커진다.
  #
  # 통과 구는 **역 좌표를 행정경계에 넣어** 뽑았다(10구) + **노선 셀이
  # 실제로 떨어진 구**(11구)의 합집합이다. 둘이 다른 이유는 역이 구 경계에
  # 붙어 있어서다 — 目黒駅 은 目黒区 가 아니라 品川区 에 있다.
  #
  # **합집합이다** — `gu`·`dong`·`route` 를 함께 주면 합친다. 다 비면
  # 마스터 전량이고, 그게 기본이다.
  #
  # **모르는 노선 id 는 멈춘다** — 조용히 전량으로 넘어가면 좁혔다고 믿는
  # 채로 전 도쿄에 호가 흩어지고 탐지가 서지 않는다.
  # ── 나라별 생성 범위 — **`locale` 이 고른다** (2026-10-30 사용자 결정) ──
  #
  # 전에는 위 값들(`enb_limit`·`locale`·`tac_only`·`sectors_per_enb`·`scope`)
  # 이 `pemdb1` 에 직접 적혀 있어서, gen-ui 로 지역을 바꾸면 IMSI 만 바뀌고
  # **셀 마스터는 도쿄에 남았다**(셀 도쿄 · IMSI 한국 — 10-28 의 그 상태가 거꾸로).
  # `region.derive` 가 이 표에서 그 나라 칸을 `pemdb1` 에 채운다. `pemdb1`
  # 에 직접 적은 칸이 이긴다(규칙 ②) — 한 번만 다르게 돌릴 때 쓴다.
  #
  # `pemdb1.locale`(마스터 테이블 벌)은 여기 없다 — 최상위 `locale` 에서
  # 바로 유도된다(`region.LOCALES[*].pemdb1_locale`).
  by_locale:
    kr:
      enb_limit: 60           # 10-28 전 값. 한국 셀 확충은 OpenCellID(MCC 450) 로 나중에
      # 한국 벌 — `southkorea-maps kostat 2018 → pemdb1 행정표준코드`(아래 crosswalk 설명)
      geo_crosswalk: ../graphio-probe-rca/data/geo/code_crosswalk.json
      geo_boundary: ../graphio-probe-rca/data/geo/skorea-submunicipalities-2018-geo.json
    jp:
      enb_limit: 0            # **반드시 0** — 위 "도쿄 대상 세트" 설명
      tac_only: false
      sectors_per_enb: 6
      geo_crosswalk: ../graphio-probe-rca/data/geo/jp/code_crosswalk.json
      # 지도 화면이 그리는 **행정경계**. crosswalk 의 형제에서 찾지 않는다 —
      # 두 값이 늘 같은 디렉터리에 있으리라는 가정이 틀렸다(컨테이너에서
      # `jp/` 가 빠져 파일을 못 찾았다). 경로는 경로대로 받는다.
      geo_boundary: ../graphio-probe-rca/data/geo/jp/N03-21_210101.json
      geo_rail: ../graphio-probe-rca/data/geo/jp/rail.json          # 철도 N02 (배경)
      geo_rivers: ../graphio-probe-rca/data/geo/jp/rivers.json      # 하천 W05 (배경)
      geo_roads: ../graphio-probe-rca/data/geo/jp/roads.json        # 도로 OSM (배경)
      geo_green: ../graphio-probe-rca/data/geo/jp/green.json        # 공원·수역 OSM (배경)
      geo_station_bldg: ../graphio-probe-rca/data/geo/jp/station_bldg.json  # 역 건물 OSM (배경)
      # 상세 배경 (2026-10-30) — graphio `tools/build_jp_geo_layers.py --only-detail` 가 굽는다.
      # `geo_boundary_map` 은 **지도 전용**이다. `geo_boundary` 는 graphio 의 셀 귀속과
      # 같은 파일이라 그대로 두고, 지도만 상세본을 읽는다 — 비우면 `geo_boundary` 로 간다
      geo_boundary_map: ../graphio-probe-rca/data/geo/jp/N03_map.json   # 행정경계 상세 N03-2025
      geo_water: ../graphio-probe-rca/data/geo/jp/water.json            # 수역 relation OSM
      geo_chome: ../graphio-probe-rca/data/geo/jp/chome.json            # 丁目 경계 e-Stat
      scope:
        # 야마노테선 통과 12구 — 노선 순서(시나가와→시부야→신주쿠→이케부쿠로
        # →우에노→도쿄). `CM_GU_JP.GU_ID`
        gu: [11305, 11170, 11320, 11410, 11200, 11500,
             11530, 11545, 11215, 11230, 11110, 11140]
        #    品川   港    目黒   渋谷   新宿   豊島
        #    北     荒川   文京   台東   千代田 中央
        dong: []                # CM_DONG_JP.DONG_ID (11200011 신주쿠 11丁目)
        route: YMT-OUTER        # 노선 id — data/lines/*.json 의 `id` (YMT-OUTER · YMT-INNER)
        route_radius_m: 0       # >0 이면 노선 주변까지. 0 이면 노선 셀만 —
                                # 그때는 **이동 가입자밖에 없어** 역 주변 체류가 없다
        lines_dir: data/lines
  success_only: true            # 평시 전부 녹색 — 실패는 fault 주입으로만 만든다
  # 희소 Call Type 의 **최소 비율**. 실측 그대로 뽑으면 분당 20,000호에서도
  # Attach MT(0.0024%)가 0.5건/분, Detach MO 가 2.8건/분이라 **최소 표본 20**
  # (불변규칙 5)을 어떤 창에서도 못 채운다 — 그 절차가 화면·탐지·RCA 에
  # 한 번도 나타나지 않고, 에러도 나지 않는다.
  #
  # 0.003(0.3%) 이면 분당 60건이라 1분 창에서 분모가 찬다. 구성비는 그대로다 —
  # Service(3·4)가 여전히 95% 이상이고 Attach 는 적다.
  #
  # **0 으로 두면 실측 분포 그대로** 돈다. 실제 운영 구성비로 채점·검증해야
  # 할 때 그렇게 한다. 코드 기본값은 `pemdb1.Distributions.CALL_TYPE_FLOOR`.
  call_type_floor: 0.003
  # 행정코드 crosswalk — **셀 선택을 "폴리곤이 있는 동"으로 한정한다.**
  # 번들 경계 geojson 은 행정동(3,504), pemdb1 은 법정동(8,079)이라 `종로1·2·3·4가동`
  # 류는 대응 행이 원리상 없다. 이름이 우연히 같은 2,868개만 crosswalk 가 맞췄고,
  # 아무렇게나 셀을 고르면 읍면동 지도의 절반이 회색으로 남아 운영자가 "그 지역
  # 문제 없음"으로 읽는다(불변규칙 12). 마스터 44만 셀 중 22만이 폴리곤 있는 동에
  # 속하므로 좁혀도 셀은 넉넉히 남는다(실측 eNB 22,722).
  # 파일이 없으면 pemfill 이 멈춘다 — graphio 쪽 `python -m graphio geo-xw` 로 만든다.
  # **로케일마다 벌이 다르다.** `data/geo/code_crosswalk.json` 은
  # `southkorea-maps kostat 2018 → pemdb1 행정표준코드` 이고, 일본 동 코드와는
  # 우연히 겹치는 것만 맞는다 — 도쿄 셀에 걸었더니 1,192셀 중 434개만 남았다
  # (64% 탈락). JP 벌은 `emd` 13,768개를 전부 맞춘다(`topo seed-geo` 생성본).
  #
  # 지도 경계도 이 파일의 **형제**에서 찾는다(`ui.api_map_geo`) — JP 를
  # 가리켜야 `jp/N03-21_210101.json`(국토수치정보 행정구역)이 잡힌다.
  # → 지도 경로(`geo_*`)는 나라마다 다르다 — 위 `by_locale` 에 있다(2026-10-30).
  # 장애 현황을 받아 오는 graphio API — 호스트에서 돌릴 때의 주소
  graphio_api: http://127.0.0.1:8008
  rates:
    # 분당 호 수(주간 피크 기준 — 야간은 DIURNAL 곡선으로 0.14배까지 내려간다).
    # eNB 60개 · 셀 2,161개에 20,000/분이면 eNB 당 ~330건 · 셀당 ~9건이다.
    # eNB 축은 1분 창에서 최소 표본 20을 넘고, 셀 축은 5분 창에서 찬다
    # (불변규칙 5). 적재 실측 11,000건/1초 — 더 올려도 병목은 아니다.
    lte_call: 20000
    # ── 생성량 비율(%) — **100% 기준 위에 걸린다** (2026-10-14) ──────────
    # 위 절대값이 100% 이고 이 값이 실제 생성량을 정한다. 70% 면 분당
    # 14,000호다.
    #
    # **이 줄은 초기값일 뿐이고 DB 값이 이긴다.** UI(:8009)가 바꾸는 것은
    # `CM_DATAGEN_CONFIG.volume_pct` 이고 데몬이 매 분 그것을 다시 읽는다 —
    # **yaml 을 고쳐도 이미 행이 있으면 아무 일도 일어나지 않는다.** 아래
    # 이력 문단을 "현재 설정"으로 읽으면 안 된다. 실값 확인은 —
    #
    #     ./gp.sh mysql "SELECT * FROM CM_DATAGEN_CONFIG WHERE NAME='volume_pct'"
    #
    # (2026-10-26 실측 DB 값 **30**. 이 파일의 값과 같지만 **같다는 보장이
    # 없다** — 다음 사람이 여기만 보고 판단하지 않도록 적어 둔다.)
    #
    # 절대값을 직접 내리지 않는 이유: 100% 기준이 남아 있어야 "지금 얼마나
    # 줄여 둔 상태인가"를 알 수 있다. 20,000 이 원래 값인지 누가 내린 값인지
    # 구분되지 않으면 표본 부족(불변규칙 5)을 진단할 수 없다.
    #
    # **70% 는 사람이 정했다**(2026-10-14) — 노트북에서 돌리는 PoC 라
    # 디스크·메모리를 아끼려는 것이고 품질 판정과는 무관하다. 셀당 호 수가
    # 9건에서 6.3건으로 줄지만 5분 창에서 최소 표본 20을 여전히 넘는다.
    #
    # **30% 로 내렸다**(2026-10-15 사람 지시 "적당히"). 분당 6,000호 ·
    # 셀당 2.8건이고 5분 창에서 14건, 15분 창에서 42건이라 셀 축 판정이
    # 선다. DB 가 하루 4GB 로 buffer pool 2GB 를 12시간 만에 채운다 —
    # 70% 의 5.2시간보다 여유가 있다.
    #
    # **위 "셀 축 5분 창" 은 호 수 기준이고 채점 트리거의 분모가 아니다**
    # (2026-10-26 실측 교정). `ground_truth` 의 SC-21 은 `expect_kpi: U-12`
    # 이고 그 분모는 호가 아니라 **패킷**(`paypkt_dn` · `min_denom=800`)이다.
    # 창고 35분 실측에서 정답 셀 40개의 지배 창은 —
    #
    #     pct= 30 (현재)  {1분:32, 5분:2, 15분:1, 30분:1, 미달:4}
    #     pct= 70         {1분:34,        15분:2, 30분:3, 미달:1}
    #     pct=100         {1분:34, 5분:1, 15분:3, 30분:1, 미달:1}
    #
    # **미달 4개가 이 값으로만 고쳐진다** — 어떤 창에서도 분모를 못 채우는
    # 기존 결손이고 `TOPO_WEIGHT` 와 무관하다. 70 으로 올리면 1개로 줄고
    # 적재는 2.3배다. 70 과 100 의 차이는 35분 평균의 흔들림 범위다.
    # **올리는 판단은 사람이 한다** — 여기서 숫자를 바꿔도 DB 가 이긴다.
    volume_pct: 30

    # ── U-Plane(서비스품질) — 로컬 Parquet 로 간다 ─────────────────────
    # **세션 모델 전환(2026-10-14)으로 이 세 값의 뜻이 바뀌었다.** 전에는
    # "분당 레코드 수"였고, 지금은 성공 호에서 파생되는 **파생 계수의 원천**
    # 이다. 숫자를 그대로 둔 것은 집계가 세는 양이 전후로 같게 하려는 것이다
    # (`src/datagen/session.py` 머리말 §1.4).
    #
    #   transport → 분당 **새 세션 수**(피크 기준). 정상 상태에서 종료
    #               레코드(ONGOINGFLAG 2·20) 수가 이 값이고, 집계는 종료
    #               레코드만 세므로 분모가 전과 같다.
    #   dns       → p_dns = dns / transport = 0.41 — DNS 질의를 하는 세션 비율
    #               (나머지는 캐시 히트)
    #   http      → 세션당 HTTP 트랜잭션 기대값 = http / transport = 0.68
    #
    # **원시 transport 레코드 수는 늘어난다** — 분당 활성 세션 수(= 새 세션 ×
    # 평균 수명)에 수렴한다. 평균 수명 2분이면 약 2배이고, 늘어난 쪽은 전부
    # Interim 이라 집계에 들어가지 않는다.
    #
    # **0 이면 그 계열을 만들지 않는다.** 위의 전역 `rates:` 값(transport
    # 1500 등)은 구 창고 세대의 350셀 기준이라 여기서 그대로 쓰면 셀당 1건
    # 미만이 되어 어떤 창에서도 판정이 서지 않는다(불변규칙 5).
    #
    # 셀 2,161개 기준 셀당 분당 **종료 레코드** 수와, 최소 표본 20을 넘는 창:
    #   transport 22,000 → 셀당 ~10건   5분 창 51건
    #   dns        9,000 → 셀당  ~4건   5분 창 21건
    #   http      15,000 → 셀당  ~7건   5분 창 35건
    # eNB 축(60개)은 세 계열 모두 1분 창에서 넘는다.
    #
    # **야간에는 셀 축 판정이 서지 않는다.** 시간대 곡선이 호 수·호당 세션
    # 수에 함께 걸려 04시 새 세션이 피크의 0.5배까지 내려간다 — transport 가
    # 셀당 5건/분이고 5분 창에서 25건으로 겨우 찬다. 표본이 없으면 판정하지
    # 않는 것이 맞고, 0 으로 채워 "정상"으로 보이게 하지 않는다(불변규칙 17).
    #
    # 1분 창에서 셀 단위 TCP 성공률(U-01)까지 세우려면 transport 를 43,000
    # 이상으로 올려야 한다(셀당 20건). 적재가 그만큼 무거워진다.
    transport: 22000
    dns: 9000
    http: 15000
  # ── 평시 배경 (2026-10-22) ────────────────────────────────────────────
  # **분모를 만드는 자리다. 실패를 만드는 자리가 아니다.**
  #
  # `success_only: true` 가 "평소 전부 녹색"을 만드는데 그것이 지나쳐 분모까지
  # 0 으로 만들었다 — 실측(cplane_raw 194만 건)에서
  #
  #     P-01 인증 성공률     상시 0%    분모가 장애 호뿐
  #     P-02 가입정보 성공률  분모 0     location_*_flag 미기입
  #     P-03 단말식별 성공률  분모 0     mecheck_*_flag 미기입
  #     P-04 페이징 성공률    상시 100%  실패 0건
  #     P-07 NPR 발생률      전부 0     npr_flag 미기입
  #     C-04 절단률          0.0036%   success_only 가 drop=0 강제
  #     PSF  PathSwitch 실패  분모 0     PathSwitch_count 미기입
  #
  # 분모가 없으면 R-01(P-01)·R-01b(P-02)·R-25(P-04)·R-17(PSF) 이 **구조적으로
  # 발동할 수 없고**, SC-04·09·14·15 는 주입해도 아무 일이 일어나지 않는다.
  #
  # 코드 기본값은 `src/datagen/pemdb1.py` 의 `Baseline` 이다. 여기 적은 키만
  # 덮어쓰고 **모르는 키를 주면 멈춘다** — 오타가 "기본값으로 돌았다"로 끝나면
  # 평시 분모가 조용히 어긋나고 그것은 탐지가 안 되는 형태로만 나타난다.
  #
  # ★ **전부 PoC 기본값이고 운영 실측이 아니다.** 운영 값이 들어오면 여기만
  #   고친다. 주석·문서에 "실측"이라고 적지 않는다.
  # ── 시간대 곡선 · 가상 시각 (2026-11-04 사용자 결정 — 두 모드) ───────────
  # 기본값이다. gen-ui 에서 바꾼 값(`CM_DATAGEN_CONFIG` 의 `diurnal`·`virtual_offset_sec`)이
  # 이기고 데몬이 매 분 다시 읽는다 — `volume_pct` 와 같은 방식.
  #
  # * 곡선 켬 — 시간대 곡선(생성량)과 시간대별 그룹 비율(`mobility.hourly`)을 따른다.
  #   `virtual_offset_min` 만큼 옮긴 **가상 시각**으로 곡선·비율·운행 시각을 계산한다.
  #   **레코드 시각은 실제 시각 그대로다** — 옮기면 1분 집계·워터마크·corr 이 깨진다.
  # * 곡선 끔 — 생성량은 피크 수준으로 평탄, 그룹·이동 없이 **전체 eNB 에 골고루**
  #   (eNB 균등 추첨 · 특별한 이벤트 없음). 장애 주입은 그 위에 그대로 걸린다.
  clock:
    diurnal: true
    virtual_offset_min: 0
    # 시간대 곡선 0~23시 상대 배율 — 04시 최저 · 19시 최고(=1.0, 피크가 설정 생성량이다).
    # 호 수·호당 세션·세션 바이트가 계열별 진폭 축소(`generator.DIURNAL_WEIGHT`)를 거쳐 함께 쓴다.
    # 11-04 사용자: 출근 8~9시 > 10~11시 — 아침에 한 번 솟고 낮에 조금 내려간다. 초기값
    curve: [0.62, 0.56, 0.52, 0.51, 0.50, 0.54, 0.64, 0.80, 0.94, 0.95, 0.90, 0.89,
            0.90, 0.88, 0.88, 0.90, 0.93, 0.96, 0.99, 1.00, 0.98, 0.92, 0.82, 0.71]

  baseline:
    # 절차 시도 비율 — call_type 그룹별(attach/tau/service/paging/detach/handover).
    # **이 값이 P-01 의 분모를 정한다.** 너무 낮으면 MIN_PROCEDURE_DENOM=40 을
    # 못 채워 R-01 이 발동하지 않고, 너무 높으면 인증이 모든 호에 붙어
    # 비현실적이 된다. 분당 6,000호(= 20,000 × 30%) 기준
    #   Attach 0.29% + TAU 3.2%×0.35 + Service 95%×0.02 ≈ 2.9% → 분당 174건
    # 이라 1분 창에서 분모 40을 넘는다.
    auth_attempt:     {attach: 1.00, tau: 0.35, service: 0.02}
    auth_success:     0.999
    location_attempt: {attach: 1.00, tau: 0.90, service: 0.00}
    location_success: 0.9995
    mecheck_attempt:  {attach: 0.60, tau: 0.00, service: 0.00}
    mecheck_success:  0.9998
    # 페이징은 **시도 비율을 실측(proc_ratio)에서 받고** 성공률만 여기서 정한다
    paging_success:   0.98
    npr_rate:         0.0008
    # 연결 **후** 절단 (C-04 목표 0.3%). success=1 인 호에만 선다
    drop_rate:        0.003
    # 절단 사유 구성비 — **합이 1.0 이어야 하고 아니면 멈춘다.**
    #
    # 🔄 2026-10-22 운영 XDR 실측으로 교정. `drop_flag=1` 157건 분류:
    #
    #     normal (300·302)  45.9%   ← 가장 많다
    #     unspec (504)      38.9%
    #     radio  (1xx)      15.3%
    #     transport/node/nas/proto   0건
    #
    # 구 설정은 **정상 종료를 하나도 만들지 않아** `DROP_NORMAL` 이 항상 0
    # 이었고, 근거였던 "정상 종료면 DROP_CNT 가 안 세어진다"는 틀렸다 —
    # `cell_agg.DROP_CNT` 는 `DROP_FLAG` 만 본다. 자세한 근거는
    # `pemdb1._DROP_CAUSES` 머리말.
    #
    # 구 통과 조건 `DROP_RADIO/DROP_CNT ∈ [0.45, 0.65]` 는 **운영과 맞지
    # 않는다**(실측 0.153). 조건을 맞추려고 비정상 Cause 를 늘리지 않는다.
    # 실측 0건인 넷은 "없다"로 단정하지 않고(표본 157건) 최소치만 남긴다.
    #
    # ⚠️ 201·303·406·504 는 graphio `S1AP_UNSPECIFIED` 라 DROP_TRANSPORT/
    #    NAS/PROTO/NODE 가 아니라 **DROP_UNSPEC 으로 간다.**
    drop_cause_mix:
      normal:     0.45        # 300·302   → DROP_NORMAL   (실측 45.9%)
      unspec:     0.33        # 201·303·406·504 → DROP_UNSPEC (실측 38.9%)
      radio:      0.15        # S1AP 1xx  → DROP_RADIO    (실측 15.3%)
      transport:  0.03        # S1AP 2xx  → DROP_TRANSPORT
      node:       0.02        # S1AP 5xx  → DROP_NODE
      nas:        0.01        # S1AP 3xx  → DROP_NAS
      proto:      0.01        # S1AP 4xx  → DROP_PROTO
    # PathSwitch 시도 비율 — PSF 의 분모(ps_cnt + psf_cnt)다. 없으면 분모가
    # 장애 호뿐이라 SC-09 의 실패율이 항상 100% 가 되고 "평시 2% → 장애 25%"
    # 라는 비교가 성립하지 않는다.
    pathswitch_attempt: {service: 0.08, handover: 1.00}
    pathswitch_fail:    0.02
  # ── 장애 주입 공통 (2026-10-22) ───────────────────────────────────────
  # TIMEOUT 판정 대기시간(초). 무응답 호의 `initial_core_duration` 하한이
  # 되므로(규칙 T-2: 대기한 시간이 지연에 반영되어야 한다) 값이 틀리면
  # "무응답인데 지연이 짧은" 레코드가 남는다.
  #
  # 🔴 **프로브 실제값 미확인이다**(V3 §12-9·10). 운영 전환 시 재확인한다.
  fault:
    timeout_wait:
      s6a: 3.0                # SC-14 S6a 무응답
      s11: 5.0                # SC-03 · SC-18 S11 무응답
    # **장애 대상 셀의 판정 하한** (2026-10-29). 사람 적은 셀에 장애를 넣으면
    # 열화를 걸어도 최소 표본(20)이 서지 않아 아무 데도 안 보였다 — 모자란
    # 만큼 그 셀에 호를 더 만든다. 셀당 분당 호 수이고 장애 모양을 따라 오른다.
    # 셀이 `floor_max_cells` 보다 많은 대상(장비 전체)에는 걸지 않는다
    floor_per_cell: 8
    # kind 별 하한(없으면 위 값). 9번은 전환이 붙는 호가 절반 정도라 8호로는 셀 5분 창의 PathSwitch
    # 표본이 최소 표본(20)에 못 미친다. 전체 생산량은 그대로다. 초기값
    # 23번은 eNB 하나에 군중이 몰린다 — 셀 1분 안에 업링크 후보의 서버 2곳이 차는 호 수다(모의 F-165
    # 이후 · 셀 2~3개 · 2026-11-07). 평소 호에서 옮겨 오므로 전체 생산량은 그대로다(`floor_moved_kinds`).
    floor_by_kind:
      mobility: 16
      event_crowd: 120
    # 하한을 5G 능력 단말로만 채우는 kind(평소 호에서 옮겨 온다). 지금은 쓰지 않는다 — 5G 단말을 늘려
    # SA 표본이 차면 필요 없다(2026-11-06). 16번 재주입에서 모자라면 anchor_saturation 을 넣는다
    floor_sa_kinds: []
    # 하한을 평소 호에서 옮겨 채우는 kind 와 옮기는 호의 상한(그 분 전국 호의 몫). 초기값
    floor_moved_kinds: [event_crowd]
    floor_moved_share: 0.2
    # 23번 자동 대상 eNB 의 셀 수 범위 — 하한이 셀마다 차므로 셀이 많으면 옮기는 호가 커진다. 초기값
    crowd_enb_cells: [2, 3]
    # 자동 대상 노드 후보 — 가장 큰 노드 대비 셀 수 몫 하한. 전국 축 kind 는 더 좁다. 초기값
    auto_node_min_share: 0.5
    auto_wide_min_share: 0.75
    # eNB 정지 자동 대상 — 셀 수와 평소 호율(λ · 분당) 하한. 초기값
    outage_min_cells: 3
    outage_min_rate: 1.5
    # 16번 자동 대상 후보 — 메시 평소 15분 VIDEO 인원과 그 안 NR 가능 셀 수 하한. 초기값
    anchor_min_people: 40
    anchor_min_cells: 8
    # 14번 자동 대상의 메시 수 — 위 조건을 넘는 칸 하나와 가장 가까운 칸들의 셀 전부. 초기값
    congestion_meshes: 4
    floor_max_cells: 60
    # 27번 폭주 호 중 발신 호(3·7)의 Emergency 접속(RRC Cause 0) 비율. 초기값 — 현장 표본에 0번이 없다.
    # 평시 호에는 찍지 않는다
    disaster_emergency_share: 0.02
    # ── 27번 지진(2026-11-14 사용자 결정 B) ──
    # 진원역 — 도쿄역 100km 안 M4.5 이상 실제 진원(USGS FDSN 2000~ · 599건)을 네 곳으로 묶은 대표 위치·보통
    # 깊이. d 는 司・翠川(1999) 감쇠식의 지진 유형 항(판 경계 −0.02 · 판 내부 +0.12). 이름은 진원 지명 칸
    # (CM_QUAKE_EVENT.HYPO_NAME)에 그대로 실린다 — 기상청 진앙 지명과 같은 결로 적었다(D 는 묶음 이름)
    #   A 치바 동쪽 앞바다 191건 · B 치바 북서부 168건(2021-10-07 M5.9·2005-07-23 M6.0) · C 이바라키 남부 167건 · D 그 밖 73건
    quake_regions:
      - {name: 千葉県東方沖, lat: 35.65, lon: 140.64, depth_km: 44, d: -0.02}
      - {name: 千葉県北西部, lat: 35.58, lon: 140.14, depth_km: 64, d: 0.12}
      - {name: 茨城県南部, lat: 36.06, lon: 139.93, depth_km: 65, d: 0.12}
      - {name: 神奈川・埼玉西部, lat: 35.56, lon: 139.33, depth_km: 83, d: 0.12}
    # 진원역 안에서 흩뜨리는 폭(위도·경도 ±도 · 깊이 ±km)과 규모 범위(위 진원역의 실제 최대 6.2)
    quake_jitter_deg: 0.1
    quake_jitter_depth_km: 10
    quake_magnitude: [4.5, 6.2]
    # 셀 진도 = 감쇠 司・翠川(1999) + 환산 翠川 외(1999) I = 2.68 + 1.72·log(PGV × 1.41 × ARV) — graphio 와 같은 식.
    # 폭주는 진도 3 이상 셀(graphio rca.quake.area_intensity 와 같은 값), 정지는 진도 5약(4.5) 이상 eNB 만
    quake_surge_intensity: 3.0
    quake_down_intensity: 4.5
    # 정지 후보 eNB 하나가 꺼질 확률(%) — 초기값 · 근거 없음 · 결정 대기. 최대 셀은 옛 진도표의 가장 큰 값
    quake_down_pct: 30
    quake_down_max_cells: 40
    # eNB 지반 증폭률 표(CSV enb_id,arv · J-SHIS 표층 지반 V4 의 ARV 를 eNB 위치로 읽은 값). 비우면 모든 eNB 1.0
    # (거리만 · 도쿄는 거의 고르게 진도 3.5~4 · 정지 0곳이 보통). J-SHIS 이용 조건 확인 전이라 아직 없다
    quake_arv_path: ""
    # **장애가 끝난 뒤 하한을 거두는 꼬리** (2026-11-02 · 카드 15 → 11-03 재설계).
    # 11-02 판은 셀당 1호를 40분 붙들다 한 번에 놓아, 놓는 순간 D4(소등)가
    # 오탐했다(11-03 C-01 201건). 지금은 평시 위 초과분만 반감기로 얹고
    # 초과분이 eps 아래가 되면 놓는다 — 놓는 계단이 eps 이하다.
    # `floor_tail_min` 은 안전 상한이다. half·eps 는 초기값
    floor_tail_min: 120
    floor_tail_half_min: 10
    floor_tail_eps: 0.05
    # **혼잡 중 down RTT 1회 평균**(RTT 합계 ÷ 표본 수). 평시 1,000 이하가
    # 정상이고 10만부터 비정상으로 본다(2026-10-29). graphio 는 /1000 해 ms 로
    # 읽는다 — 100,000 = 100ms. 14·24·27번이 같은 혼잡 식을 쓴다
    congestion_rtt: [100000, 400000]
    # 혼잡 활성 가입자 배율의 상한(24번 A) — 확정대장 §3.0 의 "17–20시 1.8배". 14번은 호를 늘리지 않는다
    congestion_load: 1.8
    # 14번에서 품질이 나빠지는 기존 가입자 비율. IMSI 로 고정한다. 초기값(2026-11-05 사용자 결정)
    congestion_user_share: 0.6
    # 23번 혼잡 몫 — 가입자 비율과 처리율 범위(bps). 행사장은 100kbps 안팎(2026-11-06 사용자 결정).
    # 셀 용량에서 계산한 값이 아니다. 모두 초기값
    crowd_user_share: 0.6
    crowd_up_bps: [50000, 150000]
    crowd_dn_bps: [100000, 300000]
    # 17번 — 넘어온 단말의 호 빈도 배수(평소 1인당 기준). 일반 호로 채우면 N-01 이 묻혀서 이 호만
    # 늘린다. 실측 근거가 없는 초기값이다(2026-11-06 사용자 승인)
    sa_fallback_call_boost: 2
  # ── 증설 후 부하 이동 — 24번 (2026-10-29) ─────────────────────────────
  # A eNB(부하를 내주는 쪽)와 **소등 eNB**(B 후보) 목록. 소등 eNB 는 평소
  # 호를 만들지 않고 24번이 켰을 때만 A 의 호를 받는다(`scenarios.ShiftCfg`).
  #
  # **값은 `file` 에 있다** — eNB 번호는 실제 일본 망 자산이라 이 추적본에
  # 적지 않는다(노선 파일과 같은 이유). 형식:
  #
  #     {"from_enb": "<A>", "standby_enbs": ["<B1>", "<B2>", "<B3>", "<B4>"]}
  #
  # **B 는 여럿이어야 한다.** 한 시간에 두 번 돌리면 같은 B 를 다시 켜고
  # 끄게 되고, 그때 graphio 무호(D4) 판정에 걸린다 — `scenarios.shift_pick`.
  # 고르는 기준: A 에 붙어 있고(수십 m), 평소 호가 분당 20건 미만인 eNB.
  # 20건 이상이면 처음 소등하는 순간 무호로 탐지된다.
  capacity_shift:
    file: data/capacity_shift.json
  # ── U-Plane 세션 분포 모수 (2026-10-14) ───────────────────────────────
  # 코드 기본값은 `src/datagen/session.py` 의 `Shape` 다. 여기 적은 키만
  # 덮어쓰고, **모르는 키를 주면 멈춘다** — 오타가 "기본값으로 돌았다"로
  # 끝나지 않게 하려는 것이다.
  #
  # 양은 전부 random 이다(설계 §1.3). 고정 비율로 만들면 분포가 부자연스럽고
  # 최소 표본 규칙(불변규칙 5)이 실제로 걸리는지 확인할 수 없다.
  uplane_session:
    # 세션 길이(분) 평균 — 1 에서 잘린 기하분포. **이 값이 곧 transport 원시
    # 레코드의 증가 배수다**(활성 = 새 세션 × 평균 수명). 올리면 Interim 이
    # 늘고 생성·Parquet 비용이 비례해 늘지만 집계가 세는 수는 그대로다.
    span_mean: 2.0
    span_max: 10              # §1.3 의 "1~10분"
    sessions_max: 3           # 호당 세션 수 상한. 평균은 rates 에서 파생된다
    http_tx_mean: 3.5         # 세션당 HTTP 트랜잭션 m 의 평균 (§1.3 "1~20")
    http_tx_max: 20
    # "U 에 의한 종료" — C-Plane 은 정상인데 앱이 끊는다. `U-26`(HTTP
    # 무응답률)에만 드러난다. `U-23` 의 분모는 무응답을 빼므로 HTTP 성공률은
    # 흔들리지 않는다(graphio `metrics/kpi.py` 의 U-23 주석).
    app_abort: 0.01
    # ── Call Type 별 세션 확률 가중 (2026-10-15) ──────────────────────
    # **알림만 받고 끝나는 호는 데이터 세션을 열지 않는다.** 전에는 모든 성공
    # 호가 같은 확률로 세션을 열어서 U-Plane 이 실제보다 많고 고르게 퍼졌다 —
    # `_k()` 주석은 "Paging·TAU·Detach 는 트래픽과 무관"이라 적어 두었는데
    # 구현이 Call Type 을 보지 않았다.
    #
    # **상대 가중이고 총량은 안 바뀐다** — 그 분 호들의 가중 평균으로
    # 정규화하므로 위 `rates.transport`(분당 새 세션 수)가 그대로다. 바뀌는
    # 것은 "어떤 호가 그 세션을 여는가"다.
    #
    # 적은 키만 덮어쓴다. 기본값은 `session.CT_SESSION_W`:
    #   01 SRMO 1.0 · 02 SRMT 0.3 · 06·07 ESR 0.2 · 00·08 ATTACH 0.1
    #   03 TAU · 04 PAGING · 05 DETACH · 40 AUTH = 0 · 60 APP 1.0
    #
    # 코드 테이블은 `CD_CALL_TYPE` 이다. **모르는 코드는 1.0** — 0 으로
    # 떨어뜨리면 "그 절차는 데이터를 안 쓴다"와 "코드를 모른다"가 섞인다.
    call_type_weight: {}

    # 수명 3분 이상인 세션이 핸드오버를 겪을 비율. **세션은 끊기지 않고 셀만
    # 바뀐다**(ONGOINGFLAG=4, 불변규칙 6). C-Plane 해제 Cause 가 핸드오버
    # 계열이면 이 확률과 무관하게 겪는다.
    handover: 0.25

    # ── 앱 그룹별 세션 트래픽 (2026-10-29 사람 결정 · `session.app_traffic`) ──
    # 전에는 22개 그룹이 전부 가입자-분 1.6KB 로 같았다(동영상 포함). graphio
    # 체감 판정(활성 500ms · down 패킷 10개)을 넘는 가입자-분이 3% 뿐이었다.
    #
    # 키는 앱 사전 `CM_APP_CODE.GROUP_CODE` 그대로다(graphio `xp.app_class` 와
    # 같은 이름). `active_s` 가 있는 그룹은 **분당 사용 모양으로 새로 만들고**,
    # 없는 그룹은 `default.scale` 배를 곱한다.
    #   active_s  분당 활성 초 [하한, 상한] — 세션 수명(분)마다 한 번씩 뽑는다
    #   dn_mbps   활성 중 down 속도 [하한, 상한] — **체감 VIDEO 저속 임계(5Mbps)
    #             보다 위**에 둔다. 아래면 평시부터 저속 판정이 켜진다
    #   up_ratio  up 바이트 / down 바이트 [하한, 상한]
    #   pkt_bytes 패킷 하나의 바이트(기본 down 1400 · up 200)
    # 값은 일반 모바일 사용 수준이다 — 시뮬레이터 판정 결과에 맞춘 숫자가 아니다.
    app_traffic:
      default: {scale: 2.0}
      STREAMING:                 # 동영상 — 받아 두고 쉬는 버퍼링 모양. 분당 15~200MB
        active_s: [15, 40]
        dn_mbps: [8, 40]
        up_ratio: [0.01, 0.03]   # 거의 ACK
      GAME:                      # 계속 주고받는 작은 패킷. 분당 0.5~7MB
        active_s: [40, 60]
        dn_mbps: [0.1, 1.0]
        up_ratio: [0.3, 0.5]
        pkt_bytes: {Dnlink: 300, Uplink: 120}
  # ── U-Plane 원시는 MySQL 이 아니라 로컬 Parquet 로 간다 (2026-10-14) ──
  # 분당 6.3만 행 INSERT 의 68% 가 이 세 계열이었고, 집계가 끝나면 아무도 다시
  # 읽지 않는다(1분 집계의 입력 전용).
  #
  # **C-Plane 도 같은 길로 갔다**(2026-10-14, 2차 — 아래 `cplane_parquet`).
  # 이 자리에 "C-Plane 은 화면이 원시를 직접 조회하므로 그대로 MySQL 이다"라고
  # 적혀 있었는데 **더는 사실이 아니다.** 그 조회가 1차 통계 PM_COR_*_1M 로
  # 옮겨 갔고(graphio 2026-10-14), 남은 소비자가 1분 집계뿐이 되었다.
  #
  # 집계 산출물(GP_KPI_*·PM_*_1M)은 전부 MySQL 이다 —
  # 원칙은 "MySQL 에는 통계만 올라간다".
  uplane_parquet:
    # **읽는 쪽과 같은 디렉터리여야 한다.** graphio 의 `paths.uplane_raw` 와
    # 짝이고, 어긋나면 집계가 조용히 0행이 된다(에러가 나지 않는다).
    #
    # **데이터는 양쪽 코드 저장소 밖에 둔다** (2026-10-14). 전에는 읽는 쪽
    # 저장소 안(`../graphio-probe-rca/data/...`)을 가리켰는데, 그러면 쓰는
    # 쪽이 남의 git 작업 디렉터리에 분당 수 MB 를 쌓는다.
    # `graphio-data-generator/` 는 2026-10-08 분리 당시의 흔적만 남은
    # 디렉터리이고 **git 저장소가 아니라서** 그 자리에 적합하다. 이쪽
    # 저장소의 `data/` 도 쓸 수 없다 — git 안이고 `Dockerfile` 이
    # `COPY data/ ./data/` 로 이미지에 굽는다.
    #
    # **상대경로는 이 저장소 루트 기준이다** — `cli._uplane_store` 가
    # `(HERE / raw).resolve()` 로 푼다. cwd 와 무관하므로 어디서 띄워도 같은
    # 디렉터리이고, `gp.sh start gen` 이 `cd probe-datagen` 에서 띄우는 것과
    # 결과가 같다. 컨테이너에서는 `config/local.yaml` 이
    # `/app/data/uplane_raw`(절대경로)로 덮고 호스트의 이 디렉터리가 거기
    # 마운트된다 — 로컬 프로세스와 컨테이너가 **같은 호스트 디렉터리**를 본다.
    root: ../graphio-data-generator/data/uplane_raw
    # 몇 분치를 남길지. **집계 여부와 무관하게 자른다**(사람 지시).
    # 기준은 벽시계가 아니라 디스크에 있는 가장 늦은 분이다 — pemfill 이
    # 과거를 메울 때 쓰는 즉시 지워지지 않게 하려는 것이다.
    retain_minutes: 10
  # ── C-Plane 원시도 로컬 Parquet 로 간다 (2026-10-14, 2차) ───────────────
  # 구조는 U-Plane 과 **같다**(코드도 한 벌 — `src/datagen/raw_parquet.py`).
  # 계열은 `lte_call` 하나이고 **다른 것은 보관 기간뿐이다.**
  cplane_parquet:
    # **읽는 쪽과 같은 디렉터리여야 한다.** graphio 의 `paths.cplane_raw` 와
    # 짝이고, 어긋나면 집계가 조용히 0행이 된다(에러가 나지 않는다).
    # 저장소 밖에 두는 근거는 위 `uplane_parquet.root` 주석에 있다.
    root: ../graphio-data-generator/data/cplane_raw
    # 몇 분치를 남길지. **1440분 = 24시간이고, U-Plane(10분)보다 길다.**
    #
    #   ① 구 MySQL 세대의 파티션 보관이 24시간이었다(pemdb1.RETAIN_HOURS).
    #      저장소를 바꾼 것이 조회 가능 범위를 조용히 줄이면 안 된다.
    #   ② **끊어 둔 기능을 되살릴 여지다.** SCR-06(호 조회)·SCR-07(가입자
    #      추적)·EV-01·02·03·04c 는 "원시를 직접 조회"가 필요해서 끊었다.
    #      되살리기로 결정되면 이 보관 기간 안의 구간만 조회할 수 있다 —
    #      10분으로 두면 되살려도 쓸 수 없다.
    #
    # 디스크 비용은 1분치 zstd 약 1.4MB → 24시간 약 2GB 다.
    # 기준은 벽시계가 아니라 디스크에 있는 가장 늦은 분이다(U-Plane 과 동일).
    retain_minutes: 1440
  # 장애 주입 정답 파일. **graphio 의 채점이 읽는 경로다**
  # (`pipeline.score_against_truth` → `cfg.path("truth")/ground_truth.json`).
  # 생성과 같은 호출에서 쓰지 않으면 정답이 데이터와 다른 세대가 된다.
  truth_out: ../graphio-probe-rca/data/truth/ground_truth.json

# ── 가입자 이동 (`pemdb1.Mobility`) ──────────────────────────────────────
#
# **기본값이 "아무도 움직이지 않음"이다.** 켜면 전환 수와 셀 쌍 분포가 바뀌어
# 기존 기준선과 전후 비교가 안 되므로, 켜는 것은 사람의 결정이어야 한다.
#
# 끈 상태에서도 핸드오버는 일어난다 — `uplane_session.handover` 확률로
# **인접 셀을 추첨**한다. 그건 한 전환만 보면 맞지만 이어 놓고 보면 가입자가
# 순간이동한다(A→B 갔다가 다음엔 A 반대쪽 C 로). 그래서 셀 쌍 표에 의미 있는
# 쌍이 쌓이지 않고 노선 코리도 롤업이 서지 않는다.
#
# 경로를 깔면 전환이 추첨이 아니라 **다음 칸**이 된다. 실측(12경로 · 8칸 ·
# 가입자 30% 태움 · 14분): 세션 안 전이 8,032건 중 비인접 0건, 구간 71개에
# 집중(상위 구간 354건).

  # ── 망 모드 (LTE · SA) — **`pemdb1` 안이다** ───────────────────────
  #
  # 5G 능력(`ue_dcnr` 0/1)은 **단말(IMEI)에 고정**이다(사용자 결정 2026-11-02).
  # 가입자 풀을 만들 때 한 번 정하므로 **gen 재시작부터 적용된다** — 실행
  # 중에 바꾸면 같은 IMSI 의 능력이 중간에 바뀌고, 그것이 고치려던 모순이다.
  # `ue_dcnr = -1` 은 단말이 아니라 **그 절차에 IE 가 없었다**는 호 단위
  # 사건이고, 비율은 프로파일 그대로다(`generator._ue_dcnr`).
  # 기종별 5G 규칙은 원천이 없어 모든 단말을 이 비율로 추첨한다.
  net_mode:
    # 5G 능력 단말 비율. 사용자 결정(2026-11-06) — 단말은 5G 가 많고(50~70%) 세션은 SA·LTE 가 비슷하게.
    # 0.65 는 그 범위의 초기값이다. 난수는 단말마다 고정이라 값을 올려도 있던 5G 단말은 그대로다
    sa_device_share: 0.65
    # **숨은 SA 상주 단말**(17번 `sa_fallback`) — 가입자 풀 대비 비율. 평소 SA 에 붙어 있어 EPC 레코드를
    # 내지 않는 5G 단말이고, 풀 **밖**에 따로 만들어 평소 생산량·구성이 바뀌지 않는다. 17번이 걸리면
    # 그 지역의 이 단말들이 LTE 로 넘어온다. 초기값(현장 SA 가입자 비율 확인 전)
    # 0.15 → 0.35(2026-11-06) — 평소 비중이 30% 에서 65% 가 되면 같은 N-01 10%p 상승에 넘어올 단말이
    # 약 2.4배 든다. 초기값
    sa_resident_share: 0.35
    # NR 을 낼 수 있는 eNB 비율 — eNB 해시로 고정한다(`pemdb1._nr_on`). 현장 추출은 호가 있는 eNB 의
    # 41%(96명 · 치우친 표본)였지만 사용자 결정(2026-11-06)으로 세션이 SA·LTE 절반씩이 되게 올렸다. 초기값
    nr_enb_share: 0.9
    # 호 길이(초 상한) → NR 가능 eNB 에서 NR 이 붙는 확률. 초기값 — 현장 모양은 0·0.45·0.9·1.0 이었고
    # 호의 54% 가 5초 미만이라 그 값으로는 세션 몫이 절반에 닿지 못한다. 위 값과 곱해 5G 단말 세션의 약 76%,
    # VIDEO 판정 인원의 SA 비중 약 50% 를 노린다(호 길이 몫 54·30·12·5%)
    nr_by_length: [[5, 0.8], [20, 0.85], [60, 0.95], [.inf, 1.0]]

  # ── 가입자 이동 — **`pemdb1` 안이다** ─────────────────────────────
  #
  # 최상위에 두었다가 `cli` 가 `pem.get("mobility")` 로 읽어 **한 번도
  # 닿지 않았다**(2026-10-27). 경로를 깔아도 `routes 0` 이고 에러는
  # 나지 않는다 — `locale`·`scope` 와 같은 자리에 둔다.
  mobility:
    # **실제 노선을 쓰려면 이 파일을 적는다.** 셀 키를 순서대로 나열한다 —
    # 형식은 `handover.load_routes` 머리말. 모르는 셀 키가 있으면 멈춘다
    # (조용히 건너뛰면 "정의한 구간이 데이터에 없다"가 되고 원인이 오타다).
    #
    # **야마노테선은 `data/lines/yamanote.json` 이고 git 에 없다.** `data/` 가
    # `.gitignore` 이고 그게 의도다 — 그 파일에는 **실제 일본 망의 eNB ID
    # 목록**이 들어간다(셀·노드 키는 평문이다 — 불변규칙 14). 추적본에 넣으면
    # 자산 정보가 git 히스토리에 영구히 남는다.
    #
    # 그래서 **환경마다 한 번 만든다** — 그 환경의 DB 를 보고 뽑는다:
    #
    #     cd ../graphio-probe-rca && .venv/bin/python tools/build_line_route.py
    #
    # 역 좌표(공개 정보)와 뽑는 규칙은 그 스크립트 안에 있다. 파일이 없는데
    # 이 값을 채우면 **멈춘다** — 조용히 자동 생성으로 넘어가지 않는다.
    routes_file: data/lines/yamanote.json
    # 파일이 없을 때 자동 생성할 경로 수. `0` 이면 이동 자체가 꺼진다.
    # 최근접 eNB 체인으로 깐다 — 그럴듯한 경로이지 실제 노선은 아니다
    count: 0
    length: 8                 # 경로 한 개의 칸 수
    # 칸당 체류시간(초). 세션 평균 수명(3분)보다 짧아야 **한 세션이 여러 칸을
    # 겪는다**. 노선 파일(`routes_file`)은 자기 값을 들고 오므로 여기를 보지
    # 않는다 — 야마노테선은 역간 3분을 3등분해 **칸당 60초**다
    dwell_min: 45
    dwell_max: 150
    loop_share: 0.25          # 순환선 비율(야마노테선). 아니면 끝에서 되돌아온다
    sub_share: 0.25           # 경로에 **태울** 가입자 비율
    call_share: 0.40          # 이동 가입자를 **고를** 비율 — 아래 `hourly` 가 있으면 안 쓴다

    # ── 그룹 — 고정 / 그냥 이동 / 지하철 (2026-10-29 사람 결정) ───────────
    #
    # 한 가입자는 한 그룹이다. 노선 탑승자(`sub_share`)를 먼저 뽑고, 나머지
    # 중 `walk_share` 가 **그냥 이동**(도보·버스·차)이다 — 이웃 eNB 로
    # `walk_sec` 마다 옮겨 가고 세션이 따라간다. 나머지가 고정이다.
    walk_share: 0.45
    walk_sec_min: 180
    walk_sec_max: 600
    # 기동 때 **미리 걷기**(분). 재시작하면 걷는 사람이 가중 추첨 위치(고가중 셀)로
    # 돌아가 저가중 외곽 셀이 몇 시간 비었다 — 13:33 재시작 뒤 회복에 약 3시간
    # (히나 실측 11-03). 그만큼 XDR 없이 이동 규칙만 돌려 평시 분포에서 시작한다.
    # 초기값. 0 이면 끈다
    walk_warmup_min: 180
    #
    # **시간대별 호 비율.** `[시작시, 끝시, 고정%, 이동%, 지하철%]` 이고
    # **지하철은 이동에 포함된다** — 그냥 이동 = 이동 − 지하철. 고정과
    # 이동이 반대로 움직인다(새벽엔 집, 낮엔 밖). 지하철은 운행 시각
    # (`subway_hours`) 밖에서 0 이고 그 몫은 그냥 이동으로 간다. 경계는
    # `blend_min` 분에 걸쳐 선형으로 넘어간다. 0~24시를 빈틈없이 덮어야 한다.
    hourly:
      - [0,  5,  90, 10,  0]
      - [5,  7,  60, 40, 10]
      - [7,  9,  30, 70, 50]     # 출근
      - [9,  17, 10, 90, 30]
      - [17, 20, 30, 70, 50]     # 퇴근
      - [20, 24, 60, 40, 10]
    subway_hours: [6, 24]
    blend_min: 60
    #
    # **시간대 이름과 한 줄 특징 — gen-ui 문구 전용**(2026-11-04 사용자 요청). 생성기는
    # 읽지 않는다. `h` 는 위 `hourly` 줄의 시작시와 같아야 한다(어긋나면 화면이 이름 없이
    # 숫자만 쓴다). 비율·생성량 숫자는 여기 적지 않는다 — 화면이 `hourly`·곡선에서 계산한다.
    # `warn` 은 "이 시각으로 옮기면 무엇을 조심하나"다
    hourly_notes:
      - {h: 0,  name: 새벽, name_ja: 深夜・未明,
         note: 대부분 집에 머문다 — 하루 중 셀 표본이 가장 적다,
         note_ja: ほとんどが自宅に留まる — 一日で最もセル標本が少ない,
         warn: 저트래픽 셀의 장애는 최소 표본에 못 미쳐 미탐지될 수 있다 · 노선 시나리오는 재현되지 않는다,
         warn_ja: 低トラフィックセルの障害は最小標本に届かず未検知になりうる・路線シナリオは再現されない}
      - {h: 5,  name: 이른 아침, name_ja: 早朝,
         note: 밖으로 나오기 시작하고 생성량이 오른다 — 지하철은 운행 시작 직후라 노선 쏠림은 약하다,
         note_ja: 外出が始まり生成量が上がる — 地下鉄は運行開始直後で路線への偏りは弱い,
         warn: 생성량이 오르는 구간이라 앞뒤 분의 기준선이 함께 움직인다,
         warn_ja: 生成量が上がる区間で前後の分のベースラインも動く}
      - {h: 7,  name: 출근, name_ja: 通勤（朝）,
         note: 출근 이동으로 지하철 노선 셀에 세션이 몰린다,
         note_ja: 通勤移動で地下鉄路線セルにセッションが集中する,
         warn: 전국에 퍼진 장애도 지도에서는 노선 모양으로 보일 수 있다 · 노선 시나리오 재현에 알맞다,
         warn_ja: 全国に散った障害も地図では路線の形に見えうる・路線シナリオの再現に向く}
      - {h: 9,  name: 낮, name_ja: 日中,
         note: 출근이 끝나 도심에서 걷는 사람이 가장 많다 — 세션이 도심에 넓게 퍼진다,
         note_ja: 通勤が終わり都心を歩く人が最も多い — セッションが都心に広く散る,
         warn: 노선 쏠림이 덜해 지역 장애가 비교적 고르게 보인다,
         warn_ja: 路線への偏りが小さく地域障害が比較的均等に見える}
      - {h: 17, name: 퇴근, name_ja: 通勤（夕）,
         note: 퇴근 이동으로 출근 때와 같은 노선 쏠림이 생기고 부하가 하루 중 가장 높아진다,
         note_ja: 帰宅移動で朝と同じ路線への偏りが生じ、負荷が一日で最も高くなる,
         warn: 노선 쏠림과 최대 부하가 겹친다 — replay 가 가장 무거운 시각이다,
         warn_ja: 路線への偏りと最大負荷が重なる — replay が最も重い時刻}
      - {h: 20, name: 저녁, name_ja: 夜間,
         note: 집으로 돌아가며 고정 세션이 다시 늘어난다,
         note_ja: 帰宅して固定セッションが再び増える,
         warn: 새벽보다는 표본이 많고 노선 쏠림은 약하다,
         warn_ja: 深夜よりは標本が多く路線への偏りは弱い}

    # ── 여정 — **칸 번호로 한쪽 방향만** ─────────────────────────────────
    #
    # 비우면 모두 끝없이 순환한다. 그러면 역 주변 체류가 없어 역세권 혼잡
    # (`j-sc-14` 도심 역 저녁 러시)이 생기지 않는다 — 모든 가입자가 늘
    # 이동 중이기 때문이다. `share` 합이 1 보다 작으면 나머지가 순환한다.
    #
    # **모델은 칸 번호다. 역이 어딘지 프로그램은 몰라도 된다.** 문자열을 주면
    # 노선의 `station_pos` 로 풀어 주지만 그건 입력 편의일 뿐이다.
    #
    # **한 가입자는 한 방향으로만 간다.** `12→30` 은 증가, `48→40` 은 감소다.
    # 하차하면 머물고, 다시 탈 때도 같은 구간을 같은 방향으로 간다 — 왕복으로
    # 두면 그 사람의 전환 구간이 양방향으로 섞여, 장애를 한 방향 구간에
    # 주입했을 때 영향 가입자가 반대 방향 통행자까지 포함한다.
    #
    # 칸 범위를 벗어나거나 `from == to` 이거나 모르는 노선·이름이면 **멈춘다.**
    #
    #   journeys:
    #     - {route: YMT-OUTER, from: 12, to: 30, share: 0.35}
    #     - {route: YMT-OUTER, from: 48, to: 40, share: 0.25}   # 감소 방향
    #     - {route: YMT-INNER, from: 5,  to: 9,  share: 0.20}
    #
    # **`stations: [최소, 최대]` — 임의 역에서 타서 n 역 뒤에 내린다**
    # (2026-10-29). 내린 역에서 머문 뒤 **그 역에서 다시 타고** 새 n 을
    # 뽑는다 — 원형 노선 위를 구간 단위로 옮겨 다닌다. 기동 때 이미 타고
    # 있거나 머무는 중인 상태로 흩어 둔다.
    #
    # 전에는 `{from: 17, to: 41}` 하나였고 **전원이 시나가와에 서서 같은
    # 순간에 출발했다** — 2,500명이 한 칸에 타고 1분에 한 칸씩 함께 움직여
    # eNB 하나가 전체 호의 25% 를 받았고, 신주쿠에 함께 내려 쌓였다.
    journeys:
      - {route: YMT-OUTER, stations: [2, 10], share: 0.25}
      - {route: YMT-INNER, stations: [2, 10], share: 0.25}
    off_sec_min: 300          # 하차 후 머무는 시간(초)
    off_sec_max: 1800

    # ── 거주 지역성 — **경로와 다른 축이다** ────────────────────────────
    #
    # 경로는 "이 사람이 이 구간을 다닌다"이고 이쪽은 "이 사람이 여기 산다"다.
    # 노선을 깔지 않아도 이것만 켤 수 있다.
    #
    # **기본 끄기다. 샘플 XDR 이 이 축을 규정하지 않는다** — 분포
    # (`data/pemdb1/_distributions.json`)의 축은 call_type · flags ·
    # release_cause · first_error · durations · apn · vendor_model 이고,
    # `profile.json` 의 `lte_call` 범주형 51개 중 셀·가입자를 잇는 것은 없다
    # (`First_eNB_PLMN`·`imsi_mcc_mnc_info` 는 PLMN 접두어다). 규정하지 않는
    # 축에 모델을 넣는 것은 **사람의 결정**이어야 한다.
    #
    # 끄면 한 가입자가 60분에 서로 다른 셀 25개(전체 348개 중)에 나타난다 —
    # 일별 체감(S-01)·민원 조회(SCR-07' "이 가입자가 어디를 다녔나")를 검증할
    # 때 그 화면이 성립하지 않는다. 그때 켠다.
    #
    # **켜면 기준선이 갈린다**: 같은 가입자가 반복해 나타나 셀·분 SUBS 가
    # 8.7 → 6.8 (-22%) 로 내려가고, SUBS·FAIL_SUBS·영향 가입자·Q-01/Q-02
    # 분모가 함께 움직인다.
    home_locality: false
    home_radius_m: 10000      # 거주지로 볼 주변 반경(m). 켜졌을 때만 쓴다

    # ── TA 묶기 — **마스터에 TAC 가 없다** ───────────────────────────────
    #
    # `CL_CELL_MAP` 에 TAC 컬럼이 없어 `load_cells` 가 `tac=0`("모름")으로 둔다.
    # 그러면 TA 경계가 없어 **TAU(call_type 5)가 한 번도 나지 않는다** — 에러가
    # 아니라 그 절차가 데이터에서 통째로 빠진다.
    #
    # 그래서 지리적으로 가까운 eNB 를 묶어 만든다. 실제 망은 TA 하나가 여러
    # eNB 를 덮으므로 **eNB 당 하나로 두면 안 된다** — 그러면 eNB 간 전환마다
    # TAU 가 나 가입자·분당 0.5건이 된다.
    #
    # 좌표 없는 셀(UNMAPPED)은 `tac=0` 으로 남는다 — 위치를 모르면 TA 도
    # 모른다(불변규칙 12·17).
    #
    # **이 값은 `handover.assign_tacs` 의 기본값(7)이고 아직 설정으로 빼지
    # 않았다.** 바꿀 이유가 생기면 그때 키를 만든다 — 지금 두면 안 쓰는 키가
    # 하나 늘어난다.
