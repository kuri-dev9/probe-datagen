// 않는다). eNB 가 주인공인 보기(전체 eNB·TA)에서만 된다

const unmy=(y)=>(Math.atan(Math.exp(y/R))-Math.PI/4)*360/Math.PI;
function boxRect(e){
  const r=wrap.getBoundingClientRect();
  const x0=Math.min(BOXSEL.x,e.clientX)-r.left, y0=Math.min(BOXSEL.y,e.clientY)-r.top;
  return [x0, y0, Math.abs(e.clientX-BOXSEL.x), Math.abs(e.clientY-BOXSEL.y)];

function finishBox(e){
  const [x,y,w,h]=boxRect(e); const bx=document.getElementById('boxsel');

  if(w<6||h<6) return;
  const m=svg.getScreenCTM(), r=wrap.getBoundingClientRect();
  const [la0,lo0]=[unmy(-(((y+h+r.top)-m.f)/m.d)), ((x+r.left)-m.e)/m.a];
  const [la1,lo1]=[unmy(-(((y+r.top)-m.f)/m.d)), ((x+w+r.left)-m.e)/m.a];
  const cells=D.cells.filter(c=>c.lat>=la0&&c.lat<=la1&&c.lon>=lo0&&c.lon<=lo1);
  if(!cells.length){ PICK=null; draw(); return; }
  const uniq=a=>[...new Set(a.filter(v=>v!=null&&v!==''))];
  PICK={kind:'box', id:`${la0.toFixed(4)},${lo0.toFixed(4)},${la1.toFixed(4)},${lo1.toFixed(4)}`,
        box:[la0,lo0,la1,lo1], cells,
        enb:uniq(cells.map(c=>c.enb)), sgw:uniq(cells.map(c=>c.sgw)),
        mme:uniq(cells.map(c=>c.mme)), tac:uniq(cells.map(c=>c.tac)),

}

//: **휠 한 칸 = 한 단계, 짧게 날아간다**(사람 결정 2026-11-03). 일반 지도
//: (카카오맵·구글)와 같은 방식이다. 세 번 돌아 여기 왔다 —
//:   ① 한 칸 = 한 단계 **순간 이동** + 입력 모으기·쉬기 → "딱딱하다"
//:   ② 굴리는 동안 연속, 멈추면 단계로 맞춤 → "커졌다 돌아오는 게 이상하다"
//:   ③ 도중에 또 굴리면 그 자리에서 끊고 새로 출발 → 연속 2회부터 "이상하다"
//: 지금은 **줄을 세운다.** 굴린 칸 수는 목표 단계(`WHEEL_TGT`)에 쌓기만 하고,
//: 앞 이동이 80% 왔을 때(`FLY_NEAR`) 다음 칸을 **앞 이동의 도착점에서** 이어
//: 붙인다. 다시 그리기(`draw`)는 줄의 마지막 칸이 끝났을 때 한 번이다.
//: 고정점(커서)은 줄이 시작될 때 하나로 묶는다 — 칸마다 바꾸면 이어 붙인
//: 이동의 도착점이 앞 이동의 궤적에서 벗어나 끝에서 튄다
const WHEEL_MS=280, WHEEL_STEP=50;
let WHEEL_TGT=0, WHEEL_AT=null, WHEEL_RUN=null, WHEEL_ACC=0, WHEEL_LAST=0;
const nearestLevel=mpp=>{ let i=0;
  ZOOM_MPP.forEach((s,k)=>{ if(Math.abs(Math.log(s/mpp))<Math.abs(Math.log(ZOOM_MPP[i]/mpp))) i=k; });
  return i; };
//: 줄의 다음 칸을 띄운다 — 진행 중이면 그 **도착점**에서, 아니면 지금 화면에서
function wheelStep(){
  const base=WHEEL_RUN ? WHEEL_RUN.v : VB;
  const from=WHEEL_RUN ? WHEEL_RUN.i : nearestLevel(mppOf(VB));
  if(from===WHEEL_TGT) return;
  const i=from+(WHEEL_TGT>from?1:-1);
  const v=zoomAbout(base, ZOOM_MPP[i]/mppOf(base), WHEEL_AT[0], WHEEL_AT[1]);
  const run={i, v, near:false};
  WHEEL_RUN=run;
  run.id=flyTo(v, WHEEL_MS, {at:WHEEL_AT, near:()=>{ run.near=true; wheelStep(); }});
}
wrap.addEventListener('wheel',e=>{
  e.preventDefault(); if(!VB) return;
  const now=performance.now();
  if(now-WHEEL_LAST>300) WHEEL_ACC=0;   // 지난 손길의 찌꺼기는 버린다
  WHEEL_LAST=now;
  // 줄 단위(파이어폭스)는 픽셀로 바꾼다. 마우스 한 칸은 보통 ±100 이다
  const dy=e.deltaY*(e.deltaMode===1?33:1);
  let dir=0;
  if(Math.abs(dy)>=WHEEL_STEP) dir=dy>0?1:-1;
  else { WHEEL_ACC+=dy; if(Math.abs(WHEEL_ACC)>=WHEEL_STEP){ dir=WHEEL_ACC>0?1:-1; WHEEL_ACC=0; } }
  if(!dir) return;
  // 줄이 끝났거나 다른 이동(장애 맞추기·전체 보기)이 끼어들었으면 새 줄이다
  if(WHEEL_RUN && FLY!==WHEEL_RUN.id) WHEEL_RUN=null;
  if(!WHEEL_RUN){
    const r=wrap.getBoundingClientRect();
    WHEEL_AT=[VB.x+VB.w*(e.clientX-r.left)/r.width, VB.y+VB.h*(e.clientY-r.top)/r.height];
    WHEEL_TGT=nearestLevel(mppOf(VB));
  }
  WHEEL_TGT=Math.min(Math.max(WHEEL_TGT+dir, 0), ZOOM_MPP.length-1);
  // 진행 중이면 쌓기만 한다 — 80% 지점에서 앞 이동이 이어 붙인다.
  // **이미 그 지점을 지났으면** 이어 붙일 기회가 지나갔으니 여기서 띄운다
  if(!WHEEL_RUN || WHEEL_RUN.near) wheelStep();

setInterval(pollStandby, FAULT_POLL_MS);
// 보기를 바꾸면 **고른 것을 푼다.** SGW 를 고른 채 MME 보기로 넘어가면
// 바뀐 화면에 옛 선택의 테두리만 남아 무엇이 골라졌는지 안 읽힌다
// 보기를 바꿔도 **장애는 남긴다** — 장비 선택만 푼다
document.getElementById('mode').onchange=()=>{ PICK=null; syncFaultToggle(); draw(); };
// **지도까지 올라가지 않게 막는다.** `focusInc` 가 목록을 다시 그려 누른
// 단추가 문서에서 떨어지면, 지도의 click 처리기가 `closest('#flist')` 를
// 못 찾아 "빈 곳 누름"으로 읽고 방금 고른 것을 풀었다
document.getElementById('ftabs').addEventListener('click',e=>{
  e.stopPropagation();
  const b=e.target.closest('button'); if(!b) return;
  FTAB=b.dataset.k; localStorage.setItem('gp-map-ftab',FTAB);
  document.getElementById('fbody').scrollTop=0; renderList();
});
document.getElementById('fbody').addEventListener('click',e=>{
  e.stopPropagation();
  const b=e.target.closest('.it'); if(b) focusInc(b.dataset.id); });
// 손이 멈춘 줄의 사건 범위를 미리 받는다 — 누를 때는 받아 둔 값을 쓴다. 목록을 훑고 지나가는
// 줄까지 묻지 않게 잠깐 머문 것만 받는다
let EVT_HOVER=0;
document.getElementById('fbody').addEventListener('pointerover',e=>{
  const b=e.target.closest('.it'), h=b&&histOf(b.dataset.id);
  clearTimeout(EVT_HOVER);
  if(h) EVT_HOVER=setTimeout(()=>loadEvt(h), 60);
});
document.getElementById('flist').querySelector('.hd').onclick=e=>{
  e.stopPropagation();
  const f=document.getElementById('flist'); f.classList.toggle('fold');
  document.getElementById('ffold').textContent=f.classList.contains('fold')?T('펼치기'):T('접기');
  placeLabels(); };
syncFaultToggle();
// **보이는 것 전체**에 맞춘다 — 마스터까지. 생성 범위로만 맞추면
// "전체 보기"가 전체를 안 보여준다
document.getElementById('reset').onclick=()=>{
  const xs=[], ys=[];
  for(const c of D.cells){ xs.push(mx(c.lon)); ys.push(-my(c.lat)); }
  if(ALL) for(const p of ALL.pts){ xs.push(mx(p[0])); ys.push(-my(p[1])); }
  if(!xs.length){ if(HOME){setVB({...HOME}); draw();} return; }
  // **동떨어진 몇 점이 시야를 통째로 늘린다.** 도쿄도에는 이즈제도가
  // 들어 있어 23,039셀 중 2셀이 120km 남쪽에 있고, 최대·최소로 맞추면
  // 화면이 거기까지 벌어져 정작 볼 것이 점 하나가 된다.
  // 1~99 백분위 폭의 두 배 밖은 뺀다 — **대신 몇 개를 뺐는지 적는다**
  const band=(v)=>{ const a=[...v].sort((p,q)=>p-q);
    const q0=a[Math.floor(a.length*.01)], q1=a[Math.ceil(a.length*.99)-1];
    const w=(q1-q0)||.01; return [q0-w, q1+w]; };
  const [bx0,bx1]=band(xs), [by0,by1]=band(ys);
  let out=0, x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(let i=0;i<xs.length;i++){
    if(xs[i]<bx0||xs[i]>bx1||ys[i]<by0||ys[i]>by1){ out++; continue; }
    x0=Math.min(x0,xs[i]); x1=Math.max(x1,xs[i]);
    y0=Math.min(y0,ys[i]); y1=Math.max(y1,ys[i]);
  }
  const px=(x1-x0)*.06+.002, py=(y1-y0)*.06+.002;
  const home={x:x0-px,y:y0-py,w:(x1-x0)+2*px,h:(y1-y0)+2*py};
  // **전체로도 날아간다**(사용자 11-09 "전체화면으로 확 바뀐다 — 1.5초 동안 줌 아웃으로"). 전국 장애를
  // 누를 때와 이 단추가 같은 길이다. 지도가 그려지기 전(첫 화면)에는 날 자리가 없으니 바로 놓는다
  if(VB && MAP_READY) flyTo(home, FOCUS_FLY_MAX, {settle:true});
  else { setVB(home); draw(); }
  document.getElementById('note').textContent =
    out ? T('화면 밖 {n}셀 — 동떨어져 있어 범위에서 뺐다',{n:out}) : '';
};
load();
</script></body></html>
