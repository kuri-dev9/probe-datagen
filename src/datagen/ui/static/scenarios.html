<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>probe-datagen 시나리오 현황</title>
<style>
  /* **읽는 화면이라 본문은 밝다**(사용자 11-06). 단 순백은 어두운 틀(레일·상단 바)과 대비가 너무
     세서 옅은 회색으로 낮췄다. 틀은 자기 색을 직접 들고 있어 이 값을 받지 않는다.
     색·글자 크기·폭은 초기값이고, 글자는 카드 바탕 대비 4.5:1 이상이다 */
  :root { --bg:#d6dae0; --panel:#e6e9ed; --line:#c3c9d1; --fg:#262c35;
          --dim:#505a67; --accent:#2f5c8f; --red:#94403a; --yellow:#6f561c;
          --green:#37664c; --hover:#dde1e6; --on:#d0dbe8; }
  /* 회차의 장애 ID — 지도로 가는 링크(손 모양·밑줄) */
  a.fmap { color:var(--accent); text-decoration:underline; cursor:pointer; }
  /* 문장 속 사건 — `EVT-…` 를 단위 이름(L1 장애 등)으로 바꾼다(`upgradeEvt`) */
  .evtn { border-bottom:1px dotted currentColor; cursor:help; }
  .fmsg { color:var(--dim); font-size:.9em; }
  * { box-sizing:border-box; }
  /* 위 44px 상단 바 · 왼쪽 60px 레일(`_SHELL_CSS`) 자리를 비운다 */
  body { margin:0; padding:64px 20px 20px 80px; background:var(--bg); color:var(--fg);
         font:13px/1.55 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  #doc { max-width:960px; margin:0 auto; }
  h1 { font-size:16px; margin:2px 0 12px; }
  h1 small { color:var(--dim); font-weight:normal; margin-left:8px; font-size:11.5px; }
  h3 { margin:0 0 5px; font-size:11.5px; font-weight:600; color:var(--dim); }
  button { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:6px;
           padding:3px 9px; font:inherit; font-size:12px; cursor:pointer; }
  button:hover { border-color:var(--dim); }
  button.on { border-color:var(--accent); background:var(--on); }
  button b { margin-left:5px; font-variant-numeric:tabular-nums; }
  .chips { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-bottom:8px; }
  .chips .lb { color:var(--dim); font-size:11.5px; margin-right:2px; }
  /* 맨 위 요약 — 문장, 판정·도달 아이콘 칩, 단계별 표(사용자 11-06). 누르면 그것만 거른다 */
  #sum { margin:0 0 8px; font-size:13px; }
  #msg { display:none; border:1px solid var(--yellow); border-radius:8px; padding:10px 14px;
         margin-bottom:12px; background:#e6dfc9; }
  #notes { margin-top:18px; }
  #notes ol { margin:8px 0 0; padding-left:20px; font-size:12.5px; }
  .s-ok { color:var(--green); } .s-warn { color:var(--yellow); } .s-bad { color:var(--red); }
  .s-acc { color:var(--accent); } .s-dim { color:var(--dim); }
  .unk { color:var(--yellow); }
  .dim { color:var(--dim); }
  details.sc { background:var(--panel); border:1px solid var(--line); border-radius:8px; margin-bottom:6px; }
  /* 줄 오른쪽 설명은 뺐다(사용자 11-16 — 설명은 펼친 카드에 있다). 이름은 한 줄이다 */
  details.sc>summary { display:grid; grid-template-columns:24px minmax(0,1fr) 150px 300px 40px; gap:10px;
            align-items:baseline; padding:6px 12px; cursor:pointer; list-style:none; }
  summary::-webkit-details-marker { display:none; }
  details.sc>summary:hover { background:var(--hover); border-radius:8px; }
  summary .no { color:var(--dim); font-variant-numeric:tabular-nums; }
  summary .nm { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* 배지 자리는 늘 비워 둔다 — 판정 글자가 줄마다 같은 자리에 오게 */
  summary .stc { display:grid; grid-template-columns:64px auto; gap:6px; align-items:baseline; white-space:nowrap; }
  summary .stc>.eq { justify-self:start; }
  /* 장비 장애 배지 — 코어 장비가 원인인 시나리오(나중에 빠질 수 있어 따로 보이게 · 사용자 11-16) */
  .eq { font-size:10.5px; line-height:16px; padding:0 5px; border-radius:4px; border:1px solid #8a94a3;
        color:#3b434f; background:#e6e9ee; }
  summary .st { font-size:12px; font-weight:600; }
  /* 단계 네 칸 — 색만으로 말하지 않게 기호를 함께 둔다 */
  .sgs { display:flex; gap:3px; }
  .sg { display:inline-block; min-width:31px; padding:0 3px; border-radius:4px; font-size:10.5px; line-height:16px;
        text-align:center; white-space:nowrap; border:1px solid transparent; }
  .g-ok { background:#c9dacf; color:#234a35; } .g-warn { background:#e0d6b8; color:#54410f; }
  .g-bad { background:#e3c9c6; color:#6f2b26; } .g-dim { border-color:var(--line); color:var(--dim); }
  /* 접는 칸 — 처음에는 접혀 있다 */
  details.fold { margin-top:12px; }
  details.fold>summary { cursor:pointer; list-style:none; font-size:12.5px; font-weight:600; color:var(--accent); }
  details.fold>summary::before { content:'▸'; display:inline-block; width:16px; }
  details.fold[open]>summary::before { content:'▾'; }
  details.box { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 12px; }
  .how { margin-top:8px; padding-left:16px; border-left:2px solid var(--line); }
  .how ol { margin:0; padding-left:20px; }
  .body { border-top:1px solid var(--line); padding:12px 14px 14px; }
  /* 펼친 카드는 **한 단**이다(사용자 11-06 — 두 단은 어느 칸에 무엇이 있는지 찾기 어려웠다).
     구역마다 제목 막대로 나눈다 */
  .sec { margin-top:18px; } .sec:first-child { margin-top:0; }
  .sec>h2 { margin:0 0 8px; padding:3px 0 3px 9px; font-size:13px; font-weight:700; color:var(--fg);
            border-left:3px solid var(--accent); background:var(--hover); }
  .desc p { margin:0 0 3px; }
  .stg td:first-child { white-space:nowrap; } .stg td:nth-child(2) { white-space:nowrap; }
  @media (max-width:980px) {
    details.sc>summary { grid-template-columns:24px minmax(0,1fr) 150px; }
    summary .sgs { grid-column:1/-1; } }
  .l3t td:nth-child(1), .l3t td:nth-child(2), .l3t td:nth-child(5) { white-space:nowrap; }
  /* 답 원문 — 줄바꿈을 살리고 너무 길면 칸 안에서 스크롤한다 */
  .ans { white-space:pre-wrap; max-height:260px; overflow:auto; font-size:12px; }
  /* 한국어 해석 — 일본어 원문 아래 작은 글씨(l3log `q_ko`·`answer_ko`). 없으면 그리지 않는다 */
  .ko { display:block; margin-top:3px; font-size:11px; color:var(--dim); white-space:pre-wrap; }
  ul { margin:0; padding-left:18px; }
  /* 표는 테두리·머리글 바탕·칸 구분을 모두 둔다 — 밝은 바탕에서 선만으로는 묻혔다. 색은 초기값 */
  table { width:100%; border-collapse:collapse; font-size:12.5px; margin-top:4px; background:#f1f3f5;
          border:1px solid #8f99a6; }
  th, td { text-align:left; padding:4px 9px; border:1px solid #a4adb9; vertical-align:top; overflow-wrap:anywhere; }
  th { background:#c6ced8; color:#1f252d; font-weight:700; }
  table.kv th { width:112px; white-space:nowrap; }
  .how td:first-child { white-space:nowrap; }
  #mx { table-layout:fixed; margin:0 0 12px; }
  #mx th, #mx td { padding:0; }
  #mx th { padding:3px 9px; font-size:12px; }
  #mx th.rw { width:118px; white-space:nowrap; }
  #mx td.no { background:none; }
  #mx button { display:flex; justify-content:space-between; gap:6px; width:100%; height:100%; padding:3px 9px;
               border:0; border-radius:0; background:none; text-align:left; white-space:nowrap; }
  #mx button:hover { background:var(--hover); }
  #mx button.on { background:var(--on); box-shadow:inset 0 0 0 2px var(--accent); }
  #mx button b { margin:0; }
  #mx th:not(.rw) { text-align:center; }
  #mx button { justify-content:center; background:none; }
  /* 건수가 있는 칸만 색을 칠한다 — 어디가 잘되고 잘못됐는지 색으로 먼저 읽히게(사용자 11-06) */
  #mx td.m-ok { background:#cfe6d6; } #mx td.m-warn { background:#f2e3b6; } #mx td.m-bad { background:#f4c6bf; }
  #mx td.m-dim { background:#e3e6ea; } #mx td.m-z button b { color:var(--dim); font-weight:400; }
  .chips button i { font-style:normal; font-weight:700; margin-right:4px; }
  .chips button b.z { color:var(--dim); font-weight:400; }
  .stg tr:has(.g-ok)>td { background:#e6f2ea; } .stg tr:has(.g-warn)>td { background:#f9f0d6; }
  .stg tr:has(.g-bad)>td { background:#f9dfdb; }
  .stg tr:has(.g-ok)>td:first-child { box-shadow:inset 4px 0 0 var(--green); }
  .stg tr:has(.g-warn)>td:first-child { box-shadow:inset 4px 0 0 var(--yellow); }
  .stg tr:has(.g-bad)>td:first-child { box-shadow:inset 4px 0 0 var(--red); }
  /* 용어 — 값 옆의 짧은 뜻은 그대로 보이고, 문장 안의 코드는 점선이라 올리면 뜻이 나온다 */
  .gl { border-bottom:1px dotted var(--dim); cursor:help; }
  .mean { margin-left:7px; color:var(--dim); font-size:12px; }
  #tip { display:none; position:fixed; z-index:60; max-width:440px; padding:6px 9px; border-radius:6px;
         background:#262c35; color:#f1f3f5; font-size:12px; line-height:1.5; pointer-events:none; white-space:pre-line; }
  .tag { display:inline-block; margin-left:6px; padding:0 6px; border:1px solid var(--yellow);
         border-radius:999px; font-size:10.5px; color:var(--yellow); white-space:nowrap; }
  .sub { margin-top:12px; }
  /* 일반인용 요약 세 칸(사용자 11-14 — "실제 결과를 다 보여 주지 말고 일반인이 봐도 알게").
     기술 상세는 그 아래 "자세히 보기" 하나로 접는다. 지우지 않는다 */
  /* 세 칸 — 어떤 장애인가 · 어떻게 만드나 · 무엇이 나타나나(사용자 11-16 "카드가 옆으로 들어오면서 그림 글자가
     안 보인다. 설명, 간단한 생성 방식, 그 효과를 카드로 다시"). 시나리오 설명(옛 그림 자리)은 그 위에 카드 폭 전체로 */
  /* 두 칸(사용자 11-16 — "카드 2개로, 그래야 크기가 맞는다") — 같은 너비, stretch 로 같은 높이 */
  .plain { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; align-items:stretch; }
  .plain .mk { margin-top:8px; }
  .plain h4 { margin:8px 0 4px; font-size:11.5px; color:var(--dim); font-weight:600; }
  .plain .src { margin-top:6px; font-size:11px; color:var(--dim); }
  .plain>div { background:#f1f3f5; border:1px solid var(--line); border-radius:8px; padding:9px 12px; }
  .plain>div.r-ok { border-color:var(--green); } .plain>div.r-warn { border-color:var(--yellow); }
  .plain>div.r-bad { border-color:var(--red); }
  .plain h3 { margin-bottom:6px; font-size:12px; }
  .plain p { margin:0; font-size:13px; line-height:1.6; }
  .plain .big { font-size:15px; font-weight:700; margin-bottom:8px; }
  .plain ul.flow { margin:0; padding-left:16px; font-size:13px; line-height:1.6; }
  .plain ul.flow li { margin-bottom:4px; } .plain ul.flow b { font-weight:600; }
  /* 시나리오 설명(14~27 · 사용자 11-19 확정본) — 세 칸 위, 카드 너비. 안은 Shadow DOM 이라 이 화면 CSS 와 섞이지 않는다 */
  scn-explain { display:block; margin-bottom:8px; overflow:hidden; border:1px solid var(--line); border-radius:8px; }
  .plain .auto { margin-top:6px; font-size:11px; color:var(--dim); }
  .found { background:#f1f3f5; border:1px solid var(--line); border-radius:8px; padding:9px 12px; margin:8px 0; }
  .found h3 { margin:0 0 6px; font-size:12px; } .found p { margin:0; font-size:13px; line-height:1.6; }
  .found .auto { margin-top:6px; font-size:11px; color:var(--dim); }
  .psg { display:flex; flex-wrap:wrap; gap:4px; }
  .tech>.sec:first-child { margin-top:10px; }
  /* 생성량 표시 — 목록은 15%·50% 중 최근 판정 한 줄이고, 그것이 어느 생성량인지 줄 끝에 둔다(사용자 11-20) */
  .vb { font-size:10.5px; line-height:16px; padding:0 4px; border-radius:4px; border:1px solid var(--line); color:var(--dim); }
  .vols { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:8px 0; }
  .vols>div { border:1px solid var(--line); border-radius:8px; padding:6px 10px; min-width:0; }
  .vols h3 { margin:0 0 4px; display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .vols .vlat { font-size:12px; margin:4px 0; }
  @media (max-width:980px) { .vols { grid-template-columns:1fr; } }
  @media (max-width:980px) { .plain { grid-template-columns:1fr; } }

/* 21·23 다시 그림 · 36 새 장 · 5·6·8 옵션 줄(2026-11-21) */

/* 36 신호 폭주(2026-11-21) — 28~35 공통 틀 */

#s21 .lead,#s23 .lead,#s36 .lead,#s5 .lead,#s6 .lead,#s8 .lead{margin:-14px 0 22px;font-size:18px;line-height:1.6;color:#4f6276;background:#fff;border:1px solid #dce3ea;border-radius:14px;padding:12px 18px}
#s5 .lead.opt,#s6 .lead.opt,#s8 .lead.opt{background:#fff9ef;border-color:#ecdac0}
</style>

<template id=scx-1><section id="s1" class="scn"><div class="page"><h1>20. 데이터 중계 장비 포화</h1><div class="flow">
<section class="panel"><div class="tag">① 원인</div><h2>데이터 중계 장비 한 대의<br>세션 자원이 바닥납니다</h2><svg viewBox="0 0 400 280" role="img" aria-label="데이터 중계 장비 하나의 세션 자원이 바닥나고, 해당 데이터 중계 장비를 지나는 셀 전부가 영향을 받습니다. 셀은 여기저기 흩어져 있습니다"><rect x="6" y="14" width="388" height="252" rx="18" fill="#f0f4f8"/><text x="200" y="44" text-anchor="middle" font-size="15" fill="#7b8da0">데이터 중계 장비 하나를 지나는 셀 전부</text><path d="M70 112l200 38M170 92l100 58M96 212l174-62M196 196l74-46" fill="none" stroke="#8fa8b9" stroke-width="3"/><g color="#749981"><use href="#bs" transform="translate(70 104) scale(.5)"/><use href="#bs" transform="translate(170 84) scale(.5)"/><use href="#bs" transform="translate(96 204) scale(.5)"/><use href="#bs" transform="translate(196 188) scale(.5)"/></g><rect x="270" y="124" width="96" height="52" rx="10" fill="#fbe7d2" stroke="#d18340" stroke-width="2"/><text x="318" y="157" text-anchor="middle" font-size="16" font-weight="700" fill="#b57336">데이터 중계</text><rect x="270" y="186" width="96" height="14" rx="7" fill="white" stroke="#d18340" stroke-width="2"/><rect class="handoff" x="272" y="188" width="10" height="10" rx="5" fill="#d18340"/><text x="318" y="224" text-anchor="middle" font-size="16" font-weight="700" fill="#c0783d">세션 자원 바닥</text><text x="200" y="252" text-anchor="middle" font-size="14" fill="#8d9ca7">셀이 한 동네에 모이지 않고 흩어져 있음</text></svg><p>데이터 중계 장비는 휴대폰마다 연결 정보(세션)를 담아 두는 <b>자리 수가 정해져 있습니다</b>. 한 대에서 자리가 다 차면 새 연결을 받을 자리가 없습니다. 해당 장비를 지나는 셀 전부가 영향을 받습니다.</p><div class="arrow">→</div></section>
<section class="panel"><div class="tag">② 현상</div><h2>새 접속 요청은 거절되고<br>쓰던 연결은 그대로입니다</h2><svg viewBox="0 0 400 280" role="img" aria-label="새 세션 요청은 자원 없음으로 거절되고 이미 열려 있던 세션은 그대로 유지됩니다"><rect x="7" y="24" width="181" height="227" rx="16" fill="#fff1de"/><rect x="211" y="24" width="181" height="227" rx="16" fill="#e7efe4"/><text x="98" y="55" text-anchor="middle" font-size="18" font-weight="700" fill="#ba7f42">새 접속 요청</text><text x="302" y="55" text-anchor="middle" font-size="18" font-weight="700" fill="#6b8b70">쓰던 연결</text><circle cx="98" cy="130" r="40" fill="#f6dcc0"/><path class="handoff" d="M80 112l36 36m0-36-36 36" stroke="#c38a48" stroke-width="6"/><circle cx="302" cy="130" r="40" fill="#cfe2d4"/><path d="M282 130l14 14 26-30" fill="none" stroke="#5f8a6d" stroke-width="6"/><text x="98" y="205" text-anchor="middle" font-size="17" font-weight="700" fill="#b87d40">거절됨</text><text x="98" y="229" text-anchor="middle" font-size="14" fill="#a3835d">“자원 없음” 응답</text><text x="302" y="205" text-anchor="middle" font-size="17" font-weight="700" fill="#5f8a6d">그대로 유지</text><text x="302" y="229" text-anchor="middle" font-size="14" fill="#6b8b70">끊기지 않음</text></svg><p>새로 접속하거나 다시 쓰려는 <b>새 세션 요청만 “자원 없음”으로 거절</b>됩니다. <b>이미 열려 있던 연결은 끊기지 않습니다.</b></p><div class="arrow">→</div></section>

<template id=scx-6><section id="s6" class="scn"><div class="page"><h1>15. 특정 사이트 오류</h1><div class="flow">

<section class="panel"><div class="tag">① 원인</div><h2>접속 관리 장비가<br>처리 용량을 넘깁니다</h2><svg viewBox="0 0 400 280" role="img" aria-label="접속 관리 장비 하나가 처리 용량을 넘깁니다. 해당 장비를 지나는 기지국 전부가 영향을 받습니다"><rect x="6" y="14" width="388" height="252" rx="18" fill="#f0f4f8"/><text x="200" y="46" text-anchor="middle" font-size="15" fill="#7b8da0">접속 관리 장비 하나를 지나는 기지국들</text><circle class="overload" cx="300" cy="140" r="58" fill="#fbe3c8" opacity=".8"/><rect x="258" y="114" width="84" height="52" rx="10" fill="#fff1de" stroke="#d09552" stroke-width="3"/><text x="300" y="147" text-anchor="middle" font-size="17" font-weight="700" fill="#b87d40">접속 관리</text><g color="#749981"><use href="#bs" transform="translate(70 92) scale(.45)"/><use href="#bs" transform="translate(70 152) scale(.45)"/><use href="#bs" transform="translate(70 212) scale(.45)"/></g><path class="dash" d="M94 90l150 40M94 150h150M94 210l150-50" fill="none" stroke="#c88b45" stroke-width="3"/><text x="300" y="228" text-anchor="middle" font-size="16" font-weight="700" fill="#c0783d">처리 용량 초과</text><text x="200" y="256" text-anchor="middle" font-size="14" fill="#8d9ca7">다른 접속 관리 장비 쪽은 정상</text></svg><p>접속 관리 장비는 휴대폰의 접속·이동 요청을 모두 처리합니다. 한 대에 요청이 몰리거나 처리 능력이 떨어져 <b>용량을 넘기면</b>, 요청을 줄 세워 늦게 처리하거나 버립니다.</p><div class="arrow">→</div></section>
<section class="panel"><div class="tag">② 현상</div><h2>접속이 오래 걸리고<br>일부는 실패·끊김이 됩니다</h2><svg viewBox="0 0 400 280" role="img" aria-label="실패하지 않은 접속도 시간이 평소보다 크게 늘고, 코어 쪽 처리 시간도 늘어납니다"><rect x="6" y="14" width="388" height="252" rx="18" fill="#fff4e8"/><text x="200" y="46" text-anchor="middle" font-size="15" fill="#9d8469">접속에 걸리는 시간 (평소 = 1)</text><g font-size="15" fill="#8d7b66"><text x="24" y="98">접속</text><text x="24" y="168">코어 처리</text></g><rect x="100" y="72" width="60" height="18" rx="4" fill="#cfe2d4"/><rect x="100" y="94" width="192" height="18" rx="4" fill="#d18340"/><text x="300" y="109" font-size="16" font-weight="700" fill="#b57336">늘어남</text><rect x="100" y="142" width="60" height="18" rx="4" fill="#cfe2d4"/><rect x="100" y="164" width="138" height="18" rx="4" fill="#d18340"/><text x="246" y="179" font-size="16" font-weight="700" fill="#b57336">늘어남</text><g font-size="13"><rect x="100" y="208" width="14" height="12" rx="2" fill="#cfe2d4"/><text x="120" y="219" fill="#6b8b70">평소</text><rect x="170" y="208" width="14" height="12" rx="2" fill="#d18340"/><text x="190" y="219" fill="#b57336">과부하 때</text></g><text x="200" y="252" text-anchor="middle" font-size="14" fill="#8d9ca7">실패하지 않은 접속도 느려짐</text></svg><p>실패하지 않은 접속도 <b>시간이 평소보다 크게</b> 늘어납니다. 일부는 <b>접속에 실패</b>하고, 일부는 <b>연결된 뒤 끊깁니다.</b></p><div class="arrow">→</div></section>

<template id=scx-11><section id="s11" class="scn"><div class="page"><h1>#11 작업·설정 변경 뒤 특정 APN 만 접속 실패 (폐기)</h1><div class="flow">
<section class="panel"><div class="tag">① 원인</div><h2>한 MME 에 걸린 APN 설정이<br>잘못 바뀝니다</h2><svg viewBox="0 0 400 280" role="img" aria-label="한 MME 에 걸린 한 APN 의 설정이 작업이나 변경 뒤 잘못 바뀝니다"><rect x="6" y="14" width="388" height="252" rx="18" fill="#f0f4f8"/><text x="200" y="46" text-anchor="middle" font-size="15" fill="#7b8da0">작업·설정 변경 뒤</text><rect x="40" y="70" width="130" height="80" rx="12" fill="#fff1de" stroke="#cf9c67" stroke-width="2"/><text x="105" y="118" text-anchor="middle" font-size="22" font-weight="700" fill="#b87d40">MME</text><path d="M170 110h40" stroke="#bdcbd5" stroke-width="2" stroke-dasharray="4 5"/><rect x="212" y="66" width="160" height="40" rx="9" fill="#fbe3c8" stroke="#d09552" stroke-width="2"/><text x="268" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#b77b3e">해당 APN 설정</text><path class="handoff" d="M340 78l14 14m0-14-14 14" stroke="#c88b45" stroke-width="3"/><rect x="212" y="116" width="160" height="40" rx="9" fill="#e7efe4" stroke="#bacfc1" stroke-width="1"/><text x="268" y="142" text-anchor="middle" font-size="16" fill="#6b8b70">다른 APN 설정</text><path d="M340 136l5 6 10-12" fill="none" stroke="#6a9b7f" stroke-width="3"/><rect x="60" y="186" width="280" height="40" rx="10" fill="#fff5e6"/><text x="200" y="212" text-anchor="middle" font-size="16" font-weight="700" fill="#b77b3e">해당 APN 으로 오는 접속만 실패</text><text x="200" y="250" text-anchor="middle" font-size="14" fill="#8d9ca7">APN = 접속할 때 고르는 연결 이름</text></svg><p>작업이나 설정 변경 뒤, <b>한 MME 에 걸린 한 APN 설정</b>이 잘못 바뀝니다. 해당 MME 의 해당 APN 접속만 실패합니다.</p><div class="arrow">→</div></section>
<section class="panel"><div class="tag">② 현상</div><h2>같은 MME 의 다른 APN 도,<br>다른 MME 의 같은 APN 도 정상입니다</h2><svg viewBox="0 0 400 280" role="img" aria-label="문제 MME 와 해당 APN 이 겹치는 한 칸만 실패하고, 같은 MME 의 다른 APN 과 다른 MME 의 같은 APN 은 정상입니다"><rect x="6" y="14" width="388" height="252" rx="18" fill="#f0f4f8"/><g text-anchor="middle" font-size="16" font-weight="700" fill="#7b8da0"><text x="200" y="52">해당 APN</text><text x="320" y="52">다른 APN</text></g><g text-anchor="end" font-size="16" font-weight="700" fill="#7b8da0"><text x="134" y="114">해당 MME</text><text x="134" y="204">다른 MME</text></g><rect x="148" y="68" width="104" height="72" rx="12" fill="#f6dcc0" stroke="#cf9c67" stroke-width="2"/><use href="#nx" x="200" y="104"/><rect x="268" y="68" width="104" height="72" rx="12" fill="#e0ece2"/><use href="#nok" x="320" y="104"/><rect x="148" y="158" width="104" height="72" rx="12" fill="#e0ece2"/><use href="#nok" x="200" y="194"/><rect x="268" y="158" width="104" height="72" rx="12" fill="#e0ece2"/><use href="#nok" x="320" y="194"/><text x="200" y="256" text-anchor="middle" font-size="14" fill="#8d9ca7">겹치는 한 칸만 실패 → 해당 MME 에 건 설정</text></svg><p>실패는 <b>해당 MME × 해당 APN</b> 한 칸에만 있습니다. 이 두 비교가 <b>해당 MME 에 건 설정</b> 문제라는 단서입니다.</p><div class="arrow">→</div></section>
<section class="panel"><div class="tag">③ 결과</div><h2>접속 성공률이 시작 순간<br>계단처럼 떨어집니다</h2><svg viewBox="0 0 400 280" role="img" aria-label="변경은 한순간에 일어나므로 접속 성공률이 서서히가 아니라 시작 시각에 계단으로 떨어지고 10분 동안 그대로 머뭅니다"><rect x="6" y="14" width="388" height="252" rx="18" fill="#fff4e8"/><text x="44" y="50" font-size="14" fill="#9d8469">해당 APN 접속 성공률</text><path d="M40 60v140h326" fill="none" stroke="#d1c7bb" stroke-width="2"/><path d="M100 70v130M300 70v130" stroke="#e8dccd" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M44 80h56v100h200V80h62" fill="none" stroke="#d18340" stroke-width="5" stroke-linejoin="round"/><g text-anchor="middle" font-weight="700" fill="#b57336"><text x="200" y="168" font-size="15">10분 · 실패 약 85%</text></g><g text-anchor="middle" font-size="13" fill="#9d8469"><text x="70" y="72">평소</text><text x="100" y="216">변경 순간</text></g><text x="200" y="244" text-anchor="middle" font-size="14" fill="#8d9ca7">작업 기록은 XDR 에 없어 「의심」으로 표시</text><text x="366" y="216" text-anchor="end" font-size="12" fill="#85949b">시간 →</text></svg><p>변경은 한순간에 일어나므로 성공률이 <b>서서히가 아니라 계단처럼</b> 떨어집니다. 작업 기록이 없으니 <b>변경을 확정하지 않고 「의심」</b>으로 알립니다.</p></section></div>

<section class="detail users"><h3>이용자에게 어떻게 보일까?</h3><div class="experiences"><article><svg viewBox="0 0 180 150" role="img" aria-label="해당 APN 연결이 안 됨"><rect x="51" y="9" width="78" height="125" rx="13" fill="white" stroke="#d09655" stroke-width="3"/><path d="M78 18h24" stroke="#d09655" stroke-width="3"/><rect x="58" y="32" width="64" height="81" rx="5" fill="#fff1e0"/><rect x="64" y="46" width="52" height="22" rx="4" fill="#f1d8b9"/><text x="90" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="#b7854c">APN</text><path class="handoff" d="M82 80l16 16m0-16-16 16" stroke="#c88a45" stroke-width="3"/></svg><strong>해당 APN 만 연결 안 됨</strong><p>해당 APN 을 쓰는<br>접속이 실패합니다.</p></article><article><svg viewBox="0 0 180 150" role="img" aria-label="다른 APN 은 정상"><rect x="51" y="9" width="78" height="125" rx="13" fill="white" stroke="#739b86" stroke-width="3"/><path d="M78 18h24" stroke="#739b86" stroke-width="3"/><rect x="58" y="32" width="64" height="81" rx="5" fill="#eef6ef"/><rect x="64" y="46" width="52" height="22" rx="4" fill="#cfe2d4"/><text x="90" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#5f8a6d">다른 APN</text><circle cx="90" cy="90" r="13" fill="#739b86"/><path d="M83 90l5 5 9-10" stroke="white" stroke-width="3" fill="none"/></svg><strong>다른 APN 은 그대로</strong><p>같은 장비를 거쳐도<br>다른 APN 은 정상입니다.</p></article><article><svg viewBox="0 0 180 150" role="img" aria-label="다른 MME 를 거치면 정상"><rect x="51" y="9" width="78" height="125" rx="13" fill="white" stroke="#739b86" stroke-width="3"/><path d="M78 18h24" stroke="#739b86" stroke-width="3"/><rect x="58" y="32" width="64" height="81" rx="5" fill="#eef6ef"/><rect x="64" y="46" width="52" height="22" rx="4" fill="#cfe2d4"/><text x="90" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#5f8a6d">다른 MME</text><circle cx="90" cy="90" r="13" fill="#739b86"/><path d="M83 90l5 5 9-10" stroke="white" stroke-width="3" fill="none"/></svg><strong>다른 MME 쪽은 정상</strong><p>같은 APN 이라도<br>다른 MME 면 붙습니다.</p></article></div></section></div></div></section></template>
<template id=scx-12><section id="s12" class="scn"><div class="page"><h1>7. 데이터 정상·음성 통화 불가</h1><div class="flow">
<section class="panel"><div class="tag">① 원인</div><h2>한 외부망 관문(PGW)에서<br>음성 서비스 연결만 거절됩니다</h2><svg viewBox="0 0 400 280" role="img" aria-label="한 외부망 관문 쪽에서 IMS 음성망으로 가는 음성 통화용 연결만 자원 부족으로 거절되고 인터넷 연결은 정상입니다"><rect x="6" y="14" width="388" height="252" rx="18" fill="#f0f4f8"/><rect x="40" y="96" width="110" height="80" rx="12" fill="#fff1de" stroke="#cf9c67" stroke-width="2"/><text x="95" y="143" text-anchor="middle" font-size="17" font-weight="700" fill="#b87d40">외부망 관문</text><path d="M150 112q50-30 104-30" fill="none" stroke="#7da389" stroke-width="4" stroke-linecap="round"/><path d="M150 160q50 30 104 30" fill="none" stroke="#e6a567" stroke-width="4" stroke-linecap="round"/><rect x="258" y="60" width="120" height="44" rx="10" fill="#e7efe4"/><text x="318" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#6b8b70">인터넷</text><rect x="258" y="168" width="120" height="44" rx="10" fill="#fbe3c8" stroke="#d09552" stroke-width="2"/><text x="318" y="196" text-anchor="middle" font-size="16" font-weight="700" fill="#b77b3e">IMS 음성망</text><use href="#nok" x="210" y="72"/><g class="handoff"><use href="#nx" x="210" y="200"/></g><text x="95" y="56" text-anchor="middle" font-size="15" fill="#7b8da0">한 외부망 관문 쪽 문제</text><text x="200" y="248" text-anchor="middle" font-size="14" fill="#8d9ca7">거절 이유: 자원 부족</text></svg><p>휴대폰 전화는 데이터와 별도로 <b>음성 전용 연결</b>을 하나 더 엽니다. 이 연결은 외부망 관문을 지나 IMS 음성망으로 갑니다. 외부망 관문 한 대에서 음성용 연결에 쓸 자원이 바닥나, 인터넷 연결은 되는데 <b>음성용 연결만 거절됩니다</b>.</p><div class="arrow">→</div></section>
<section class="panel"><div class="tag">② 현상</div><h2>데이터 접속은 성공하고<br>음성 통화용 연결만 실패합니다</h2><svg viewBox="0 0 400 280" role="img" aria-label="데이터 접속은 평소 그대로이고 음성 통화용 연결의 성공률만 떨어집니다"><rect x="7" y="24" width="181" height="227" rx="16" fill="#e7efe4"/><rect x="211" y="24" width="181" height="227" rx="16" fill="#fff1de"/><text x="98" y="55" text-anchor="middle" font-size="18" font-weight="700" fill="#6b8b70">접속·데이터</text><text x="302" y="55" text-anchor="middle" font-size="18" font-weight="700" fill="#ba7f42">음성 서비스 접속</text><circle cx="98" cy="130" r="40" fill="#cfe2d4"/><path d="M78 130l14 14 26-30" fill="none" stroke="#5f8a6d" stroke-width="6"/><circle cx="302" cy="130" r="40" fill="#f6dcc0"/><path class="handoff" d="M284 112l36 36m0-36-36 36" stroke="#c38a48" stroke-width="6"/><text x="98" y="205" text-anchor="middle" font-size="17" font-weight="700" fill="#5f8a6d">평소 그대로</text><text x="98" y="229" text-anchor="middle" font-size="14" fill="#6b8b70">접속·절단 안 움직임</text><text x="302" y="205" text-anchor="middle" font-size="17" font-weight="700" fill="#b87d40">음성 서비스만 실패</text><text x="302" y="229" text-anchor="middle" font-size="14" fill="#a3835d">음성 서비스 성공률만 하락</text></svg><p><b>데이터 접속은 성공한 채 이어지고</b> 인터넷도 평소처럼 됩니다. <b>음성 통화용 연결의 성공률만</b> 떨어집니다.</p><div class="arrow">→</div></section>

<template id=scx-13><section id="s13" class="scn"><div class="page"><h1>23. 5G 접속 불량</h1><div class="flow">
<section class="panel"><div class="tag">① 원인</div><h2>몇몇 기지국에서 5G 쪽<br>연결이 서지 않습니다</h2><svg viewBox="0 0 400 280" role="img" aria-label="서로 붙은 기지국 몇 곳에서 5G 단말이 LTE 기지국에는 붙지만 5G 쪽 연결이 성립하지 않습니다"><rect x="6" y="14" width="388" height="252" rx="18" fill="#f0f4f8"/><text x="200" y="46" text-anchor="middle" font-size="15" fill="#7b8da0">서로 붙은 기지국 몇 곳</text><g color="#749981"><use href="#bs" transform="translate(100 150) scale(.85)"/></g><text x="100" y="214" text-anchor="middle" font-size="15" fill="#789580">LTE 기지국</text><g color="#c68b48"><use href="#phone" x="300" y="150"/></g><text x="300" y="196" text-anchor="middle" font-size="14" fill="#b87b46">5G 단말</text><path d="M132 150h140" stroke="#7da389" stroke-width="4" stroke-linecap="round"/><text x="200" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#5f8a6d">LTE 연결 ✓</text><path d="M132 100q70-30 140 0" fill="none" stroke="#e6a567" stroke-width="4" stroke-dasharray="6 7" stroke-linecap="round"/><g class="handoff"><path d="M190 70l20 20m0-20-20 20" stroke="#c88b45" stroke-width="5"/></g><text x="262" y="72" text-anchor="start" font-size="15" font-weight="700" fill="#c0783d">5G 연결 ✗</text><text x="200" y="246" text-anchor="middle" font-size="14" fill="#8d9ca7">4G 연결 뒤 5G 연결 시도에서 실패</text></svg><p>5G 휴대폰은 4G에 먼저 연결한 뒤 5G 연결을 시도합니다. 그런데 몇몇 기지국에서 <b>5G 연결에 실패</b>합니다. 통화·데이터는 4G로 계속됩니다.</p><div class="arrow">→</div></section>
<section class="panel"><div class="tag">② 현상</div><h2>통화·데이터는 잘 되는데<br>5G 로만 안 붙습니다</h2><svg viewBox="0 0 400 280" role="img" aria-label="호는 성공하고 끊기지 않으며 소통률과 절단률은 그대로입니다. 5G 연결률만 떨어집니다"><rect x="7" y="24" width="181" height="227" rx="16" fill="#e7efe4"/><rect x="211" y="24" width="181" height="227" rx="16" fill="#fff1de"/><text x="98" y="55" text-anchor="middle" font-size="18" font-weight="700" fill="#6b8b70">통화·데이터</text><text x="302" y="55" text-anchor="middle" font-size="18" font-weight="700" fill="#ba7f42">5G 연결</text><circle cx="98" cy="130" r="40" fill="#cfe2d4"/><path d="M78 130l14 14 26-30" fill="none" stroke="#5f8a6d" stroke-width="6"/><circle cx="302" cy="130" r="40" fill="#f6dcc0"/><path class="handoff" d="M284 112l36 36m0-36-36 36" stroke="#c38a48" stroke-width="6"/><text x="98" y="205" text-anchor="middle" font-size="17" font-weight="700" fill="#5f8a6d">잘 됨</text><text x="98" y="229" text-anchor="middle" font-size="14" fill="#6b8b70">소통률·절단률 그대로</text><text x="302" y="205" text-anchor="middle" font-size="17" font-weight="700" fill="#b87d40">안 붙음</text><text x="302" y="229" text-anchor="middle" font-size="14" fill="#a3835d">5G 가능 기지국에서만</text></svg><p>호는 <b>성공하고 끊기지도 않습니다</b>. 5G 단말이 <b>5G 가능 기지국</b>에서 건 호만 5G 연결 기록이 빠집니다.</p><div class="arrow">→</div></section>
<section class="panel"><div class="tag">③ 결과</div><h2>5G 휴대폰이<br>5G로 붙지 않습니다</h2><svg viewBox="0 0 400 280" role="img" aria-label="5G 휴대폰의 5G 연결 비율이 장애 중 떨어집니다. 접속 성공과 끊김은 평소 그대로입니다"><rect x="6" y="14" width="388" height="252" rx="18" fill="#fff4e8"/><text x="107" y="44" text-anchor="middle" font-size="14" fill="#9d8469">5G로 붙는 비율</text><path d="M32 196h150" stroke="#d1c7bb" stroke-width="2"/><rect x="50" y="86" width="44" height="110" rx="6" fill="#c9d3d9"/><rect x="120" y="161" width="44" height="35" rx="6" fill="#d18340"/><g text-anchor="middle" font-size="13" fill="#85949b"><text x="72" y="214">평소</text><text x="142" y="214">장애 중</text></g><text x="107" y="248" text-anchor="middle" font-size="15" font-weight="700" fill="#b57336">5G 안 붙음</text><text x="293" y="44" text-anchor="middle" font-size="14" fill="#9d8469">접속 성공·끊김</text><path d="M218 196h150" stroke="#d1c7bb" stroke-width="2"/><rect x="236" y="106" width="44" height="90" rx="6" fill="#c9d3d9"/><rect x="306" y="106" width="44" height="90" rx="6" fill="#739981"/><g text-anchor="middle" font-size="13" fill="#85949b"><text x="258" y="214">평소</text><text x="328" y="214">장애 중</text></g><text x="293" y="248" text-anchor="middle" font-size="15" font-weight="700" fill="#5f8a70">그대로</text></svg><p>5G 휴대폰인데 <b>5G로 붙지 않고 4G로만</b> 씁니다. 전화와 데이터는 <b>그대로 연결되고 끊기지도 않습니다.</b></p></section></div>

<template id=scx-16><section id="s16" class="scn"><div class="page"><h1>12. 5G 표시 중 속도 저하</h1><div class="flow">
<section class="panel"><div class="tag">① 원인</div><h2>5G 셀에 사람이 몰려<br>5G 쪽이 꽉 찼습니다</h2><svg viewBox="0 0 400 280" role="img" aria-label="5G 셀이 붐벼 5G 쪽 데이터만 기다립니다. 연결 관리를 맡은 4G 기지국과 4G 이용자는 평소대로 씁니다"><rect x="6" y="14" width="388" height="252" rx="18" fill="#f0f4f8"/><rect x="50" y="34" width="120" height="62" rx="10" fill="white" stroke="#d08a45" stroke-width="2.5"/><text x="110" y="57" text-anchor="middle" font-size="15" font-weight="700" fill="#669085">4G 기지국</text><rect x="66" y="68" width="88" height="13" rx="6.5" fill="#efe3d4"/><rect x="66" y="68" width="36" height="13" rx="6.5" fill="#9bbfb3"/><text x="110" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#669085">여유</text><rect x="230" y="34" width="120" height="62" rx="10" fill="white" stroke="#d79a5c" stroke-width="2"/><text x="290" y="57" text-anchor="middle" font-size="15" font-weight="700" fill="#bc8348">5G 기지국</text><text x="290" y="82" text-anchor="middle" font-size="13" fill="#8a7a6a">4G 거쳐 연결 관리</text><rect x="246" y="100" width="88" height="10" rx="5" fill="#efe3d4"/><rect x="246" y="100" width="84" height="10" rx="5" fill="#d08a45"><animate attributeName="opacity" values="1;.4;1" dur="1.2s" repeatCount="indefinite"/></rect><text x="350" y="110" font-size="13" font-weight="700" fill="#b9793f">꽉 참</text><g fill="none" stroke-linecap="round" stroke-width="3"><path d="M110 128L96 196M110 128L124 196M100 176h20" stroke="#749a91"/><path d="M290 128L276 196M290 128L304 196M280 176h20" stroke="#d79a5c"/></g><circle cx="110" cy="126" r="5" fill="#749a91"/><circle cx="290" cy="126" r="5" fill="#d79a5c"/><path d="M282 126H118" stroke="#d08a45" stroke-width="3" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;24" dur="2.4s" repeatCount="indefinite"/></path><text x="200" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#b9793f">연결 관리</text><path d="M118 150L150 172" stroke="#749a91" stroke-width="3" stroke-dasharray="5 5"><animate attributeName="stroke-dashoffset" values="20;0" dur=".6s" repeatCount="indefinite"/></path><path d="M298 150L330 172" stroke="#d79a5c" stroke-width="3" stroke-dasharray="2 9" opacity=".6"/><rect x="150" y="164" width="24" height="40" rx="5" fill="white" stroke="#749a91" stroke-width="2.5"/><path d="M155 184l5 5 9-10" stroke="#739b86" stroke-width="2.5" fill="none"/><rect x="330" y="164" width="24" height="40" rx="5" fill="#fff1e0" stroke="#d08a45" stroke-width="2.5"/><path d="M342 177a7 7 0 1 1-7 7" stroke="#d08a45" stroke-width="2.5" fill="none"><animateTransform attributeName="transform" type="rotate" values="0 342 184;360 342 184" dur="1.1s" repeatCount="indefinite"/></path><g fill="#c9a27a"><circle cx="32" cy="150" r="6"/><path d="M24 172v-6a8 8 0 0 1 16 0v6Z"/><circle cx="52" cy="146" r="6"/><path d="M44 168v-6a8 8 0 0 1 16 0v6Z"/><circle cx="72" cy="152" r="6"/><path d="M64 174v-6a8 8 0 0 1 16 0v6Z"/><circle cx="40" cy="176" r="6"/><path d="M32 198v-6a8 8 0 0 1 16 0v6Z"/><circle cx="62" cy="178" r="6"/><path d="M54 200v-6a8 8 0 0 1 16 0v6Z"/><circle cx="82" cy="180" r="6"/><path d="M74 202v-6a8 8 0 0 1 16 0v6Z"/></g><text x="58" y="222" text-anchor="middle" font-size="13" fill="#9a7a5a">사람 몰림</text><text x="200" y="246" text-anchor="middle" font-size="15" fill="#8a6a45">5G 셀이 붐벼 5G 데이터가 기다림</text></svg><p>지금의 5G는 <b>4G 기지국을 거쳐 연결을 관리</b>합니다. 4G 기지국은 여유가 있지만 <b>5G 셀에 사람이 몰려 꽉 차면</b>, 5G로 받는 데이터가 차례를 기다리게 됩니다. 4G 이용자는 4G 셀에서 처리되어 평소대로 씁니다. 이동하지 않아도 생깁니다.</p><div class="arrow">→</div></section>

<template id=scx-28><section id="s28" class="scn"><div class="page"><h1>#28 앱·웹 주소를 못 찾음 (DNS 접속 실패) (폐기)</h1><div class="flow">
<section class="panel"><div class="tag">① 원인</div><h2>주소를 찾아 주는 장치(DNS)가<br>켜졌다 꺼졌다 나빠집니다</h2><svg viewBox="0 0 400 280" role="img" aria-label="휴대폰이 앱 주소를 묻는 주소 안내 장치(DNS)가 3분 나쁨과 3분 정상을 반복합니다"><rect x="6" y="14" width="388" height="252" rx="18" fill="#f0f4f8"/><rect x="22" y="44" width="150" height="34" rx="17" fill="#fff"/><text x="97" y="66" text-anchor="middle" font-size="15" fill="#7b8da0">이 앱 주소는 어디?</text><g color="#869cad"><use href="#phone" x="70" y="118"/></g><path class="dash" d="M95 118h150" stroke="#c4a27a" stroke-width="4" fill="none"/><circle class="onoff28" cx="300" cy="118" r="54" fill="#f6b76a" opacity=".25"/><rect x="255" y="88" width="90" height="60" rx="10" fill="#fff0dd" stroke="#d7a26a" stroke-width="2"/><text x="300" y="114" text-anchor="middle" font-size="17" font-weight="700" fill="#bb8246">주소 안내</text><text x="300" y="135" text-anchor="middle" font-size="14" fill="#bb8246">(DNS)</text><text x="200" y="192" text-anchor="middle" font-size="15" fill="#7b8da0">3분 나쁨 · 3분 정상을 반복</text><g><rect x="35" y="202" width="53" height="22" rx="4" fill="#e7a868"/><rect x="90" y="202" width="53" height="22" rx="4" fill="#a9cbb5"/><rect x="145" y="202" width="53" height="22" rx="4" fill="#e7a868"/><rect x="200" y="202" width="53" height="22" rx="4" fill="#a9cbb5"/><rect x="255" y="202" width="53" height="22" rx="4" fill="#e7a868"/><rect x="310" y="202" width="53" height="22" rx="4" fill="#a9cbb5"/></g><g text-anchor="middle" font-size="12" fill="#fff" font-weight="700"><text x="61" y="217">나쁨</text><text x="171" y="217">나쁨</text><text x="281" y="217">나쁨</text></g><text x="200" y="250" text-anchor="middle" font-size="14" fill="#8d9ca7">전국 · 결제 외 여러 앱·웹 주소</text></svg><p>앱·웹을 열 때 먼저 묻는 <b>주소 안내 장치(DNS)</b>가 <b>전국에서, 결제가 아닌 여러 주소</b>에 대해 <b>3분 나빠졌다 3분 멀쩡하기를 반복</b>합니다.</p><div class="arrow">→</div></section>
<section class="panel"><div class="tag">② 현상</div><h2>나쁜 동안 주소 묻기<br>10번 중 7번이 실패합니다</h2><svg viewBox="0 0 400 280" role="img" aria-label="나쁜 동안 주소 묻기 10번 중 7번이 실패합니다. 실패는 오류 응답과 응답 없음 두 가지이고 응답이 없으면 다시 묻기가 늘어납니다"><rect x="6" y="14" width="388" height="252" rx="18" fill="#f0f4f8"/><text x="200" y="46" text-anchor="middle" font-size="15" fill="#7b8da0">나쁜 동안 주소 묻기 10번</text><use href="#nx" x="70" y="80"/><use href="#nx" x="135" y="80"/><use href="#nok" x="200" y="80"/><use href="#nx" x="265" y="80"/><use href="#nx" x="330" y="80"/><use href="#nx" x="70" y="128"/><use href="#nok" x="135" y="128"/><use href="#nx" x="200" y="128"/><use href="#nx" x="265" y="128"/><use href="#nok" x="330" y="128"/><rect x="30" y="164" width="162" height="62" rx="10" fill="#fff5e6" stroke="#e8c79f"/><text x="111" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#b77b3e">오류 응답</text><text x="111" y="212" text-anchor="middle" font-size="13" fill="#a48560">"찾을 수 없음"이라고 답함</text><rect x="208" y="164" width="162" height="62" rx="10" fill="#fff5e6" stroke="#e8c79f"/><text x="289" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#b77b3e">응답 없음</text><text x="289" y="212" text-anchor="middle" font-size="13" fill="#a48560">기다리다 다시 묻기 ↑</text><text x="200" y="252" text-anchor="middle" font-size="14" fill="#8d9ca7">실패하지 않은 질문도 답이 늦게 옴</text></svg><p>나쁜 동안 <b>주소 묻기의 70%가 실패</b>합니다. <b>오류로 답하거나, 아예 답이 없어</b> 휴대폰이 다시 묻습니다. 성공한 질문도 늦어집니다.</p><div class="arrow">→</div></section>
<section class="panel"><div class="tag">③ 결과 · 두 갈래</div><h2>전국 간헐 실패와<br>한 서비스 「없는 주소」</h2><svg viewBox="0 0 400 280" role="img" aria-label="첫째 갈래는 전국 여러 앱과 웹 주소가 켜졌다 꺼졌다 실패하는 우리 쪽 DNS 문제이고, 둘째 갈래는 결제·동영상이 아닌 한 서비스 주소만 없는 주소로 바로 답이 오는 해당 서비스 쪽 문제입니다"><rect x="6" y="14" width="388" height="252" rx="18" fill="#fff4e8"/><rect x="20" y="26" width="360" height="112" rx="12" fill="#fff" stroke="#e8c79f"/><text x="36" y="52" font-size="15" font-weight="700" fill="#b57336">첫째 갈래 · 전국 여러 앱·웹</text><path d="M36 120h28V80h28v40h28V80h28v40h28" fill="none" stroke="#d18340" stroke-width="4" stroke-linejoin="round"/><g font-size="13" fill="#9d8469"><text x="200" y="80">켜졌다 꺼졌다 반복</text><text x="200" y="102">응답 없음·다시 묻기↑</text></g><text x="200" y="126" font-size="14" font-weight="700" fill="#b57336">→ 우리 쪽 DNS 문제</text><rect x="20" y="146" width="360" height="112" rx="12" fill="#fff" stroke="#e8c79f"/><text x="36" y="172" font-size="15" font-weight="700" fill="#b57336">둘째 갈래 · 결제 외 한 서비스</text><g text-anchor="middle" font-size="12"><rect x="36" y="188" width="44" height="44" rx="9" fill="#fbe3c8" stroke="#d09552" stroke-width="2"/><text x="58" y="206" font-size="16" font-weight="700" fill="#c88b45">?</text><text x="58" y="225" fill="#b77b3e">SNS</text><rect x="88" y="188" width="44" height="44" rx="9" fill="#e0ece2"/><text x="110" y="215" fill="#6b8b70">게임</text><rect x="140" y="188" width="44" height="44" rx="9" fill="#e0ece2"/><text x="162" y="215" fill="#6b8b70">웹</text></g><g font-size="13" fill="#9d8469"><text x="200" y="198">해당 주소만 「없는 주소」</text><text x="200" y="220">답은 빠름·다시 안 물음</text></g><text x="200" y="244" font-size="14" font-weight="700" fill="#b57336">→ 해당 서비스 쪽 문제</text></svg><p>첫째 갈래는 3분마다 오르내려도 <b>원인이 하나</b>(우리 쪽 DNS)입니다. 둘째 갈래는 결제·동영상이 아닌 <b>한 서비스(SNS·게임 등) 주소만</b> 「없는 주소」로 <b>바로 답이 오고</b>, 원인은 <b>해당 서비스 쪽</b>입니다.</p></section></div>
<div class="lower"><section class="detail network"><h3>어디서 문제일까?</h3><svg viewBox="0 0 540 235" role="img" aria-label="휴대폰에서 기지국과 코어 장비까지 통신망은 정상이고 망 밖의 주소 안내 장치(DNS)가 전국에서 간헐적으로 실패합니다"><rect x="10" y="107" width="30" height="54" rx="7" fill="white" stroke="#869cad" stroke-width="3"/><path d="M20 114h10" stroke="#869cad" stroke-width="2" stroke-linecap="round"/><rect x="14" y="119" width="22" height="33" rx="3" fill="#eef3f6"/><circle cx="25" cy="156" r="2" fill="#869cad"/><text x="25" y="186" text-anchor="middle" font-size="15" fill="#8196a5">휴대폰</text><path d="M46 134h60M134 134h66M258 134h32M348 134h52" stroke="#c4d3dc" stroke-width="2"/><path d="M128 112V40h101M229 56v56" fill="none" stroke="#bdcbd5" stroke-width="2" stroke-dasharray="4 5"/><g color="#749981"><use href="#bs" transform="translate(118 134) scale(0.55)"/></g><text x="118" y="182" text-anchor="middle" font-size="15" fill="#789580">기지국</text><rect x="200" y="112" width="58" height="44" rx="8" fill="#e7efe9" stroke="#bacfc1" stroke-width="1"/><text x="229" y="140" text-anchor="middle" font-size="17" fill="#789580">SGW</text><rect x="290" y="112" width="58" height="44" rx="8" fill="#e7efe9" stroke="#bacfc1" stroke-width="1"/><text x="319" y="140" text-anchor="middle" font-size="17" fill="#789580">PGW</text><rect x="200" y="20" width="58" height="36" rx="8" fill="#edf2f5" stroke="#bdcdd7" stroke-width="1"/><text x="229" y="44" text-anchor="middle" font-size="17" fill="#8196a5">MME</text><path d="M372 30v175" stroke="#b9c6d0" stroke-width="2" stroke-dasharray="6 6"/><text x="372" y="22" text-anchor="middle" font-size="13" fill="#8c9aa8">통신망 ｜ 망 밖</text><rect class="onoff28" x="393" y="97" width="142" height="74" rx="13" fill="#f6b76a" opacity=".3"/><rect x="400" y="104" width="128" height="60" rx="8" fill="#fff0dd" stroke="#d7a26a" stroke-width="2"/><text x="464" y="131" text-anchor="middle" font-size="17" font-weight="700" fill="#bb8246">DNS · 주소 안내</text><text x="464" y="150" text-anchor="middle" font-size="13" fill="#bb8246">켜졌다 꺼졌다 실패</text><path class="dash slow" d="M348 134h52" stroke="#c87530" stroke-width="4"/><rect x="420" y="178" width="88" height="34" rx="7" fill="#edf2f5" stroke="#bdcdd7"/><text x="464" y="200" text-anchor="middle" font-size="13" fill="#8196a5">앱·웹 서버 · 못 찾음</text><path d="M464 164v14" stroke="#bdcbd5" stroke-width="2" stroke-dasharray="3 3"/><text x="200" y="192" text-anchor="middle" font-size="15" fill="#789580">통신망 정상</text><text x="270" y="224" text-anchor="middle" font-size="15" fill="#8c8470">통신망 연결은 정상 · 주소 찾기(DNS)만 간헐적으로 실패 · 전국 공통</text></svg></section>
<section class="detail users"><h3>이용자에게 어떻게 보일까?</h3><div class="experiences"><article><svg viewBox="0 0 180 150" role="img" aria-label="앱·웹이 안 열림"><rect x="51" y="9" width="78" height="125" rx="13" fill="white" stroke="#d09655" stroke-width="3"/><path d="M78 18h24" stroke="#d09655" stroke-width="3"/><rect x="58" y="32" width="64" height="81" rx="5" fill="#f4f5ed"/><text x="90" y="80" text-anchor="middle" font-size="38" font-weight="700" fill="#c88a45">?</text><text x="90" y="103" text-anchor="middle" font-size="12" fill="#c88a45">주소 못 찾음</text></svg><strong>앱·웹이 안 열림</strong><p>화면이 뜨지 않고<br>오류가 납니다.</p></article><article><svg viewBox="0 0 180 150" role="img" aria-label="다시 누르면 열리기도 함"><rect x="51" y="9" width="78" height="125" rx="13" fill="white" stroke="#d09655" stroke-width="3"/><path d="M78 18h24" stroke="#d09655" stroke-width="3"/><rect x="58" y="32" width="64" height="81" rx="5" fill="#f4f5ed"/><g transform="translate(90 70)"><g class="buffer"><path d="M-16 0a16 16 0 1 1 5 11.6" fill="none" stroke="#c88a45" stroke-width="4" stroke-linecap="round"/><path d="M-18-6l2 7 7-3" fill="none" stroke="#c88a45" stroke-width="3"/></g></g><text x="90" y="104" text-anchor="middle" font-size="12" fill="#c88a45">다시 시도</text></svg><strong>다시 누르면 열리기도</strong><p>정상 구간에 걸리면<br>열리기도 합니다.</p></article><article><svg viewBox="0 0 180 150" role="img" aria-label="열려도 느림"><rect x="51" y="9" width="78" height="125" rx="13" fill="white" stroke="#d09655" stroke-width="3"/><path d="M78 18h24" stroke="#d09655" stroke-width="3"/><rect x="58" y="32" width="64" height="81" rx="5" fill="#fff1e0"/><rect x="66" y="44" width="48" height="39" rx="4" fill="#f1d8b9"/><circle cx="120" cy="106" r="17" fill="#fff9ef" stroke="#e4bc8d" stroke-width="2"/><g class="loading"><path d="M120 94a12 12 0 0 1 12 12" fill="none" stroke="#ce8642" stroke-width="3" stroke-linecap="round"/></g></svg><strong>열려도 느림</strong><p>열리더라도<br>평소보다 늦게 뜹니다.</p></article></div></section></div></div></section></template>
<template id=scx-29><section id="s29" class="scn"><div class="page"><h1>17. 특정 서비스망 접속 불가</h1><div class="flow">
<section class="panel"><div class="tag">① 원인</div><h2>데이터용 접속 이름<br>하나의 설정이 잘못됩니다</h2><svg viewBox="0 0 400 280" role="img" aria-label="데이터 연결 때 고르는 입구 이름 세 개 중 회사 전용망 하나의 설정이 잘못되었습니다"><rect x="6" y="14" width="388" height="252" rx="18" fill="#f0f4f8"/><text x="200" y="46" text-anchor="middle" font-size="15" fill="#7b8da0">데이터 연결 때 고르는 '입구 이름'</text><g fill="#fff" stroke-width="3"><rect x="38" y="68" width="96" height="120" rx="10" stroke="#7e9d8b"/><rect x="152" y="68" width="96" height="120" rx="10" stroke="#d09552"/><rect x="266" y="68" width="96" height="120" rx="10" stroke="#7e9d8b"/></g><g fill="#7e9d8b"><circle cx="118" cy="130" r="5"/><circle cx="346" cy="130" r="5"/></g><circle cx="232" cy="130" r="5" fill="#d09552"/><use href="#nok" x="86" y="112"/><use href="#nok" x="314" y="112"/><g class="handoff"><use href="#nx" x="200" y="112"/></g><g text-anchor="middle" font-size="15"><text x="86" y="210" fill="#6b8b70">인터넷용</text><text x="200" y="210" fill="#be8648" font-weight="700">회사 전용망</text><text x="314" y="210" fill="#6b8b70">특정 서비스망</text></g><rect x="150" y="224" width="100" height="28" rx="14" fill="#fff5e6" stroke="#e2b27a"/><text x="200" y="243" text-anchor="middle" font-size="14" font-weight="700" fill="#b77b3e">설정 오류</text></svg><p>회사 전용망·특정 서비스망처럼 휴대폰이 고르는 데이터용 입구 이름 가운데 하나만 <b>망의 가입자 설정이 잘못 바뀌어</b>, 해당 이름으로 오는 연결을 망이 알아보지 못합니다. 음성 통화용은 아닙니다.</p><div class="arrow">→</div></section>

<template id=scx-32><section id="s32" class="scn"><div class="page"><h1>18. 케이블 단선 지역 불통</h1><div class="flow">

<section class="panel"><div class="tag">③ 결과</div><h2>함께 복구되고, 직후 2분은<br>다시 접속하려는 사람이 몰립니다</h2><svg viewBox="0 0 400 280" role="img" aria-label="해당 지역 접속 시도가 15분 동안 0이 되었다가 함께 복구되고, 복구 직후 2분은 평소의 약 1.8배로 몰린 뒤 평소로 돌아옵니다"><rect x="6" y="14" width="388" height="252" rx="18" fill="#fff4e8"/><text x="44" y="50" font-size="14" fill="#9d8469">해당 지역 접속 시도</text><path d="M40 60v140h326" fill="none" stroke="#d1c7bb" stroke-width="2"/><path d="M40 136h326" stroke="#e8dccd" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M44 136h66v58h160V82h36v54h56" fill="none" stroke="#d18340" stroke-width="5" stroke-linejoin="round"/><g text-anchor="middle" font-weight="700"><text x="190" y="184" font-size="15" fill="#b57336">15분 · 접속 0</text><text x="288" y="72" font-size="15" fill="#b57336">약 1.8배 · 2분</text></g><g text-anchor="middle" font-size="13" fill="#9d8469"><text x="77" y="128">평소</text><text x="110" y="216">동시 정지</text><text x="270" y="216">동시 복구</text></g><text x="366" y="250" text-anchor="end" font-size="12" fill="#85949b">시간 →</text></svg><p><b>같은 순간에 함께 복구</b>되고, 직후 <b>2분은 다시 접속하려는 사람이 평소의 약 1.8배로 몰렸다가</b> 평소로 돌아옵니다.</p></section></div>

<template id=scx-33><section id="s33" class="scn"><div class="page"><h1>#33 특정 서비스 접속 거절 (폐기)</h1><p class="lead"><b>21번(CDN 열화)과 다른 점</b> — 느려지거나 다시 보내기가 늘지 않습니다. 서버가 <b>바로 거절하거나, 연결 직후 바로 끊습니다.</b> 통신망과 주소 찾기(DNS)는 정상입니다.</p><div class="flow">
<section class="panel"><div class="tag">① 원인</div><h2>결제·동영상이 아닌 한 서비스의 서버가<br>접속을 거절합니다</h2><svg viewBox="0 0 400 280" role="img" aria-label="휴대폰에서 기지국과 주소 찾기(DNS)까지는 정상이고, SNS나 게임 같은 한 서비스의 서버만 접속을 거절합니다"><rect x="6" y="14" width="388" height="252" rx="18" fill="#f0f4f8"/><text x="200" y="46" text-anchor="middle" font-size="15" fill="#7b8da0">결제·동영상이 아닌 한 서비스 (SNS·게임 등)</text><path d="M68 118h214" stroke="#7da389" stroke-width="3"/><path class="dash" d="M68 118h214" stroke="#5f8a6d" stroke-width="3"/><g color="#869cad"><use href="#phone" x="46" y="118"/></g><g color="#749981"><use href="#bs" transform="translate(122 116) scale(.55)"/></g><rect x="178" y="96" width="62" height="44" rx="8" fill="#e7efe9" stroke="#bacfc1"/><text x="209" y="123" text-anchor="middle" font-size="15" fill="#789580">DNS</text><rect class="blink" x="276" y="72" width="104" height="92" rx="14" fill="#f6b76a" opacity=".28"/><rect x="284" y="80" width="88" height="76" rx="10" fill="#fff0dd" stroke="#d7a26a" stroke-width="2"/><text x="328" y="113" text-anchor="middle" font-size="16" font-weight="700" fill="#bb8246">서비스</text><text x="328" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#bb8246">서버</text><use href="#nok" x="122" y="186"/><use href="#nok" x="209" y="186"/><g class="handoff"><use href="#nx" x="328" y="186"/></g><g text-anchor="middle" font-size="14"><text x="122" y="224" fill="#6b8b70">통신망 정상</text><text x="209" y="224" fill="#6b8b70">주소 찾기 정상</text><text x="328" y="224" fill="#b77b3e" font-weight="700">접속 거절</text></g><text x="200" y="254" text-anchor="middle" font-size="14" fill="#8d9ca7">문제는 해당 서비스의 서버 쪽</text></svg><p>SNS·게임 같은 <b>결제·동영상이 아닌 한 서비스의 서버 쪽</b>이 접속을 거절합니다. <b>통신망과 주소 찾기(DNS)는 정상</b>입니다.</p><div class="arrow">→</div></section>
<section class="panel"><div class="tag">② 현상 · 첫째 갈래</div><h2>서버가 바로 「안 돼요」라고<br>답합니다 (인증·정책 거절)</h2><svg viewBox="0 0 400 280" role="img" aria-label="휴대폰이 들어가도 되는지 물으면 서버가 로그인 확인 고장이나 접근 차단 때문에 바로 안 된다고 답합니다. 답은 빠르게 옵니다"><rect x="6" y="14" width="388" height="252" rx="18" fill="#f0f4f8"/><text x="200" y="46" text-anchor="middle" font-size="15" fill="#7b8da0">거절 응답 (웹 오류 4xx)</text><g color="#869cad"><use href="#phone" x="56" y="116"/></g><rect x="290" y="84" width="84" height="64" rx="10" fill="#fff0dd" stroke="#d7a26a" stroke-width="2"/><text x="332" y="111" text-anchor="middle" font-size="15" font-weight="700" fill="#bb8246">서비스</text><text x="332" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#bb8246">서버</text><text x="182" y="90" text-anchor="middle" font-size="14" fill="#7b8da0">"들어가도 돼요?"</text><path d="M84 102h196m-9-7 9 7-9 7" stroke="#9fb3c2" stroke-width="3" fill="none"/><path class="handoff" d="M280 130H84m9-7-9 7 9 7" stroke="#d18340" stroke-width="3" fill="none"/><text x="182" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#b77b3e">"안 돼요" — 바로 답</text><rect x="30" y="176" width="162" height="40" rx="10" fill="#fff5e6" stroke="#e8c79f"/><text x="111" y="201" text-anchor="middle" font-size="15" font-weight="700" fill="#b77b3e">로그인 확인 고장</text><rect x="208" y="176" width="162" height="40" rx="10" fill="#fff5e6" stroke="#e8c79f"/><text x="289" y="201" text-anchor="middle" font-size="15" font-weight="700" fill="#b77b3e">접근 차단·정책</text><text x="200" y="248" text-anchor="middle" font-size="14" fill="#8d9ca7">답은 빠름 · 앱이 몇 번 더 시도</text></svg><p>로그인 확인(인증) 고장이나 접근 차단 때문에 서버가 <b>바로 「안 돼요」라고 답합니다</b>. 답은 <b>빠르게</b> 옵니다. 일부는 「요청이 너무 많다」는 제한 응답입니다.</p><div class="arrow">→</div></section>

<template id=scx-34><section id="s34" class="scn"><div class="page"><h1>24. IPv6 전용 접속 불가</h1><div class="flow">

="8" fill="#e7efe9" stroke="#bacfc1" stroke-width="1"/><text x="259" y="162" text-anchor="middle" font-size="15.5" fill="#789580"><tspan x="259" y="152.9">데이터</tspan><tspan x="259" y="170.7">중계</tspan></text><rect x="330" y="134" width="58" height="44" rx="8" fill="#e7efe9" stroke="#bacfc1" stroke-width="1"/><text x="359" y="162" text-anchor="middle" font-size="15.5" fill="#789580"><tspan x="359" y="152.9">외부망</tspan><tspan x="359" y="170.7">관문</tspan></text><text x="309" y="200" text-anchor="middle" font-size="15" fill="#789580">데이터 장비 정상</text><text x="270" y="226" text-anchor="middle" font-size="15" fill="#8c8470">같은 접속 관리 장비 아래 셀 전체 · 폭주 → 접속 관리 장비 과부하 → 인증·음성 실패</text></svg></section>

<script>
/*__I18N__*/
//: 상태 — 자료의 `status` 값, 이름, 색. 표에 없는 값은 "상태 미확인"으로 따로 센다
const STATUS=[['pass','통과','ok'],['partial','일부 통과','warn'],['missed','못 잡음','bad'],
              ['pending','판정 대기','acc'],['not_run','미실행','dim'],['excluded','제외','dim']];
const NO_STATUS='?';
const stOf=s=>STATUS.some(x=>x[0]===s.status) ? s.status : NO_STATUS;
const stName=k=>{ const x=STATUS.find(y=>y[0]===k); return T(x?x[1]:'상태 미확인'); };
const ST_ICON={pass:'✓',partial:'△',missed:'✕',pending:'◷',not_run:'○',excluded:'–'};
const stCls=k=>{ const x=STATUS.find(y=>y[0]===k); return 's-'+(x?x[2]:'warn'); };
//: 단계 — D 탐지 → L1 판정 → L2 묶음 → L3 결과. 값이 없으면 "미평가"다. 평가 전을 실패로 읽으면 안 된다
const STAGES=[['D','D 이상징후 검출'],['L1','장애 판정'],['L2','통합장애 판정'],['L3','AI 검증']];
const SG_STATE=[['ok','정상','✓','ok'],['partial','일부','△','warn'],['fail','실패','✕','bad'],
                ['na','해당 없음','–','dim'],['unknown','미평가','?','dim']];
//: 단계 칩의 짧은 이름 — 키(`D`·`L1`…)는 자료 값이라 그대로 두고 보이는 글자만 graphio 이름으로(2026-11-12)
const SG_SHORT={D:'D',L1:'장애',L2:'통합',L3:'AI'};
//: 일반인용 단계 이름(사용자 11-14) — 목록 줄·요약 칸이 쓴다. 원래 이름(`STAGES`)은 마우스를 올리면 나온다
const SG_PLAIN={D:'이상 찾기',L1:'원인 판단',L2:'여러 장애 묶기',L3:'AI 검증'};
//: 결과 한 줄 — `status` 를 문장으로. 표에 없는 값은 "상태 미확인"으로 둔다(`stName`)
const ST_PLAIN={pass:'맞혔습니다',partial:'일부만 맞혔습니다',missed:'못 잡았습니다',pending:'아직 판정 전입니다',
                not_run:'아직 돌려 보지 않았습니다',excluded:'이번 검증에서 뺀 시나리오입니다'};
const REACHED=[['none','도달 없음'],['D','D'],['L1','장애'],['L2','통합장애'],['L3','AI 검증']];
//: L3 단계는 **문답 검사(`latest.l3`)로만** 채운다(사용자 11-09) — 옛 `stages.L3`(도달·한 줄 소감)는 쓰지 않는다.
//: 검사가 없으면 미평가다. 칸 뒤 괄호는 통과한 질의 회차 수다
const L3_STAGE={pass:'ok',partial:'partial',fail:'fail'};
const l3Turns=x=>Array.isArray(x&&x.turns) ? x.turns : [];
// 한국어 해석 한 줄 — 있을 때만(원문 아래 작은 글씨)
const ko=v=>v ? `<span class=ko>${esc(v)}</span>` : '';
const l3Count=x=>{ const t=l3Turns(x); return t.length ? `${t.filter(y=>y&&y.verdict==='ok').length}/${t.length}` : ''; };
const sgOf=(s,k)=>{
  if(k==='L3'){ const x=s.latest&&s.latest.l3;
    if(!x||typeof x!=='object'||!L3_STAGE[x.status]) return null;
    const c=l3Count(x);
    return {state:L3_STAGE[x.status], detail:(c?T('질의 {n}회 중 통과 {k}회',{n:l3Turns(x).length,k:c.split('/')[0]})+' · ':'')+(x.at||'')}; }
  return (s.stages&&typeof s.stages==='object'&&s.stages[k])||null; };
const sgState=(s,k)=>{ const x=sgOf(s,k); return x&&SG_STATE.some(y=>y[0]===x.state) ? x.state : 'unknown'; };
const sgInfo=st=>SG_STATE.find(y=>y[0]===st);
const reachedOf=s=>REACHED.some(y=>y[0]===s.reached) ? s.reached : '?';
const reachedName=k=>{ const x=REACHED.find(y=>y[0]===k); return T(x?x[1]:'미평가'); };
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const unk=()=>`<span class=unk>${esc(T('미확인'))}</span>`;
//: 용어집(`scenario_glossary.json`). `Cause 73`·`S11 Cause 73`·`ESM 26` 은 번호 하나로 찾는다
let GL={}, GL_RE=null;
function setGloss(g){
  GL=g||{};
  const keys=Object.keys(GL).filter(k=>GL[k].kind!=='field'&&GL[k].kind!=='cause_no')
    .sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  GL_RE=new RegExp('(?<![A-Za-z0-9_-])(?:(?:S11|S1AP|ESM|EMM)(?: Cause)? \\d+|Cause \\d+'
    +keys.map(k=>'|'+k).join('')+')(?![A-Za-z0-9_-])','g');
}
const glOf=m=>{ const n=/^(?:S11|S1AP|ESM|EMM|Cause)\b.*?(\d+)$/.exec(m), t=GL[n?'Cause '+n[1]:m];
  return t ? (t[LANG]||t.ko) : null; };
const glTip=(m,t)=>t.l ? `${m} — ${t.s}\n${t.l}` : `${m} — ${t.s}`;
//: 이미 이스케이프한 글에 쓴다. 코드는 그대로 두고 뜻만 얹는다
const gl=h=>GL_RE ? h.replace(GL_RE,m=>{ const t=glOf(m);
  return t ? `<span class=gl data-tip="${esc(glTip(m,t))}">${m}</span>` : m; }) : h;
//: 문장 속 사건 ID(`EVT-…`) 자리표 — 그리고 나서 `upgradeEvt` 가 단위 이름 링크로 바꾼다(2026-11-10 사용자)
const EVT_RE=/EVT-[0-9a-f]{10}/g;
const evtMark=h=>h.replace(EVT_RE,id=>`<span class=evt data-evt="${id}">${id}</span>`);
const val=v=>v==null||v==='' ? unk() : evtMark(gl(esc(typeof v==='object' ? JSON.stringify(v) : v)));
//: `EVT-…` → 「L1 장애」「L2 장애」「조각」 이름(지도 링크는 11-11 에 걷었다 — 장애 ID 가 같은 곳으로 간다). 단위는 graphio 사건 표에서
//: 받는다(`/api/evt-lookup`) — 받지 못하면 ID 를 그대로 둔다(지어내지 않는다 · graphio 불변규칙 18). 원래 ID 는 툴팁
const EVT_INFO={};
const EVT_UNIT={L1_BUNDLE:'장애',L2_EVENT:'통합장애',PIECE:'이상징후'};
let EVT_BUSY=false;
async function upgradeEvt(){
  if(EVT_BUSY) return;
  const els=[...document.querySelectorAll('span.evt:not([data-done])')];
  if(!els.length) return;
  EVT_BUSY=true;
  try{
    const need=[...new Set(els.map(e=>e.dataset.evt))].filter(id=>!(id in EVT_INFO));

  const badAt=[d15,d50].findIndex(d=>!d||!d.ok), d=okd[0];
  const herr=okd.map(x=>x.how_error).find(Boolean);
  // 만드는 방법은 없으면 칸만 숨긴다. 깨진 것은 말한다 — 조용히 숨기면 없는 것으로 읽힌다
  warn(badAt>=0 ? why([d15,d50][badAt]) : herr ? T('자료 파일이 깨졌습니다 — {p} · {e}',{p:herr.path,e:herr.detail}) : '');
  // 내용이 그대로면 다시 그리지 않는다 — 읽던 자리와 스크롤을 건드리지 않게
  const raw=JSON.stringify([d.ranks,d.unnumbered,d.retired,d.shown,d.equip_kinds,d15&&d15.report,d50&&d50.report,d.how,d15&&d15.report_ja,d50&&d50.report_ja,d.glossary,d.timing,d.l3,d.l3_broken]); if(raw===RAW) return;
  RAW=raw; RANKS=d.ranks||{}; UNNUM=(d.unnumbered&&typeof d.unnumbered==='object')?d.unnumbered:{}; RETIRED=new Set((Array.isArray(d.retired)?d.retired:[]).map(String)); EQUIP=new Set(Array.isArray(d.equip_kinds)?d.equip_kinds:[]); HOW=d.how||{}; TIMING=d.timing||{};
  const pickDoc=x=>x&&x.ok ? (LANG==='ja'&&x.report_ja||x.report) : null;
  DOC=mergeVols({'15':pickDoc(d15),'50':pickDoc(d50)});
  // 순서가 있는데 판정 자료에 줄이 없는 번호(한 번도 안 돌린 시나리오 · 36번)는 「미실행」 줄로 세운다 — 빠지면 없는 시나리오로 읽힌다
  const have=new Set(DOC.scenarios.map(x=>String(x.no)));
  for(const [no,x] of Object.entries(d.shown||{})) if(!have.has(no)&&!RETIRED.has(no))
    DOC.scenarios.push({no:Number(no),name:LANG==='ja'&&x.name_ja||x.name,kind:x.kind,status:'not_run',_vol:'50',_by:{}});
  JA_LEFT=okd.reduce((n,x)=>n+(x.ja_left||0),0);
  L3LOG=Array.isArray(d.l3)?d.l3:[]; L3BROKEN=d.l3_broken||0;
  setGloss(d.glossary);
  render();
  if(!HASH_DONE){ HASH_DONE=true; goHash(); }   // 다시 받을 때는 읽던 자리를 건드리지 않는다
}
// 주입 칸·장애 창에서 넘어온 것 — `#no=23` 의 카드를 펼쳐 그 자리로 간다. 목록을 받은 뒤에만 된다.
// 이 페이지는 raw 문자열이다 — 정규식의 역슬래시를 두 번 쓰면 `#no=23` 이 맞지 않는다(2026-11-07)
function goHash(){
  const no=/^#no=(\d+)(?:&f=(F-\d+))?$/.exec(location.hash); if(!no||!DOC) return;
  FROM_FAULT=no[2]?{no:no[1],f:no[2]}:null;
  PICK='all';
  for(const k of [...OPEN]) if(k!=='notes') OPEN.delete(k);
  OPEN.add(no[1]); if(RETIRED.has(no[1])) OPEN.add('retired'); render();
  const c=document.querySelector(`details.sc[data-k="${no[1]}"]`);
  if(c) window.scrollBy(0, c.getBoundingClientRect().top-52);   // 머리글에 가리지 않게 — 아래 `toggle` 과 같은 자리
}
addEventListener('hashchange',goHash);        // 이미 이 화면에 있을 때
// 회차의 장애 ID — 이력이 있으면 지도로 가고, 없으면 가지 않고 그 자리에 말한다(그냥 보내면 "거기 있다"로 읽힌다)
document.getElementById('doc').addEventListener('click',async e=>{
  const a=e.target.closest('a.fmap'); if(!a) return;
  e.preventDefault();
  if(a.dataset.busy) return;
  const id=a.dataset.fault, msg=a.nextElementSibling;
  a.dataset.busy='1'; msg.textContent=' '+T('탐지 이력을 찾는 중');
  const inc=await faultIncidents(id), got=inc.incidents||[];
  delete a.dataset.busy;
  if(inc.error){ msg.textContent=' '+inc.error; return; }
  if(!got.length){ msg.textContent=' '+T('탐지 이력 없음'); return; }
  msg.textContent=' '+T('탐지 이력 {n}건',{n:got.length});
  location.href=faultMapUrl(id, got);
});
document.getElementById('filters').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||!DOC) return;
  // 거르면 보던 카드는 닫는다. 참고 사항 칸은 카드가 아니라 둔다
  PICK=b.dataset.k;
  for(const k of [...OPEN]) if(k!=='notes') OPEN.delete(k);
  render();
});
// `toggle` 은 거슬러 오르지 않는다 — 잡는 단계에서 받는다
document.getElementById('doc').addEventListener('toggle',e=>{
  const q=e.target; if(q.tagName!=='DETAILS') return;
  const card=q.classList.contains('sc');
  if(!q.open){
    OPEN.delete(q.dataset.k);
    if(card) for(const f of q.querySelectorAll('details.fold[open]')) f.open=false;
    return;
  }
  if(OPEN.has(q.dataset.k)) return;      // 다시 그리면서 열린 것이다
  OPEN.add(q.dataset.k);
  if(!card) return;
  // 카드는 하나만 연다. 위의 카드가 닫히면 누른 줄이 화면 밖으로 밀리니 제자리로 데려온다
  for(const o of document.querySelectorAll('details.sc[open]')) if(o!==q) o.open=false;
  const top=q.getBoundingClientRect().top;
  if(top<52) window.scrollBy(0, top-52);
},true);
//: 마우스를 올린 칸의 전체 글 — 브라우저 `title` 은 1초쯤 늦게 뜨고 줄바꿈을 못 믿는다
const TIP=document.getElementById('tip');
document.getElementById('doc').addEventListener('mouseover',e=>{
  const q=e.target.closest('[data-tip]');
  if(!q||!q.dataset.tip){ TIP.style.display='none'; return; }
  TIP.textContent=q.dataset.tip; TIP.style.display='block';
  const r=q.getBoundingClientRect(), w=TIP.offsetWidth, h=TIP.offsetHeight;
  TIP.style.left=Math.max(8,Math.min(e.clientX-12,innerWidth-w-8))+'px';
  TIP.style.top=(r.bottom+6+h>innerHeight ? r.top-h-6 : r.bottom+6)+'px';
});
document.getElementById('doc').addEventListener('mouseleave',()=>{ TIP.style.display='none'; });
applyLang();
renderVol(); load(); setInterval(load, 60000);
</script>
</body>
