<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 522" width="1180" height="522" font-family="-apple-system,'Apple SD Gothic Neo','Hiragino Sans',sans-serif"><rect width="1180" height="522" rx="14" fill="#fff" stroke="#dde2e8"/><text x="24" y="38" font-size="21" font-weight="800" fill="#1f2933">15  야마노테선에서 4G↔5G 넘어갈 때 잠깐 멈춤</text><rect x="24" y="54" width="1132" height="244" rx="10" fill="#fdf1f1" stroke="#f1c2c2"/><text x="40" y="78" font-size="13" font-weight="700" fill="#d93636">원인 — 무슨 일이 어떻게 벌어지나</text><rect x="40.0" y="90" width="344.0" height="196" rx="8" fill="#fff" stroke="#f3d3d3"/><circle cx="56.0" cy="106" r="11" fill="#d93636"/><text x="56.0" y="110.5" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">①</text><g transform="translate(162.0,166)"><ellipse rx="30" ry="20" fill="none" stroke="#2e9e5b" stroke-width="4"/><rect x="-12" y="-28" width="24" height="14" rx="4" fill="#1f2933"/><rect x="-8" y="-25" width="6" height="5" fill="#fff"/><rect x="2" y="-25" width="6" height="5" fill="#fff"/></g><g transform="translate(230.0,164) scale(0.8)" stroke="#1f2933" stroke-width="2.4" fill="none" stroke-linecap="round"><path d="M-9,18 L0,-10 L9,18 M-5,6 L5,6"/><circle cx="0" cy="-12" r="2.5" fill="#1f2933"/><path d="M-8,-19 Q-13,-12 -8,-5 M8,-19 Q13,-12 8,-5"/></g><g transform="translate(260.0,164) scale(0.8)" stroke="#1f2933" stroke-width="2.4" fill="none" stroke-linecap="round"><path d="M-9,18 L0,-10 L9,18 M-5,6 L5,6"/><circle cx="0" cy="-12" r="2.5" fill="#1f2933"/><path d="M-8,-19 Q-13,-12 -8,-5 M8,-19 Q13,-12 8,-5"/></g><g transform="translate(290.0,164) scale(0.8)" stroke="#1f2933" stroke-width="2.4" fill="none" stroke-linecap="round"><path d="M-9,18 L0,-10 L9,18 M-5,6 L5,6"/><circle cx="0" cy="-12" r="2.5" fill="#1f2933"/><path d="M-8,-19 Q-13,-12 -8,-5 M8,-19 Q13,-12 8,-5"/></g><line x1="122.0" y1="194" x2="302.0" y2="194" stroke="#2e9e5b" stroke-width="3"/><text x="212.0" y="226" font-size="13.5" fill="#1f2933" font-weight="600" text-anchor="middle">전철로 노선을 따라 이동하며 셀을 옮김</text><line x1="388.0" y1="188" x2="405.0" y2="188.0" stroke="#d93636" stroke-width="2.6"/><polygon points="414.0,188 405.0,183.0 405.0,193.0" fill="#d93636"/><rect x="418.0" y="90" width="344.0" height="196" rx="8" fill="#fff" stroke="#f3d3d3"/><circle cx="434.0" cy="106" r="11" fill="#d93636"/><text x="434.0" y="110.5" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">②</text><g transform="translate(556.0,158)"><rect x="-15" y="-10" width="30" height="20" rx="5" fill="#5b6675"/><text y="5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4G</text></g><line x1="576.0" y1="152" x2="595.0" y2="152.0" stroke="#d93636" stroke-width="2"/><polygon points="604.0,152 595.0,147.0 595.0,157.0" fill="#d93636"/><line x1="604.0" y1="164" x2="585.0" y2="164.0" stroke="#d93636" stroke-width="2"/><polygon points="576.0,164 585.0,169.0 585.0,159.0" fill="#d93636"/><g transform="translate(624.0,158)"><rect x="-15" y="-10" width="30" height="20" rx="5" fill="#d93636"/><text y="5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5G</text></g><text x="590.0" y="226" font-size="13.5" fill="#1f2933" font-weight="600" text-anchor="middle">셀을 옮길 때 4G·5G를 오감</text><line x1="766.0" y1="188" x2="783.0" y2="188.0" stroke="#d93636" stroke-width="2.6"/><polygon points="792.0,188 783.0,183.0 783.0,193.0" fill="#d93636"/><rect x="796.0" y="90" width="344.0" height="196" rx="8" fill="#fff" stroke="#f3d3d3"/><circle cx="812.0" cy="106" r="11" fill="#d93636"/><text x="812.0" y="110.5" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">③</text><path d="M883.0,130.0 L883.0,186.0 L1053.0,186.0" fill="none" stroke="#9aa5b4" stroke-width="1.6"/><path d="M883.0,146.8 L913.6,146.8 L917.0,177.6 L923.8,146.8 L964.6,146.8 L968.0,177.6 L974.8,146.8 L1015.6,146.8 L1019.0,177.6 L1025.8,146.8 L1053.0,146.8" fill="none" stroke="#d93636" stroke-width="2.8" stroke-linejoin="round"/><text x="968.0" y="204" font-size="12" fill="#5b6675" font-weight="600" text-anchor="middle">내려받기 — 전환 직후만 멈춤</text><text x="968.0" y="226" font-size="13.5" fill="#1f2933" font-weight="600" text-anchor="middle">전환 직후 3~8초 내려받기가 멈춤 (Q-08)</text><text x="968.0" y="244" font-size="13.5" fill="#1f2933" font-weight="600" text-anchor="middle">— 연결은 끊기지 않음</text><line x1="330" y1="300" x2="330.0" y2="313.0" stroke="#9aa5b4" stroke-width="2.6"/><polygon points="330,322 335.0,313.0 325.0,313.0" fill="#9aa5b4"/><rect x="24" y="326" width="620" height="176" rx="10" fill="#f4f6f9" stroke="#dde2e8"/><text x="40" y="350" font-size="13" font-weight="700" fill="#5b6675">망 어디에서</text><line x1="131" y1="398" x2="537" y2="398" stroke="#c9d1db" stroke-width="3"/><circle cx="131" cy="398" r="20" fill="#fff" stroke="#5b6675" stroke-width="2"/><g transform="translate(131,398) scale(0.62)"><rect x="-11" y="-19" width="22" height="38" rx="4" fill="none" stroke="#5b6675" stroke-width="2.4"/><circle cx="0" cy="14" r="1.8" fill="#5b6675"/></g><text x="131" y="440" text-anchor="middle" font-size="11.5" fill="#5b6675" font-weight="400">단말</text><circle cx="189" cy="398" r="20" fill="#fdeaea" stroke="#d93636" stroke-width="3.5"/><g transform="translate(189,398) scale(0.62)" stroke="#d93636" stroke-width="2.4" fill="none" stroke-linecap="round"><path d="M-9,18 L0,-10 L9,18 M-5,6 L5,6"/><circle cx="0" cy="-12" r="2.5" fill="#d93636"/><path d="M-8,-19 Q-13,-12 -8,-5 M8,-19 Q13,-12 8,-5"/></g><text x="189" y="440" text-anchor="middle" font-size="11.5" fill="#d93636" font-weight="700">기지국</text><circle cx="189" cy="398" r="27" fill="none" stroke="#d93636" stroke-width="1.6" stroke-dasharray="4 3"/><circle cx="247" cy="398" r="20" fill="#fff" stroke="#5b6675" stroke-width="2"/><text x="247" y="402" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b6675">MME</text><text x="247" y="440" text-anchor="middle" font-size="11.5" fill="#5b6675" font-weight="400">MME/AMF</text><circle cx="305" cy="398" r="20" fill="#fff" stroke="#5b6675" stroke-width="2"/><text x="305" y="402" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b6675">SGW</text><text x="305" y="440" text-anchor="middle" font-size="11.5" fill="#5b6675" font-weight="400">SGW/UPF</text><circle cx="363" cy="398" r="20" fill="#fff" stroke="#5b6675" stroke-width="2"/><text x="363" y="402" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b6675">PGW</text><text x="363" y="440" text-anchor="middle" font-size="11.5" fill="#5b6675" font-weight="400">PGW</text><circle cx="421" cy="398" r="20" fill="#fff" stroke="#5b6675" stroke-width="2"/><text x="421" y="402" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b6675">IMS</text><text x="421" y="440" text-anchor="middle" font-size="11.5" fill="#5b6675" font-weight="400">IMS(음성)</text><circle cx="479" cy="398" r="20" fill="#fff" stroke="#5b6675" stroke-width="2"/><text x="479" y="402" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b6675">DNS</text><text x="479" y="440" text-anchor="middle" font-size="11.5" fill="#5b6675" font-weight="400">DNS</text><circle cx="537" cy="398" r="20" fill="#fff" stroke="#5b6675" stroke-width="2"/><g transform="translate(537,399) scale(.62)" fill="none" stroke="#5b6675" stroke-width="2.2"><rect x="-13" y="-15" width="26" height="9" rx="2"/><circle cx="-7" cy="-10.5" r="1.4" fill="#5b6675"/><rect x="-13" y="-4" width="26" height="9" rx="2"/><circle cx="-7" cy="0.5" r="1.4" fill="#5b6675"/><rect x="-13" y="7" width="26" height="9" rx="2"/><circle cx="-7" cy="11.5" r="1.4" fill="#5b6675"/></g><text x="537" y="440" text-anchor="middle" font-size="11.5" fill="#5b6675" font-weight="400">인터넷 서버</text><text x="334" y="468" font-size="13.5" fill="#3b434f" font-weight="400" text-anchor="middle">노선을 따라 길게 늘어선 셀에서, 셀을 옮기는 세션만.</text><line x1="648" y1="414" x2="667.0" y2="414.0" stroke="#9aa5b4" stroke-width="3"/><polygon points="676,414 667.0,409.0 667.0,419.0" fill="#9aa5b4"/><rect x="680" y="326" width="476" height="176" rx="10" fill="#fff8ec" stroke="#f0d9a8"/><text x="696" y="350" font-size="13" font-weight="700" fill="#b36b00">이용자에게 보이는 것</text><rect x="706" y="358" width="92" height="124" rx="12" fill="#fff" stroke="#1f2933" stroke-width="2.6"/><rect x="714" y="370" width="76" height="96" rx="4" fill="#e08a00" opacity=".12"/><circle cx="752" cy="474" r="2.6" fill="#1f2933"/><text x="752" y="400" font-size="13.5" fill="#e08a00" font-weight="800" text-anchor="middle">잠깐</text><text x="752" y="420" font-size="13.5" fill="#e08a00" font-weight="800" text-anchor="middle">멈춤</text><g transform="translate(830,376) scale(0.9)" fill="#7a4a00"><circle cx="0" cy="-10" r="5"/><path d="M-8,10 Q-8,-3 0,-3 Q8,-3 8,10 Z"/></g><line x1="838" y1="374" x2="843.0" y2="374.0" stroke="#7a4a00" stroke-width="2"/><polygon points="852,374 843.0,369.0 843.0,379.0" fill="#7a4a00"/><text x="866" y="377" font-size="13" fill="#7a4a00" font-weight="700" text-anchor="start">노선을 따라 이동 중인 사람만 (머무는</text><text x="866" y="394" font-size="13" fill="#7a4a00" font-weight="700" text-anchor="start">사람은 평소)</text><circle cx="846" cy="413" r="9" fill="#b36b00"/><text x="846" y="417.5" font-size="11.5" fill="#fff" font-weight="800" text-anchor="middle">1</text><text x="862" y="418" font-size="13.5" fill="#1f2933" font-weight="600" text-anchor="start">역 사이마다 잠깐 멈춤</text><circle cx="846" cy="439" r="9" fill="#b36b00"/><text x="846" y="443.5" font-size="11.5" fill="#fff" font-weight="800" text-anchor="middle">2</text><text x="862" y="444" font-size="13.5" fill="#1f2933" font-weight="600" text-anchor="start">몇 초 뒤 다시 이어짐</text><circle cx="846" cy="465" r="9" fill="#b36b00"/><text x="846" y="469.5" font-size="11.5" fill="#fff" font-weight="800" text-anchor="middle">3</text><text x="862" y="470" font-size="13.5" fill="#1f2933" font-weight="600" text-anchor="start">같은 셀에 있으면 평소대로</text></svg>