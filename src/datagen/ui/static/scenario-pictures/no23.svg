="20" fill="#fff" stroke="#5b6675" stroke-width="2"/><text x="624" y="126" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b6675">IMS</text><text x="624" y="164" text-anchor="middle" font-size="10.5" fill="#5b6675" font-weight="400">IMS(음성)</text><circle cx="682" cy="122" r="20" fill="#fff" stroke="#5b6675" stroke-width="2"/><text x="682" y="126" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b6675">DNS</text><text x="682" y="164" text-anchor="middle" font-size="10.5" fill="#5b6675" font-weight="400">DNS</text><circle cx="740" cy="122" r="20" fill="#fff" stroke="#5b6675" stroke-width="2"/><g transform="translate(740,123) scale(.62)" fill="none" stroke="#5b6675" stroke-width="2.2"><rect x="-13" y="-15" width="26" height="9" rx="2"/><circle cx="-7" cy="-10.5" r="1.4" fill="#5b6675"/><rect x="-13" y="-4" width="26" height="9" rx="2"/><circle cx="-7" cy="0.5" r="1.4" fill="#5b6675"/><rect x="-13" y="7" width="26" height="9" rx="2"/><circle cx="-7" cy="11.5" r="1.4" fill="#5b6675"/></g><text x="740" y="164" text-anchor="middle" font-size="10.5" fill="#5b6675" font-weight="400">인터넷 서버</text><text x="539" y="192" font-size="12.5" fill="#3b434f" font-weight="400" text-anchor="middle">행사장 기지국의 올리는 쪽(업링크)이 가득 찬다.</text><line x1="778" y1="133" x2="812" y2="133" stroke="#9aa5b4" stroke-width="3"/><polygon points="820,133 809,126 809,140" fill="#9aa5b4"/><rect x="824" y="58" width="332" height="150" rx="10" fill="#fff8ec" stroke="#f0d9a8"/><text x="838" y="80" font-size="12" font-weight="700" fill="#b36b00">이용자에게 보이는 것</text><g transform="translate(866,135) scale(1.3)"><rect x="-11" y="-19" width="22" height="38" rx="4" fill="none" stroke="#1f2933" stroke-width="2.4"/><circle cx="0" cy="14" r="1.8" fill="#1f2933"/></g><g transform="translate(866,133)" fill="#d93636"><polygon points="0,-16 -11,-3 -4,-3 -4,12 4,12 4,-3 11,-3"/></g><text x="900" y="112" font-size="14" fill="#1f2933" font-weight="700" text-anchor="start">사진·영상 올리기가 안 됨</text><rect x="24" y="222" width="560" height="60" rx="10" fill="#fff" stroke="#bfc7d2" stroke-dasharray="6 4"/><text x="38" y="244" font-size="12" font-weight="700" fill="#8a94a3">헷갈리는 것 (구분해야 함)</text><text x="38" y="266" font-size="13" fill="#4a5260" font-weight="400" text-anchor="start">기지국 고장 — 내려받기는 비교적 버틴다</text><rect x="600" y="222" width="556" height="60" rx="10" fill="#eef8f2" stroke="#b9e0c8"/><text x="614" y="244" font-size="12" font-weight="700" fill="#2e9e5b">결과 — 시스템이 내리는 결론</text><text x="614" y="266" font-size="13.5" fill="#1f2933" font-weight="700" text-anchor="start">행사 군중 혼잡</text></svg>