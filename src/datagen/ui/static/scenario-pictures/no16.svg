<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 300" width="1180" height="300" font-family="-apple-system,'Apple SD Gothic Neo','Hiragino Sans',sans-serif"><rect width="1180" height="300" rx="14" fill="#fff" stroke="#dde2e8"/><text x="24" y="38" font-size="20" font-weight="800" fill="#1f2933">16  5G는 잡히는데 느림 (4G 앵커 붐빔)</text><rect x="24" y="58" width="230" height="150" rx="10" fill="#fdf1f1" stroke="#f1c2c2"/><text x="38" y="80" font-size="12" font-weight="700" fill="#d93636">원인</text><g transform="translate(123,118)"><rect x="-15" y="-10" width="30" height="20" rx="5" fill="#5b6675"/><text y="5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4G</text></g><g transform="translate(157,118)"><rect x="-15" y="-10" width="30" height="20" rx="5" fill="#d93636"/><text y="5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5G</text></g><polygon transform="translate(140,117) scale(0.5)" points="6,-22 -10,4 0,4 -6,22 12,-6 2,-6 8,-22" fill="#e08a00"/><text x="139" y="168" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">5G를 붙잡아 주는 4G 기지국이</text><text x="139" y="185" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">붐빔</text><line x1="258" y1="133" x2="292" y2="133" stroke="#9aa5b4" stroke-width="3"/><polygon points="300,133 289,126 289,140" fill="#9aa5b4"/><rect x="304" y="58" width="470" height="150" rx="10" fill="#f4f6f9" stroke="#dde2e8"/><text x="318" y="80" font-size="12" font-weight="700" fill="#5b6675">망 어디에서</text><line x1="334" y1="122" x2="740" y2="122" stroke="#c9d1db" stroke-width="3"/><circle cx="334" cy="122" r="20" fill="#fff" stroke="#5b6675" stroke-width="2"/><g transform="translate(334,122) scale(0.62)"><rect x="-11" y="-19" width="22" height="38" rx="4" fill="none" stroke="#5b6675" stroke-width="2.4"/><circle cx="0" cy="14" r="1.8" fill="#5b6675"/></g><text x="334" y="164" text-anchor="middle" font-size="10.5" fill="#5b6675" font-weight="400">단말</text><circle cx="392" cy="122" r="20" fill="#fdeaea" stroke="#d93636" stroke-width="3.5"/><g transform="translate(392,122) scale(0.62)" stroke="#d93636" stroke-width="2.4" fill="none" stroke-linecap="round"><path d="M-9,18 L0,-10 L9,18 M-5,6 L5,6"/><circle cx="0" cy="-12" r="2.5" fill="#d93636"/><path d="M-8,-19 Q-13,-12 -8,-5 M8,-19 Q13,-12 8,-5"/></g><text x="392" y="164" text-anchor="middle" font-size="10.5" fill="#d93636" font-weight="700">기지국</text><circle cx="392" cy="122" r="27" fill="none" stroke="#d93636" stroke-width="1.6" stroke-dasharray="4 3"/><circle cx="450" cy="122" r="20" fill="#fff" stroke="#5b6675" stroke-width="2"/><text x="450" y="126" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b6675">MME</text><text x="450" y="164" text-anchor="middle" font-size="10.5" fill="#5b6675" font-weight="400">MME/AMF</text><circle cx="508" cy="122" r="20" fill="#fff" stroke="#5b6675" stroke-width="2"/><text x="508" y="126" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b6675">SGW</text><text x="508" y="164" text-anchor="middle" font-size="10.5" fill="#5b6675" font-weight="400">SGW/UPF</text><circle cx="566" cy="122" r="20" fill="#fff" stroke="#5b6675" stroke-width="2"/><text x="566" y="126" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b6675">PGW</text><text x="566" y="164" text-anchor="middle" font-size="10.5" fill="#5b6675" font-weight="400">PGW</text><circle cx="624" cy="122" r="20" fill="#fff" stroke="#5b6675" stroke-width="2"/><text x="624" y="126" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b6675">IMS</text><text x="624" y="164" text-anchor="middle" font-size="10.5" fill="#5b6675" font-weight="400">IMS(음성)</text><circle cx="682" cy="122" r="20" fill="#fff" stroke="#5b6675" stroke-width="2"/><text x="682" y="126" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b6675">DNS</text><text x="682" y="164" text-anchor="middle" font-size="10.5" fill="#5b6675" font-weight="400">DNS</text><circle cx="740" cy="122" r="20" fill="#fff" stroke="#5b6675" stroke-width="2"/><g transform="translate(740,123) scale(.62)" fill="none" stroke="#5b6675" stroke-width="2.2"><rect x="-13" y="-15" width="26" height="9" rx="2"/><circle cx="-7" cy="-10.5" r="1.4" fill="#5b6675"/><rect x="-13" y="-4" width="26" height="9" rx="2"/><circle cx="-7" cy="0.5" r="1.4" fill="#5b6675"/><rect x="-13" y="7" width="26" height="9" rx="2"/><circle cx="-7" cy="11.5" r="1.4" fill="#5b6675"/></g><text x="740" y="164" text-anchor="middle" font-size="10.5" fill="#5b6675" font-weight="400">인터넷 서버</text><text x="539" y="192" font-size="12.5" fill="#3b434f" font-weight="400" text-anchor="middle">5G를 쓰려면 4G 기지국(앵커)을 거치는데, 그 4G가 막힌다.</text><line x1="778" y1="133" x2="812" y2="133" stroke="#9aa5b4" stroke-width="3"/><polygon points="820,133 809,126 809,140" fill="#9aa5b4"/><rect x="824" y="58" width="332" height="150" rx="10" fill="#fff8ec" stroke="#f0d9a8"/><text x="838" y="80" font-size="12" font-weight="700" fill="#b36b00">이용자에게 보이는 것</text><g transform="translate(866,135) scale(1.3)"><rect x="-11" y="-19" width="22" height="38" rx="4" fill="none" stroke="#1f2933" stroke-width="2.4"/><circle cx="0" cy="14" r="1.8" fill="#1f2933"/></g><g transform="translate(866,133)" fill="none" stroke="#d93636" stroke-width="2.4"><circle r="13"/><path d="M0,-7 L0,0 L6,4"/></g><text x="900" y="112" font-size="14" fill="#1f2933" font-weight="700" text-anchor="start">5G 표시는 뜨는데 5G 속도가</text><text x="900" y="132" font-size="14" fill="#1f2933" font-weight="700" text-anchor="start">안 나옴</text><rect x="24" y="222" width="560" height="60" rx="10" fill="#fff" stroke="#bfc7d2" stroke-dasharray="6 4"/><text x="38" y="244" font-size="12" font-weight="700" fill="#8a94a3">헷갈리는 것 (구분해야 함)</text><text x="38" y="266" font-size="13" fill="#4a5260" font-weight="400" text-anchor="start">5G 기지국 고장 — 그러면 5G 표시가 사라진다</text><rect x="600" y="222" width="556" height="60" rx="10" fill="#eef8f2" stroke="#b9e0c8"/><text x="614" y="244" font-size="12" font-weight="700" fill="#2e9e5b">결과 — 시스템이 내리는 결론</text><text x="614" y="266" font-size="13.5" fill="#1f2933" font-weight="700" text-anchor="start">5G 품질 저하 (4G 앵커 경합)</text></svg>