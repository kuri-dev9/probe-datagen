<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 522" width="1180" height="522" font-family="-apple-system,'Apple SD Gothic Neo','Hiragino Sans',sans-serif"><rect width="1180" height="522" rx="14" fill="#fff" stroke="#dde2e8"/><text x="24" y="38" font-size="21" font-weight="800" fill="#1f2933">16  5G 잡히는데 느림 (4G 앵커 혼잡)</text><rect x="24" y="54" width="1132" height="244" rx="10" fill="#fdf1f1" stroke="#f1c2c2"/><text x="40" y="78" font-size="13" font-weight="700" fill="#d93636">원인 — 무슨 일이 어떻게 벌어지나</text><rect x="40.0" y="90" width="344.0" height="196" rx="8" fill="#fff" stroke="#f3d3d3"/><circle cx="56.0" cy="106" r="11" fill="#d93636"/><text x="56.0" y="110.5" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">①</text><g transform="translate(176.0,158) scale(1.2)" stroke="#1f2933" stroke-width="2.4" fill="none" stroke-linecap="round"><path d="M-9,18 L0,-10 L9,18 M-5,6 L5,6"/><circle cx="0" cy="-12" r="2.5" fill="#1f2933"/><path d="M-8,-19 Q-13,-12 -8,-5 M8,-19 Q13,-12 8,-5"/></g><g transform="translate(176.0,192)"><rect x="-15" y="-10" width="30" height="20" rx="5" fill="#5b6675"/><text y="5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4G</text></g><g transform="translate(248.0,158) scale(1.2)" stroke="#1f2933" stroke-width="2.4" fill="none" stroke-linecap="round"><path d="M-9,18 L0,-10 L9,18 M-5,6 L5,6"/><circle cx="0" cy="-12" r="2.5" fill="#1f2933"/><path d="M-8,-19 Q-13,-12 -8,-5 M8,-19 Q13,-12 8,-5"/></g><g transform="translate(248.0,192)"><rect x="-15" y="-10" width="30" height="20" rx="5" fill="#2f6fd6"/><text y="5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5G</text></g><line x1="192.0" y1="150" x2="232.0" y2="150" stroke="#5b6675" stroke-width="2.4" stroke-dasharray="4 3"/><text x="212.0" y="226" font-size="13.5" fill="#1f2933" font-weight="600" text-anchor="middle">5G로 붙은 단말은 4G 기지국(앵커)도 함께</text><text x="212.0" y="244" font-size="13.5" fill="#1f2933" font-weight="600" text-anchor="middle