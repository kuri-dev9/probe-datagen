636"/><path d="M-8,-19 Q-13,-12 -8,-5 M8,-19 Q13,-12 8,-5"/></g><text x="189" y="440" text-anchor="middle" font-size="11.5" fill="#d93636" font-weight="700">기지국</text><circle cx="189" cy="398" r="27" fill="none" stroke="#d93636" stroke-width="1.6" stroke-dasharray="4 3"/><circle cx="247" cy="398" r="20" fill="#fff" stroke="#5b6675" stroke-width="2"/><text x="247" y="402" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b6675">MME</text><text x="247" y="440" text-anchor="middle" font-size="11.5" fill="#5b6675" font-weight="400">MME/AMF</text><circle cx="305" cy="398" r="20" fill="#fff" stroke="#5b6675" stroke-width="2"/><text x="305" y="402" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b6675">SGW</text><text x="305" y="440" text-anchor="middle" font-size="11.5" fill="#5b6675" font-weight="400">SGW/UPF</text><circle cx="363" cy="398" r="20" fill="#fff" stroke="#5b6675" stroke-width="2"/><text x="363" y="402" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b6675">PGW</text><text x="363" y="440" text-anchor="middle" font-size="11.5" fill="#5b6675" font-weight="400">PGW</text><circle cx="421" cy="398" r="20" fill="#fff" stroke="#5b6675" stroke-width="2"/><text x="421" y="402" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b6675">IMS</text><text x="421" y="440" text-anchor="middle" font-size="11.5" fill="#5b6675" font-weight="400">IMS(음성)</text><circle cx="479" cy="398" r="20" fill="#fff" stroke="#5b6675" stroke-width="2"/><text x="479" y="402" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b6675">DNS</text><text x="479" y="440" text-anchor="middle" font-size="11.5" fill="#5b6675" font-weight="400">DNS</text><circle cx="537" cy="398" r="20" fill="#fff" stroke="#5b6675" stroke-width="2"/><g transform="translate(537,399) scale(.62)" fill="none" stroke="#5b6675" stroke-width="2.2"><rect x="-13" y="-15" width="26" height="9" rx="2"/><circle cx="-7" cy="-10.5" r="1.4" fill="#5b6675"/><rect x="-13" y="-4" width="26" height="9" rx="2"/><circle cx="-7" cy="0.5" r="1.4" fill="#5b6675"/><rect x="-13" y="7" width="26" height="9" rx="2"/><circle cx="-7" cy="11.5" r="1.4" fill="#5b6675"/></g><text x="537" y="440" text-anchor="middle" font-size="11.5" fill="#5b6675" font-weight="400">인터넷 서버</text><text x="334" y="468" font-size="13.5" fill="#3b434f" font-weight="400" text-anchor="middle">5G를 쓰려면 4G 기지국(앵커)을 거치는데, 그 4G가 막힌다.</text><line x1="648" y1="414" x2="667.0" y2="414.0" stroke="#9aa5b4" stroke-width="3"/><polygon points="676,414 667.0,409.0 667.0,419.0" fill="#9aa5b4"/><rect x="680" y="326" width="476" height="176" rx="10" fill="#fff8ec" stroke="#f0d9a8"/><text x="696" y="350" font-size="13" font-weight="700" fill="#b36b00">이용자에게 보이는 것</text><rect x="706" y="358" width="92" height="124" rx="12" fill="#fff" stroke="#1f2933" stroke-width="2.6"/><rect x="714" y="370" width="76" height="96" rx="4" fill="#e08a00" opacity=".12"/><circle cx="752" cy="474" r="2.6" fill="#1f2933"/><text x="752" y="400" font-size="13.5" fill="#e08a00" font-weight="800" text-anchor="middle">5G</text><text x="752" y="420" font-size="13.5" fill="#e08a00" font-weight="800" text-anchor="middle">느림…</text><g transform="translate(836,376) scale(1)" fill="#7a4a00"><circle cx="0" cy="-10" r="5"/><path d="M-8,10 Q-8,-3 0,-3 Q8,-3 8,10 Z"/></g><text x="866" y="377" font-size="13" fill="#7a4a00" font-weight="700" text-anchor="start">그 지역에서 5G로 붙은 사람만 (4G</text><text x="866" y="394" font-size="13" fill="#7a4a00" font-weight="700" text-anchor="start">이용자는 평소)</text><circle cx="846" cy="413" r="9" fill="#b36b00"/><text x="846" y="417.5" font-size="11.5" fill="#fff" font-weight="800" text-anchor="middle">1</text><text x="862" y="418" font-size="13.5" fill="#1f2933" font-weight="600" text-anchor="start">5G 표시는 그대로</text><circle cx="846" cy="439" r="9" fill="#b36b00"/><text x="846" y="443.5" font-size="11.5" fill="#fff" font-weight="800" text-anchor="middle">2</text><text x="862" y="444" font-size="13.5" fil